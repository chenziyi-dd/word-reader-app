<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#4a90d9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="单词阅读器">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>四川中考单词阅读器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#f0f2f5;color:#333;line-height:1.8;padding-bottom:env(safe-area-inset-bottom)}
.header{background:linear-gradient(135deg,#4a90d9,#357abd);color:#fff;padding:18px 30px;box-shadow:0 2px 12px rgba(0,0,0,.15);position:sticky;top:0;z-index:100;padding-top:max(18px,env(safe-area-inset-top))}
.student-bar{background:#f0f4f8;padding:8px 30px;border-bottom:1px solid #ddd;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.student-bar label{font-size:14px;color:#555;font-weight:600;white-space:nowrap}
.student-bar select{padding:4px 10px;border:1px solid #ccc;border-radius:4px;font-size:14px;max-width:200px}
.student-bar input{padding:4px 10px;border:1px solid #ccc;border-radius:4px;font-size:14px;width:120px}
.student-bar button{padding:4px 12px;border:none;border-radius:4px;font-size:13px;cursor:pointer;white-space:nowrap}
.student-bar .btn-add{background:#4a90d9;color:#fff}
.student-bar .btn-add:hover{background:#357abd}
.student-bar .btn-del{background:#e74c3c;color:#fff}
.student-bar .btn-del:hover{background:#c0392b}
.student-bar .student-hint{color:#999;font-size:12px;margin-left:auto}
.student-name-display{color:#4a90d9;font-weight:700}
.header h1{font-size:22px;margin-bottom:4px}
.header .stats{font-size:13px;opacity:.9}
.header .stats span{margin-right:15px}
.install-btn{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);color:#fff;padding:3px 12px;border-radius:14px;font-size:12px;cursor:pointer;display:none;margin-left:8px}
.install-btn:hover{background:rgba(255,255,255,.3)}

.category-bar{display:flex;gap:6px;padding:8px 12px;overflow-x:auto;background:#e8eaf0;border-bottom:2px solid #ccc;flex-wrap:nowrap}
.cat-btn{padding:8px 18px;border-radius:20px;font-size:14px;font-weight:bold;cursor:pointer;background:#d4d7e0;color:#444;transition:all .15s;white-space:nowrap;flex-shrink:0;border:2px solid transparent}
.cat-btn:hover{background:#c0c4d8}
.cat-btn.active{background:#4a90d9;color:#fff;border-color:#2c6fb0}
.tabs{display:flex;flex-wrap:wrap;gap:6px;padding:12px 20px;background:#fff;border-bottom:1px solid #e0e0e0;position:sticky;top:62px;z-index:99;box-shadow:0 1px 4px rgba(0,0,0,.05);overflow-x:auto;flex-wrap:nowrap}
.tab{padding:6px 14px;border-radius:16px;font-size:13px;cursor:pointer;background:#f0f0f0;color:#666;transition:all .15s;white-space:nowrap;flex-shrink:0}
.tab:hover{background:#e3f2fd;color:#1565c0}
.tab.active{background:#4a90d9;color:#fff;font-weight:600}
.tab-review{background:#fff3e0;color:#e65100}
.tab-review.active{background:#ff9800;color:#fff}
.container{max-width:900px;margin:0 auto;padding:16px}
.instructions{background:#e8f5e9;border-radius:8px;padding:10px 18px;margin-bottom:12px;font-size:13px;color:#2e7d32;display:flex;gap:18px;flex-wrap:wrap}
.review-bank{background:#fff;border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.review-bank h2{font-size:17px;color:#357abd;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.review-words{display:flex;flex-wrap:wrap;gap:7px;min-height:34px;align-items:center}
.review-chip{background:#fff3cd;border:1px solid #ffeaa7;color:#856404;padding:4px 12px;border-radius:16px;font-size:13px;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:4px}
.review-chip:hover{background:#ffeaa7;transform:translateY(-1px)}
.review-chip .rm{color:#ccc;font-size:11px;cursor:pointer}
.review-chip .rm:hover{color:#e53935}
.review-empty{color:#bbb;font-size:13px;font-style:italic}
.clear-btn{margin-left:auto;font-size:12px;color:#999;cursor:pointer;border:none;background:none;text-decoration:underline}
.clear-btn:hover{color:#e53935}
.article{background:#fff;border-radius:12px;padding:28px 36px;box-shadow:0 2px 8px rgba(0,0,0,.05);display:none}
.article.active{display:block}
.article h2{font-size:21px;color:#2c3e50;text-align:center;margin-bottom:20px;padding-bottom:12px;border-bottom:2px solid #ecf0f1}
.article p{font-size:16px;line-height:2.1;margin-bottom:14px;text-align:justify}
.word{background:#e3f2fd;color:#1565c0;padding:1px 4px;border-radius:3px;cursor:pointer;font-weight:600;transition:all .15s;border-bottom:2px solid transparent}
.word:hover{background:#bbdefb;border-bottom-color:#1565c0}
.word.in-review{background:#fff9c4;color:#e65100;border-bottom-color:#ffc107}
.word.in-review:hover{background:#fff59d}
.popup-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.35);display:none;z-index:1000;align-items:center;justify-content:center}
.popup-overlay.active{display:flex}
.popup-card{background:#fff;border-radius:16px;padding:28px;width:90%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:popIn .2s ease}
@keyframes popIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.popup-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.nav-btn{background:#f0f0f0;border:none;width:30px;height:30px;border-radius:50%;font-size:14px;cursor:pointer;color:#666}
.nav-btn:hover{background:#e0e0e0}
.popup-word{font-size:26px;font-weight:bold;color:#2c3e50;display:flex;align-items:center;gap:10px}
.speak-btn{background:#4a90d9;color:#fff;border:none;width:36px;height:36px;border-radius:50%;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.speak-btn:hover{background:#357abd;transform:scale(1.1)}
.popup-ph{font-size:15px;color:#888;margin:6px 0;font-style:italic}
.popup-cn{font-size:17px;color:#333;margin:8px 0}
.popup-col{background:#f0f7ff;border-left:4px solid #4a90d9;padding:10px 14px;border-radius:8px;margin:12px 0}
.popup-col .lbl{font-size:12px;color:#4a90d9;font-weight:bold;margin-bottom:3px}
.popup-col .ct{font-size:14px;color:#555;line-height:1.6}
.popup-act{margin-top:16px;display:flex;gap:8px}
.pbtn{flex:1;padding:9px;border:none;border-radius:8px;font-size:14px;cursor:pointer;font-weight:500}
.pbtn-add{background:#ff9800;color:#fff}
.pbtn-add:hover{background:#f57c00}
.pbtn-add.added{background:#4caf50}
.pbtn-close{background:#f0f0f0;color:#666}
.pbtn-close:hover{background:#e0e0e0}
.ctx-menu{position:fixed;background:#fff;border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,.15);padding:5px 0;display:none;z-index:2000;min-width:150px}
.ctx-menu.active{display:block}
.ctx-item{padding:7px 14px;cursor:pointer;font-size:13px;color:#333}
.ctx-item:hover{background:#f0f7ff;color:#4a90d9}
.read-bar{text-align:center;margin-bottom:12px}
.read-btn{background:#4a90d9;color:#fff;border:none;padding:7px 22px;border-radius:20px;font-size:13px;cursor:pointer}
.read-btn:hover{background:#357abd}
.read-btn.reading{background:#e53935}
.note-section{background:#fff;border-radius:12px;padding:18px 24px;margin:16px auto;max-width:900px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.note-section h3{font-size:16px;color:#357abd;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.note-area{width:100%;min-height:90px;border:1.5px solid #e0e0e0;border-radius:8px;padding:12px;font-size:14px;line-height:1.7;resize:vertical;font-family:inherit;transition:border-color .2s;background:#fcfcfc}
.note-area:focus{border-color:#4a90d9;outline:none;background:#fff}
.note-hint{font-size:12px;color:#bbb;margin-top:5px;text-align:right}
.draw-section{background:#fff;border-radius:12px;padding:18px 24px;margin:16px auto;max-width:900px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.draw-section h3{font-size:16px;color:#357abd;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.draw-toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.draw-tool{padding:4px 10px;border-radius:6px;border:1.5px solid #ddd;background:#fff;cursor:pointer;font-size:13px;transition:all .15s;display:inline-flex;align-items:center}
.draw-tool:hover{border-color:#4a90d9}
.draw-tool.active{background:#4a90d9;color:#fff;border-color:#4a90d9}
.color-dot{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:middle;margin-right:4px;border:1px solid #ddd}
.draw-canvas-wrap{position:relative;border:1.5px solid #e0e0e0;border-radius:8px;overflow:hidden;background:#fff}
.draw-canvas{display:block;cursor:crosshair;touch-action:none}
.draw-sep{margin:0 3px;color:#ccc;font-size:13px}

/* === 语法填空 === */
.fillblank-section{background:#fafafa;border-radius:12px;padding:18px 24px;margin-top:20px;box-shadow:0 2px 8px rgba(0,0,0,.05);border-top:3px solid #4a90d9}
.fillblank-section h3{font-size:16px;color:#357abd;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.fillblank-content{font-size:16px;line-height:2.8;text-align:justify}
.fillblank-content p{margin-bottom:10px}
.blank-wrap{display:inline}
.blank-input{border:none;border-bottom:2px solid #4a90d9;background:#f0f7ff;padding:2px 8px;font-size:15px;font-family:inherit;min-width:90px;text-align:center;border-radius:4px 4px 0 0;outline:none;transition:all .2s;color:#333}
.blank-input:focus{background:#e3f2fd;border-bottom-color:#1565c0}
.blank-input.correct{background:#c8e6c9;border-bottom-color:#4caf50;color:#2e7d32;font-weight:600}
.blank-input.wrong{background:#ffcdd2;border-bottom-color:#e53935;color:#c62828}
.blank-hint{font-size:12px;color:#999;font-style:italic;margin-left:1px;margin-right:2px}
.blank-answer{font-size:13px;color:#4caf50;font-weight:600;margin-left:4px;display:none}
.blank-answer.show{display:inline}
.fillblank-actions{margin-top:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fb-btn{padding:7px 18px;border:none;border-radius:8px;font-size:14px;cursor:pointer;font-weight:500;transition:all .15s}
.fb-check{background:#4a90d9;color:#fff}
.fb-check:hover{background:#357abd}
.fb-reset{background:#f0f0f0;color:#666}
.fb-reset:hover{background:#e0e0e0}
.fillblank-score{font-size:14px;font-weight:600;margin-left:auto}

/* === 抗遗忘复习模块 === */
.review-module{max-width:900px;margin:0 auto;padding:16px;display:none}
.review-module.active{display:block}
.review-stats{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.stat-card{background:#fff;border-radius:12px;padding:16px 24px;flex:1;min-width:100px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.stat-card .num{font-size:28px;font-weight:bold;color:#357abd}
.stat-card .lbl{font-size:12px;color:#999;margin-top:4px}
.stat-card.due .num{color:#e65100}
.stat-card.mastered .num{color:#4caf50}
.review-start-btn{display:block;margin:20px auto;padding:12px 40px;background:#4a90d9;color:#fff;border:none;border-radius:25px;font-size:16px;cursor:pointer;transition:all .2s}
.review-start-btn:hover{background:#357abd;transform:translateY(-2px);box-shadow:0 4px 12px rgba(74,144,217,.4)}
.review-start-btn:disabled{background:#ccc;cursor:not-allowed;transform:none;box-shadow:none}
.review-card{background:#fff;border-radius:16px;padding:32px;max-width:500px;margin:20px auto;box-shadow:0 4px 20px rgba(0,0,0,.08);text-align:center}
.review-progress{font-size:13px;color:#999;margin-bottom:8px}
.review-progress-bar{height:6px;background:#e0e0e0;border-radius:3px;margin:8px 0 20px;overflow:hidden}
.review-progress-bar .fill{height:100%;background:linear-gradient(90deg,#4a90d9,#357abd);border-radius:3px;transition:width .3s}
.review-word{font-size:32px;font-weight:bold;color:#2c3e50;margin:20px 0}
.review-ph{font-size:16px;color:#888;font-style:italic;margin:8px 0}
.review-cn{font-size:20px;color:#333;margin:10px 0}
.review-col-box{background:#f0f7ff;border-left:4px solid #4a90d9;padding:10px 14px;border-radius:8px;margin:14px 0;text-align:left;font-size:14px;color:#555}
.review-actions{display:flex;gap:12px;margin-top:20px;justify-content:center}
.rbtn{padding:12px 30px;border:none;border-radius:25px;font-size:16px;cursor:pointer;font-weight:600;transition:all .2s}
.rbtn-show{background:#4a90d9;color:#fff}
.rbtn-show:hover{background:#357abd}
.rbtn-remember{background:#4caf50;color:#fff}
.rbtn-remember:hover{background:#43a047}
.rbtn-forgot{background:#ff7043;color:#fff}
.rbtn-forgot:hover{background:#f4511e}
.rbtn:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.15)}
.review-summary{text-align:center;padding:30px}
.review-summary h3{font-size:22px;color:#2c3e50;margin-bottom:16px}
.review-summary .nums{display:flex;gap:30px;justify-content:center;margin:20px 0}
.review-summary .nums div{text-align:center}
.review-summary .nums .n{font-size:36px;font-weight:bold}
.review-summary .nums .remembered .n{color:#4caf50}
.review-summary .nums .forgot .n{color:#ff7043}
.review-summary .nums .lbl{font-size:13px;color:#999;margin-top:4px}
.review-empty-msg{text-align:center;padding:40px;color:#999;font-size:15px}
.review-schedule{margin-top:20px}
.review-schedule h3{font-size:16px;color:#357abd;margin-bottom:10px}
.review-schedule-list{display:flex;flex-wrap:wrap;gap:7px}
.review-chip .stage-badge{display:inline-block;font-size:10px;padding:1px 5px;border-radius:8px;margin-left:4px;font-weight:600;vertical-align:middle}
.review-chip .stage-badge.s0{background:#ffe0b2;color:#e65100}
.review-chip .stage-badge.s1{background:#ffe0b2;color:#e65100}
.review-chip .stage-badge.s2{background:#c8e6c9;color:#2e7d32}
.review-chip .stage-badge.s3{background:#c8e6c9;color:#2e7d32}
.review-chip .stage-badge.s4{background:#b3e5fc;color:#0277bd}
.review-chip .stage-badge.s5{background:#b3e5fc;color:#0277bd}
.review-chip .stage-badge.s6{background:#e1bee7;color:#7b1fa2}
.review-chip .next-due{font-size:10px;color:#aaa;margin-left:3px}
.review-chip .next-due.due{color:#e53935;font-weight:600}
.review-chip .next-due.mastered{color:#7b1fa2}

@media(max-width:600px){
.article{padding:18px}.article p{font-size:14px;line-height:2}
.container{padding:8px}.header{padding:12px 16px}.header h1{font-size:18px}
.tabs{padding:8px 12px;top:54px}.instructions{font-size:11px;gap:10px}
.note-section{padding:12px}.draw-section{padding:12px}.note-area{font-size:13px}
.draw-tool{font-size:12px;padding:3px 8px}
.fillblank-section{padding:14px}.fillblank-content{font-size:14px;line-height:2.4}
.blank-input{font-size:14px;min-width:70px}
.review-card{padding:20px}.review-word{font-size:26px}
.review-stats{gap:8px}.stat-card{padding:12px 16px}.stat-card .num{font-size:22px}
.fillblank-content{font-size:14px}
}
</style>
</head>
<body data-version="v8-fix3">
<div class="header">
<h1>📖 四川中考单词阅读器</h1>
<div class="stats">
<span id="total-count">共 0 个单词</span>
<span id="review-count">重点复习: 0 个</span>
<span>第 <span id="cur-article">1</span>/93 篇</span>
<button class="install-btn" id="install-btn">📱 安装到手机</button>
</div>
<div class="student-bar" id="student-bar">
  <div class="student-bar-inner">
    <label class="student-label">学生：</label>
    <select id="student-select" class="student-select" onchange="switchStudent()"></select>
    <input type="text" id="student-input" class="student-input" placeholder="输入新学生名字">
    <button id="add-student-btn" class="student-btn add-btn" onclick="addStudent()">+ 添加</button>
    <button id="delete-student-btn" class="student-btn delete-btn" onclick="deleteStudent()">删除</button>
    <span id="student-hint" class="student-hint-text"></span>
  </div>
</div>

</div>
<div class="category-bar" id="category-bar"></div>
<div class="tabs" id="tabs"></div>
<div class="container">
<div class="instructions">
<span>👆 点击单词：读音+释义</span>
<span>🖱️ 右键：加入复习</span>
<span>📝 文章下方：语法填空</span>
<span>🧠 抗遗忘复习tab</span>
<span>💾 自动保存</span>
</div>
<div class="read-bar" id="read-bar"><button class="read-btn" id="read-btn">🔊 朗读本篇</button></div>
<div class="review-bank">
<h2>⭐ 重点复习单词库 <button class="clear-btn" id="clear-btn" style="display:none">清空</button></h2>
<div class="review-words" id="review-words"><span class="review-empty">右键点击文章中的单词即可添加</span></div>
</div>
<div id="articles-container"></div>
<div id="review-module" class="review-module"></div>
<div class="note-section" id="note-section">
<h3>📝 我的笔记（第 <span id="note-art-num">1</span> 篇）</h3>
<textarea class="note-area" id="note-area" placeholder="在这里写笔记、心得、不懂的句子……自动保存，换一篇文章笔记也跟着换。"></textarea>
<div class="note-hint">💡 自动保存到浏览器</div>
</div>
<div class="draw-section" id="draw-section">
<h3>🖌️ 画板 / 草稿纸</h3>
<div class="draw-toolbar">
<button class="draw-tool active" data-color="#333" data-type="pen"><span class="color-dot" style="background:#333"></span>黑笔</button>
<button class="draw-tool" data-color="#e53935" data-type="pen"><span class="color-dot" style="background:#e53935"></span>红笔</button>
<button class="draw-tool" data-color="#1565c0" data-type="pen"><span class="color-dot" style="background:#1565c0"></span>蓝笔</button>
<button class="draw-tool" data-color="#4caf50" data-type="pen"><span class="color-dot" style="background:#4caf50"></span>绿笔</button>
<button class="draw-tool" data-color="#ff9800" data-type="pen"><span class="color-dot" style="background:#ff9800"></span>橙笔</button>
<span class="draw-sep">|</span>
<button class="draw-tool" data-type="eraser">🧹 橡皮擦</button>
<span class="draw-sep">|</span>
<button class="draw-tool" data-size="2">细笔</button>
<button class="draw-tool active" data-size="3">中笔</button>
<button class="draw-tool" data-size="6">粗笔</button>
<span class="draw-sep">|</span>
<button class="draw-tool" id="draw-clear">🗑️ 清空</button>
<button class="draw-tool" id="draw-save">💾 保存图片</button>
</div>
<div class="draw-canvas-wrap">
<canvas class="draw-canvas" id="draw-canvas"></canvas>
</div>
</div>
</div>
<div class="popup-overlay" id="popup-overlay">
<div class="popup-card">
<div class="popup-nav">
<button class="nav-btn" id="prev-word">◀</button>
<span style="font-size:12px;color:#aaa" id="word-idx"></span>
<button class="nav-btn" id="next-word">▶</button>
</div>
<div class="popup-word"><span id="popup-en"></span><button class="speak-btn" id="speak-btn">🔊</button></div>
<div class="popup-ph" id="popup-ph"></div>
<div class="popup-cn" id="popup-cn"></div>
<div class="popup-col"><div class="lbl" id="popup-col-label">📌 中考固定搭配</div><div class="ct" id="popup-col"></div></div>
<div class="popup-act">
<button class="pbtn pbtn-add" id="add-btn">➕ 加入重点复习</button>
<button class="pbtn pbtn-close" id="close-btn">关闭</button>
</div>
</div>
</div>
<div class="ctx-menu" id="ctx-menu">
<div class="ctx-item" id="ctx-add">➕ 加入重点复习</div>
<div class="ctx-item" id="ctx-remove" style="display:none">❌ 移出重点复习</div>
<div class="ctx-item" id="ctx-speak">🔊 朗读</div>
</div>

=\"word\" data-word=\"buy\">buys</span> everything for the <span class=\"word\" data-word=\"boy\">boy.</span></p>"},{"title":"My Favorite Subject","html":"<p><span class=\"word\" data-word=\"why\">Why</span> do I love <span class=\"word\" data-word=\"science\">science</span>? <span class=\"word\" data-word=\"because\">Because</span> it is <span class=\"word\" data-word=\"useful\">useful</span>! My favorite subject is <span class=\"word\" data-word=\"science\">science.</span> But I also like <span class=\"word\" data-word=\"music\">music,</span> <span class=\"word\" data-word=\"math/maths\">math,</span> P.E., <span class=\"word\" data-word=\"geography\">geography,</span> and <span class=\"word\" data-word=\"history\">history.</span> Each subject is interesting in its own way.</p><p><span class=\"word\" data-word=\"from\">From</span> <span class=\"word\" data-word=\"Monday\">Monday</span> to <span class=\"word\" data-word=\"Friday\">Friday,</span> I have <span class=\"word\" data-word=\"lesson\">lessons</span> at school. On <span class=\"word\" data-word=\"Tuesday\">Tuesday,</span> I have <span class=\"word\" data-word=\"math/maths\">math</span> and <span class=\"word\" data-word=\"science\">science.</span> On <span class=\"word\" data-word=\"Wednesday\">Wednesday,</span> I have <span class=\"word\" data-word=\"history\">history</span> and <span class=\"word\" data-word=\"geography\">geography.</span> On <span class=\"word\" data-word=\"Thursday\">Thursday,</span> I have <span class=\"word\" data-word=\"music\">music</span> and art. On <span class=\"word\" data-word=\"Friday\">Friday,</span> I have P.E. and English. <span class=\"word\" data-word=\"Saturday\">Saturday</span> and <span class=\"word\" data-word=\"Sunday\">Sunday</span> are <span class=\"word\" data-word=\"free\">free</span>! That is <span class=\"word\" data-word=\"cool\">cool.</span></p><p>Mrs. Chen is my <span class=\"word\" data-word=\"science\">science</span> teacher. She is great. Mr. Wang teaches <span class=\"word\" data-word=\"history\">history.</span> He says, \"You must <span class=\"word\" data-word=\"finish\">finish</span> your homework every day.\" Each <span class=\"word\" data-word=\"lesson\">lesson</span> is one <span class=\"word\" data-word=\"hour\">hour</span> long. <span class=\"word\" data-word=\"from\">From</span> morning to afternoon, we learn many <span class=\"word\" data-word=\"useful\">useful</span> things. I think every subject is important. Some are easy, some are hard, but all are <span class=\"word\" data-word=\"useful\">useful</span> for our future.</p>"},{"title":"Join Our Club","html":"<p>Welcome to our <span class=\"word\" data-word=\"club\">club</span>! Can you <span class=\"word\" data-word=\"sing\">sing</span> <span class=\"word\" data-word=\"or\">or</span> <span class=\"word\" data-word=\"dance\">dance</span>? Can you <span class=\"word\" data-word=\"swim\">swim,</span> <span class=\"word\" data-word=\"draw\">draw,</span> <span class=\"word\" data-word=\"or\">or</span> play <span class=\"word\" data-word=\"chess\">chess</span>? Can you <span class=\"word\" data-word=\"speak\">speak</span> English <span class=\"word\" data-word=\"or\">or</span> play the <span class=\"word\" data-word=\"guitar\">guitar,</span> the <span class=\"word\" data-word=\"drum\">drum,</span> the <span class=\"word\" data-word=\"piano\">piano,</span> <span class=\"word\" data-word=\"or\">or</span> the <span class=\"word\" data-word=\"violin\">violin</span>? We want you to <span class=\"word\" data-word=\"join\">join</span> us! Come to the <span class=\"word\" data-word=\"center/centre\">center</span> this <span class=\"word\" data-word=\"weekend\">weekend.</span></p><p><span class=\"word\" data-word=\"today\">Today,</span> we will <span class=\"word\" data-word=\"make\">make</span> music and <span class=\"word\" data-word=\"tell\">tell</span> <span class=\"word\" data-word=\"story\">stories.</span> A <span class=\"word\" data-word=\"musician\">musician</span> will <span class=\"word\" data-word=\"show\">show</span> us how to <span class=\"word\" data-word=\"write\">write</span> a song. <span class=\"word\" data-word=\"people\">People</span> from our town will come to listen and <span class=\"word\" data-word=\"talk\">talk.</span> You can <span class=\"word\" data-word=\"also\">also</span> <span class=\"word\" data-word=\"teach\">teach</span> kids at <span class=\"word\" data-word=\"home\">home.</span> Our teacher says, \"Get <span class=\"word\" data-word=\"up\">up</span> <span class=\"word\" data-word=\"early\">early,</span> <span class=\"word\" data-word=\"dress\">dress</span> well, <span class=\"word\" data-word=\"brush\">brush</span> your teeth, and take a <span class=\"word\" data-word=\"shower\">shower.</span>\" That is a good habit.</p><p>I <span class=\"word\" data-word=\"usually\">usually</span> get <span class=\"word\" data-word=\"up\">up</span> at six. I <span class=\"word\" data-word=\"never\">never</span> <span class=\"word\" data-word=\"run\">run</span> late. My <span class=\"word\" data-word=\"job\">job</span> is to help at the radio <span class=\"word\" data-word=\"station\">station.</span> At <span class=\"word\" data-word=\"night\">night,</span> I do my <span class=\"word\" data-word=\"homework\">homework</span> and <span class=\"word\" data-word=\"clean\">clean</span> my room. I <span class=\"word\" data-word=\"exercise\">exercise</span> with a <span class=\"word\" data-word=\"group\">group</span> every day. <span class=\"word\" data-word=\"half\">Half</span> <span class=\"word\" data-word=\"past\">past</span> six in the evening, I read. At a <span class=\"word\" data-word=\"quarter\">quarter</span> to nine, I go to bed. It is <span class=\"word\" data-word=\"funny\">funny</span> how a good routine <span class=\"word\" data-word=\"make\">makes</span> life better. <span class=\"word\" data-word=\"forty\">Forty</span> <span class=\"word\" data-word=\"or\">or</span> <span class=\"word\" data-word=\"fifty\">fifty</span> <span class=\"word\" data-word=\"people\">people</span> come to our <span class=\"word\" data-word=\"club\">club</span> every week.</p>"},{"title":"How Do You Get to School?","html":"<p>How do you get to school? Do you <span class=\"word\" data-word=\"walk\">walk</span> or take a <span class=\"word\" data-word=\"bus\">bus</span>? Some students <span class=\"word\" data-word=\"ride\">ride</span> a <span class=\"word\" data-word=\"bike/bicycle\">bike.</span> Others take the <span class=\"word\" data-word=\"subway\">subway</span> or <span class=\"word\" data-word=\"drive\">drive</span> a <span class=\"word\" data-word=\"car\">car.</span> <span class=\"word\" data-word=\"every\">Every</span> <span class=\"word\" data-word=\"minute\">minute</span> counts when you <span class=\"word\" data-word=\"live\">live</span> <span class=\"word\" data-word=\"far\">far</span> away.</p><p>I <span class=\"word\" data-word=\"live\">live</span> in a <span class=\"word\" data-word=\"village\">village</span> across the <span class=\"word\" data-word=\"river\">river.</span> There is no <span class=\"word\" data-word=\"bridge\">bridge,</span> so I must take a <span class=\"word\" data-word=\"boat\">boat</span> to <span class=\"word\" data-word=\"cross\">cross</span> the water. <span class=\"word\" data-word=\"many\">Many</span> students in my <span class=\"word\" data-word=\"village\">village</span> <span class=\"word\" data-word=\"leave\">leave</span> home early. It is a long way to school. But we are not <span class=\"word\" data-word=\"afraid\">afraid.</span> We have a <span class=\"word\" data-word=\"dream\">dream,</span> and we want to make it come <span class=\"word\" data-word=\"true\">true.</span></p><p>In our town, there are <span class=\"word\" data-word=\"rule\">rules.</span> You must <span class=\"word\" data-word=\"arrive\">arrive</span> on time. You must <span class=\"word\" data-word=\"listen\">listen</span> in the <span class=\"word\" data-word=\"hall\">hall</span> and not <span class=\"word\" data-word=\"fight\">fight.</span> Do not <span class=\"word\" data-word=\"bring\">bring</span> food <span class=\"word\" data-word=\"outside\">outside.</span> <span class=\"word\" data-word=\"wear\">Wear</span> your uniform. It is <span class=\"word\" data-word=\"important\">important</span> to follow these <span class=\"word\" data-word=\"rule\">rules.</span> A <span class=\"word\" data-word=\"new\">new</span> <span class=\"word\" data-word=\"train\">train</span> <span class=\"word\" data-word=\"stop\">stops</span> at our station <span class=\"word\" data-word=\"every\">every</span> <span class=\"word\" data-word=\"year\">year.</span> <span class=\"word\" data-word=\"sixty\">Sixty,</span> <span class=\"word\" data-word=\"seventy\">seventy,</span> <span class=\"word\" data-word=\"eighty\">eighty,</span> <span class=\"word\" data-word=\"ninety\">ninety,</span> or even a <span class=\"word\" data-word=\"hundred\">hundred</span> people <span class=\"word\" data-word=\"ride\">ride</span> it daily. <span class=\"word\" data-word=\"by\">By</span> the way, the <span class=\"word\" data-word=\"kilometer\">kilometer</span> is the unit we use. We <span class=\"word\" data-word=\"stop\">stop</span> at <span class=\"word\" data-word=\"every\">every</span> <span class=\"word\" data-word=\"cross\">cross.</span> <span class=\"word\" data-word=\"life\">Life</span> here is simple but happy.</p>"},{"title":"A Visit to the Zoo","html":"<p>Let me tell you about the <span class=\"word\" data-word=\"animal\">animals</span> I saw at the <span class=\"word\" data-word=\"zoo\">zoo.</span> First, I saw a <span class=\"word\" data-word=\"giraffe\">giraffe</span> with a long neck and long <span class=\"word\" data-word=\"leg\">legs.</span> It was eating leaves from a tall <span class=\"word\" data-word=\"tree\">tree.</span> Then I saw a <span class=\"word\" data-word=\"lazy\">lazy</span> <span class=\"word\" data-word=\"lion\">lion</span> <span class=\"word\" data-word=\"sleep\">sleeping</span> in the sun. A cute <span class=\"word\" data-word=\"panda\">panda</span> was sitting nearby, eating bamboo. An <span class=\"word\" data-word=\"elephant\">elephant</span> was drinking <span class=\"word\" data-word=\"water\">water</span> with its big mouth.</p><p>I also saw a <span class=\"word\" data-word=\"shy\">shy</span> <span class=\"word\" data-word=\"tiger\">tiger</span> and a <span class=\"word\" data-word=\"friendly\">friendly</span> <span class=\"word\" data-word=\"cat\">cat.</span> A <span class=\"word\" data-word=\"beautiful\">beautiful</span> bird was singing. Some <span class=\"word\" data-word=\"animal\">animals</span> are in <span class=\"word\" data-word=\"danger\">danger,</span> and we must <span class=\"word\" data-word=\"save\">save</span> them. The <span class=\"word\" data-word=\"zoo\">zoo</span> is a <span class=\"word\" data-word=\"place\">place</span> to <span class=\"word\" data-word=\"learn\">learn</span> about <span class=\"word\" data-word=\"animal\">animals</span> and protect them.</p><p>An Australian student told me about koalas. They <span class=\"word\" data-word=\"sleep\">sleep</span> a lot! My <span class=\"word\" data-word=\"pet\">pet</span> dog at home is very <span class=\"word\" data-word=\"smart\">smart.</span> It can <span class=\"word\" data-word=\"cut\">cut</span> through the grass and run fast. Do not <span class=\"word\" data-word=\"forget\">forget</span>: every <span class=\"word\" data-word=\"animal\">animal</span> is special. We should be <span class=\"word\" data-word=\"kind\">kind</span> to all of them. Do not <span class=\"word\" data-word=\"kill\">kill</span> <span class=\"word\" data-word=\"animal\">animals</span> for fun. Each one is a <span class=\"word\" data-word=\"symbol\">symbol</span> of our natural world. Let us protect them together.</p>"},{"title":"A Rainy Day","html":"<p>It was a <span class=\"word\" data-word=\"cold\">cold</span> and <span class=\"word\" data-word=\"cloudy\">cloudy</span> day. The weather was <span class=\"word\" data-word=\"rainy\">rainy</span> and windy. <span class=\"word\" data-word=\"snow\">Snow</span> fell on the <span class=\"word\" data-word=\"mountain\">mountain.</span> It was a <span class=\"word\" data-word=\"dry\">dry</span> <span class=\"word\" data-word=\"summer\">summer,</span> but today was different. \"It will be <span class=\"word\" data-word=\"sunny\">sunny</span> <span class=\"word\" data-word=\"soon\">soon,</span>\" said the <span class=\"word\" data-word=\"man\">man</span> on TV. But I did not think so.</p><p>I sat in my <span class=\"word\" data-word=\"house\">house</span> and drank some <span class=\"word\" data-word=\"tea\">tea.</span> My <span class=\"word\" data-word=\"young\">young</span> friend was in the living room, reading a <span class=\"word\" data-word=\"newspaper\">newspaper.</span> \"Do you want to <span class=\"word\" data-word=\"cook\">cook</span> something?\" he asked. \"Yes, let us make some <span class=\"word\" data-word=\"juice\">juice</span> and <span class=\"word\" data-word=\"wash\">wash</span> the dishes.\" Outside, a <span class=\"word\" data-word=\"Russian\">Russian</span> boy was <span class=\"word\" data-word=\"skate\">skating</span> on the ice. Another <span class=\"word\" data-word=\"child\">child</span> was <span class=\"word\" data-word=\"sit\">sitting</span> by the <span class=\"word\" data-word=\"pool\">pool.</span></p><p><span class=\"word\" data-word=\"tomorrow\">Tomorrow,</span> the weather will be warm <span class=\"word\" data-word=\"again\">again.</span> We will visit the <span class=\"word\" data-word=\"park\">park</span> and <span class=\"word\" data-word=\"study\">study</span> in the <span class=\"word\" data-word=\"supermarket\">supermarket.</span> \"I <span class=\"word\" data-word=\"miss\">miss</span> the good weather,\" said my friend. \"Me too.\" It is <span class=\"word\" data-word=\"hard\">hard</span> to be inside on a <span class=\"word\" data-word=\"bad\">bad</span> day. But a <span class=\"word\" data-word=\"message\">message</span> from my friend said, \"Come and <span class=\"word\" data-word=\"shop\">shop</span> with me! There is a <span class=\"word\" data-word=\"race\">race</span> in town.\" I <span class=\"word\" data-word=\"still\">still</span> feel <span class=\"word\" data-word=\"bad\">bad</span> about the weather. \"Do not worry,\" he said. \"<span class=\"word\" data-word=\"soon\">Soon</span> it will be <span class=\"word\" data-word=\"hot\">hot</span> and bright <span class=\"word\" data-word=\"again\">again.</span>\" <span class=\"word\" data-word=\"Canada\">Canada</span> has <span class=\"word\" data-word=\"cold\">cold</span> winters, but we have fun anyway.</p>"},{"title":"Around Town","html":"<p>Let me <span class=\"word\" data-word=\"describe\">describe</span> my <span class=\"word\" data-word=\"town\">town.</span> There is a <span class=\"word\" data-word=\"hospital\">hospital</span> on the <span class=\"word\" data-word=\"left\">left</span> side of the <span class=\"word\" data-word=\"street\">street.</span> <span class=\"word\" data-word=\"near\">Near</span> the <span class=\"word\" data-word=\"hospital\">hospital,</span> there is a <span class=\"word\" data-word=\"bank\">bank</span> and a <span class=\"word\" data-word=\"post\">post</span> <span class=\"word\" data-word=\"office\">office.</span> On the <span class=\"word\" data-word=\"right\">right,</span> you can see a <span class=\"word\" data-word=\"restaurant\">restaurant</span> and a <span class=\"word\" data-word=\"hotel\">hotel.</span> If you <span class=\"word\" data-word=\"turn\">turn</span> <span class=\"word\" data-word=\"right\">right</span> at the cross, you will find a <span class=\"word\" data-word=\"police\">police</span> station. The library is <span class=\"word\" data-word=\"behind\">behind</span> the <span class=\"word\" data-word=\"hospital\">hospital.</span></p><p>In <span class=\"word\" data-word=\ tle":"Unit 1 - 第1单元课文","html":"<p>Last summer, I went on a <span class=\"word\" data-word=\"fantastic\">fantastic</span> <span class=\"word\" data-word=\"vacation\">vacation</span> to Yunnan with my family. We stayed at a <span class=\"word\" data-word=\"comfortable\">comfortable</span> <span class=\"word\" data-word=\"hotel\">hotel</span> in an <span class=\"word\" data-word=\"ancient\">ancient</span> <span class=\"word\" data-word=\"town\">town</span> surrounded by breathtaking <span class=\"word\" data-word=\"scenery\">scenery</span>. The <span class=\"word\" data-word=\"landscape\">landscape</span> there was simply amazing — everywhere I looked, there were majestic mountains and crystal-clear rivers stretching as far as the eye could see.</p><p>On the first day of our trip, we visited a <span class=\"word\" data-word=\"camp\">camp</span> near the peaceful <span class=\"word\" data-word=\"countryside\">countryside</span>. Our tour <span class=\"word\" data-word=\"guide\">guide</span> told us that <span class=\"word\" data-word=\"thousands of\">thousands of</span> tourists come here every year to experience the natural beauty. The magnificent view of the snow-capped mountains truly took my <span class=\"word\" data-word=\"breath\">breath</span> away, and I had never seen such wonderful <span class=\"word\" data-word=\"scenery\">scenery</span> before in my life. For lunch, we tried the local <span class=\"word\" data-word=\"steamed chicken soup\">steamed chicken soup</span>, a famous dish that was <span class=\"word\" data-word=\"especially\">especially</span> delicious and warming after a long morning of hiking.</p><p>The next morning, we walked <span class=\"word\" data-word=\"towards\">towards</span> the bustling <span class=\"word\" data-word=\"town\">town</span> <span class=\"word\" data-word=\"square\">square</span> to explore the local markets. My mom bought a beautiful <span class=\"word\" data-word=\"silk\">silk</span> <span class=\"word\" data-word=\"scarf\">scarf</span> at a small shop, and I was <span class=\"word\" data-word=\"surprised\">surprised</span> by how affordable everything was compared to the big city. <span class=\"word\" data-word=\"during\">During</span> our stroll through the old streets, we also visited a grand <span class=\"word\" data-word=\"palace\">palace</span> and a towering <span class=\"word\" data-word=\"tower\">tower</span> from <span class=\"word\" data-word=\"ancient\">ancient</span> times, where the intricate <span class=\"word\" data-word=\"artwork\">artwork</span> inside left us speechless.</p><p>By <span class=\"word\" data-word=\"noon\">noon</span>, the <span class=\"word\" data-word=\"sky\">sky</span> had cleared to a brilliant blue, and we could even see a <span class=\"word\" data-word=\"rainbow\">rainbow</span> arching across the horizon after a brief morning shower. I felt <span class=\"word\" data-word=\"bored\">bored</span> for <span class=\"word\" data-word=\"nothing\">nothing</span> — there was simply so much to see and do at every turn! A friendly stranger told us about a hidden temple perched on a distant hill, and we eagerly decided to make the trek there before heading home.</p><p>On our last day, I woke up early to watch the sunrise from the mountain peak. The famous <span class=\"word\" data-word=\"Sea of Clouds\">Sea of Clouds</span> stretched below us like an endless white ocean, and it looked like a living painting. I will never <span class=\"word\" data-word=\"forget\">forget</span> this incredible journey. If you ever have a chance to travel <span class=\"word\" data-word=\"anywhere\">anywhere</span> in China, I highly recommend Yunnan — the peaceful atmosphere and stunning views will <span class=\"word\" data-word=\"remind\">remind</span> you of how wonderful nature can be. Just don't <span class=\"word\" data-word=\"forget\">forget</span> to bring your <span class=\"word\" data-word=\"passport\">passport</span> and plan your <span class=\"word\" data-word=\"budget\">budget</span> carefully for the trip of a lifetime!</p>"},{"title":"Unit 2 - 第2单元课文","html":"<p>Last weekend, my best friend invited me to her <span class=\"word\" data-word=\"apartment\">apartment</span> for an exciting <span class=\"word\" data-word=\"treasure hunt\">treasure hunt</span> game. When I arrived, she was still tidying up the <span class=\"word\" data-word=\"living room\">living room</span> and organizing her <span class=\"word\" data-word=\"bedroom\">bedroom</span>. \"Come in! I'm <span class=\"word\" data-word=\"almost\">almost</span> ready,\" she said with a bright smile that showed her <span class=\"word\" data-word=\"joy\">joy</span>.</p><p>We had originally planned to <span class=\"word\" data-word=\"go shopping\">go shopping</span> first, but then she pulled out a mysterious <span class=\"word\" data-word=\"note\">note</span> with clues hidden all around the <span class=\"word\" data-word=\"community\">community</span>. \"Look for the first clue in the kitchen,\" she whispered excitedly. I rushed to the kitchen and pulled open a drawer, finding a folded piece of paper tucked under a <span class=\"word\" data-word=\"plate\">plate</span>: \"Go to the place where we watch films.\"</p><p>I ran to the cinema room and searched everywhere <span class=\"word\" data-word=\"until\">until</span> I spotted another clue taped to the back of the TV. After following <span class=\"word\" data-word=\"several\">several</span> more clues — including one that required me to use <span class=\"word\" data-word=\"scissors\">scissors</span> to cut open an envelope — I finally found a beautifully decorated box. Inside was the real <span class=\"word\" data-word=\"treasure\">treasure</span>: a gorgeous handmade notebook.</p><p>\"This is to celebrate your birthday!\" she exclaimed. I was so surprised that I <span class=\"word\" data-word=\"almost\">almost</span> cried — I had completely forgotten my own birthday was coming up. We shared the adventure story with other friends who came over to get together, and one friend, an aspiring <span class=\"word\" data-word=\"writer\">writer</span>, described the whole experience in a lengthy <span class=\"word\" data-word=\"text\">text</span> message to everyone in our group chat.</p><p>\"Never mind the mess,\" my friend said cheerfully, looking at the <span class=\"word\" data-word=\"rubbish\">rubbish</span> scattered from our enthusiastic search. We laughed together and cleaned up the <span class=\"word\" data-word=\"treasure hunt\">treasure hunt</span> debris, agreeing it was the best game ever. \"<span class=\"word\" data-word=\"perhaps\">Perhaps</span> next time, we can <span class=\"word\" data-word=\"plan\">plan</span> an even bigger one,\" she suggested. Just then, I smelled something wonderful — she had also baked a cake! The <span class=\"word\" data-word=\"joy\">joy</span> of true friendship, I realized, was the real <span class=\"word\" data-word=\"treasure\">treasure</span> all along.</p><p>We joked about organizing a <span class=\"word\" data-word=\"treasure\">treasure</span> hunt in the countryside next time. I'm quite <span class=\"word\" data-word=\"familiar\">familiar</span> with her creative ideas — she always comes up with the most imaginative plans. \"Watch out!\" she suddenly cried, as I <span class=\"word\" data-word=\"almost\">almost</span> tripped over the <span class=\"word\" data-word=\"luggage\">luggage</span> she had packed for our upcoming trip together. What a memorable day it turned out to be!</p>"},{"title":"Unit 3 - 第3单元课文","html":"<p>In our class, everyone has a distinctly different <span class=\"word\" data-word=\"personality\">personality</span>. Some students are quiet and <span class=\"word\" data-word=\"shy\">shy</span>, while others are <span class=\"word\" data-word=\"outgoing\">outgoing</span> and <span class=\"word\" data-word=\"loud\">loud</span>, filling the room with laughter. My best friend Lily is hardworking and always performs at the top of her class. She plays the <span class=\"word\" data-word=\"flute\">flute</span> beautifully and won first <span class=\"word\" data-word=\"prize\">prize</span> at the city music competition last month.</p><p>\"Congratulations!\" we all cheered when she walked into the classroom holding her trophy. She had attended the awards ceremony with her proud parents by her side. <span class=\"word\" data-word=\"besides\">Besides</span> music, Lily also has a passion for traditional paper cutting. She decorates her entire apartment with beautiful artwork made of colorful paper, using scissors, glue, and creative posters to craft amazing designs that amaze everyone who visits.</p><p>Lily and I have a lot in common despite our differences. We both enjoy reading novels and spending our <span class=\"word\" data-word=\"spare time\">spare time</span> at the local community center, where we volunteer and help younger children with their homework. In <span class=\"word\" data-word=\"fact\">fact</span>, our <span class=\"word\" data-word=\"appearance\">appearance</span> is quite different — she is <span class=\"word\" data-word=\"slim\">slim</span> with a <span class=\"word\" data-word=\"serious\">serious</span> face, while I am more lively and expressive. But our shared hobbies and values bring us together in ways that go far beyond looks.</p><p>Last week, we compared our strengths during a class project on environmental protection. Lily is excellent at solving logical problems, while I am better at performing in plays and presenting to an audience. Our teacher smiled and said, \"As hardworking students, you should learn from each other's strengths.\" That was a genuine <span class=\"word\" data-word=\"pleasure\">pleasure</span> to hear, and it reminded us why we made such a great team.</p><p>Lily is also remarkably <span class=\"word\" data-word=\"honest\">honest</span> and <span class=\"word\" data-word=\"direct\">direct</span> in everything she says. She never hesitates to share her <span class=\"word\" data-word=\"opinion\">opinion</span>, even when it might be unpopular. \"To be <span class=\"word\" data-word=\"honest\">honest</span>,\" she often says with a gentle smile, \"I think we can always do better if we try harder.\" <span class=\"word\" data-word=\"thanks to\">Thanks to</span> her wonderful <span class=\"word\" data-word=\"sense\">sense</span> of humor, even the most <span class=\"word\" data-word=\"serious\">serious</span> topics become fun and engaging when she talks about them.</p><p>Our <span class=\"word\" data-word=\"friendship\">friendship</span> has many layers, much like the similarities and differences that define us. We both like to block out noise when studying, covering our ears and sticking to our plans with determination. Sometimes we argue over small things, but we always make up quickly. \"It's a <span class=\"word\" data-word=\"fact\">fact</span> that best friends fight,\" Lily says with a wink. I couldn't agree more. The <span class=\"word\" data-word=\"difference\">difference</span> between us is exactly what makes our <span class=\"word\" data-word=\"friendship\">friendship</span> stronger, and I hope we will always stay this close, no matter where life takes us.</p>"},{"title":"Unit 4 - 第4单元课文","html":"<p>Nature is full of extraordinary wonders, and our <span class=\"word\" data-word=\"planet\">planet</span> is home to some truly amazing creatures and plants. The giant redwood trees in California, for example, can live for thousands of years and are the tallest trees on Earth. A single tree can <span class=\"word\" data-word=\"weigh\">weigh</span> as much as 1,000 kilograms and reach over 100 meters tall, towering over the forest like ancient giants.</p><p>In Africa, the cheetah holds the title of the fastest land animal, capable of running at speeds of 120 kilometers per hour. However, it can only maintain this incredible speed for a short distance before needing to rest. The <span class=\"word\" data-word=\"butterfly\">butterfly</span>, though <span class=\"word\" data-word=\"tiny\">tiny</span> and delicate, can travel thousands of kilometers during its annual migration, proving that even the smallest creatures are <span class=\"word\" data-word=\"connected\">connected</span> to the grand patterns of nature in remarkable ways.</p><p>Plants and animals are <span class=\"word\" data-word=\"connected\">connected</span> in fascinating and complex relationships. The <span class=\"word\" data-word=\"rose\">rose</span>, <span class=\"word\" data-word=\"peony\">peony</span>, and <span class=\"word\" data-word=\"lotus\">lotus</span> are all beautiful flowers that <span class=\"word\" data-word=\"appear\">appear</span> in different seasons, each bringing its own unique colors to the landscape. The <span class=\"word\" data-word=\"ginkgo\">ginkgo</span> tree, native to China, has fan-shaped leaves that turn a brilliant golden yellow in autumn. Frogs live near water, and their population depends heavily on rainfall and the changing <span class=\"word\" data-word=\"climate\">climate</span> of their habitat.</p><p>Among the most important creatures in nature, bees play a vital <span class=\"word\" data-word=\"role\">role</span> in our <span class=\"word\" data-word=\"ecosystem\">ecosystem</span>. They collect <span class=\"word\" data-word=\"pollen\">pollen</span> from flowers and help with <span class=\"word\" data-word=\"pollination\">pollination</span>, a process that allows plants to reproduce. <span class=\"word\" data-word=\"without\">Without</span> bees, many plants simply cannot produce fruit or seeds. A single hive can be home to thousands of bees that <span class=\"word\" data-word=\"communicate\">communicate</span> through intricate dance movements and <span class=\"word\" data-word=\"store\">store</span> <span class=\"word\" data-word=\"honey\">honey</span> in their waxy <span class=\"word\" data-word=\"honeycomb\">honeycomb</span> structures.</p><p>Unfortunately, bee populations around the world are declining at an alarming rate. <span class=\"word\" data-word=\"for this reason\">For this reason</span>, scientists are working urgently to <span class=\"word\" data-word=\"protect\">protect</span> them and their habitats. <span class=\"word\" data-word=\"in fact\">In fact</span>, about 80 <span class=\"word\" data-word=\"percent\">percent</span> of our food depends directly on bee <span class=\"word\" data-word=\"pollination\">pollination</span>. <span class=\"word\" data-word=\"human\">Human</span> activities — from pesticide use to urban expansion — have a significant impact on nature, and we need to take immediate <span class=\"word\" data-word=\"action\">action</span> to <span class=\"word\" data-word=\"protect\">protect</span> the environment before it is too late.</p><p>Every animal, no matter how small, has a <span class=\"word\" data-word=\"role\">role</span> to play in the web of life. Ants work together tirelessly to build their homes, while the vast <span class=\"word\" data-word=\"ocean\">ocean</span> is home to countless species — <span class=\"word\" data-word=\"except\">except</span> in <span class=\"word\" data-word=\"the Arctic Ocean\">the Arctic Ocean</span>, where only the strongest creatures can survive the freezing temperatures. As the <span class=\"word\" data-word=\"title\">title</span> of one famous book reminds us, \"We are all <span class=\"word\" data-word=\"connected\">connected</span>.\" <span class=\"word\" data-word=\"imagine\">Imagine</span> a world <span class=\"word\" data-word=\"without\">without</span> these amazing creatures — it would be deeply disappointing and impoverished. Let us work together to <span class=\"word\" data-word=\"protect\">protect</span> our <span class=\"word\" data-word=\"planet\">planet</span> for future generations, because the <span class=\"word\" data-word=\"happiness\">happiness</span> and well-being of all living things depend on the choices we make today.</p>"},{"title":"Unit 5 - 第5单元课文","html":"<p>Cooking is a wonderfully fun and creative activity that brings people together. Last Saturday, my friends and I decided to make a special meal from scratch. We gathered all the necessary ingredients: <span class=\"word\" data-word=\"flour\">flour</span>, <span class=\"word\" data-word=\"butter\">butter</span>, <span class=\"word\" data-word=\"cheese\">cheese</span>, eggs, and an assortment of fresh vegetables. The recipe was <span class=\"word\" data-word=\"simple\">simple</span>, but we were all buzzing with excitement as we tied our aprons and got to work.</p><p>First on our menu was <span class=\"word\" data-word=\"mashed potatoes\">mashed potatoes</span>. We boiled the potatoes until they were soft, then mashed them thoroughly with a generous knob of <span class=\"word\" data-word=\"butter\">butter</span>. \"Cut them into small pieces first so they cook faster,\" my friend reminded me helpfully. I used a sharp knife to dice the potatoes carefully, and then we heated some cooking <span class=\"word\" data-word=\"oil\">oil</span> in a large <span class=\"word\" data-word=\"pan\">pan</span> and stir-fried a colorful mix of vegetables to serve alongside.</p><p>Next, we tackled the ambitious task of baking a <span class=\"word\" data-word=\"pie\">pie</span>. We mixed <span class=\"word\" data-word=\"flour\">flour</span> with <span class=\"word\" data-word=\"butter\">butter</span> to make a flaky <span class=\"word\" data-word=\"crust\">crust</span>, then filled it with a rich <span class=\"word\" data-word=\"mixture\">mixture</span> of <span class=\"word\" data-word=\"pumpkin\">pumpkin</span> puree and a sprinkle of <span class=\"word\" data-word=\"cinnamon\">cinnamon</span>. The <span class=\"word\" data-word=\"recipe\">recipe</span> said to bake it in the oven for exactly 40 minutes. While we waited, we made a pot of <span class=\"word\" data-word=\"hot and sour soup\">hot and sour soup</span>, adding pepper, chili powder, and several other seasonings to give it the perfect kick.</p><p>\"Watch out! Don't make a <span class=\"word\" data-word=\"mess\">mess</span>,\" our teacher warned with a knowing smile. We tried our best to keep the kitchen clean, but <span class=\"word\" data-word=\"flour\">flour</span> dust seemed to settle on every surface. We carefully poured the remaining <span class=\"word\" data-word=\"mixture\">mixture</span> into a <span class=\"word\" data-word=\"bowl\">bowl</span> and stored the rest in the fridge. Along with the freshly prepared <span class=\"word\" data-word=\"steamed fish\">steamed fish</span>, we had put together a <span class=\"word\" data-word=\"pretty\">pretty</span> impressive meal for our group.</p><p>When the pie came out of the oven, the warm <span class=\"word\" data-word=\"sweetness\">sweetness</span> of the pumpkin and cinnamon filled the entire room with an irresistible aroma. \"<span class=\"word\" data-word=\"at least\">At least</span> we didn't burn anything!\" my friend joked, and we all burst out laughing. <span class=\"word\" data-word=\"according to\">According to</span> the <span class=\"word\" data-word=\"recipe\">recipe</span>, we had done everything right, and the result was absolutely delicious.</p><p>Cooking, we discovered, is like a mini-project where you need to follow instructions carefully but also leave room for creativity. <span class=\"word\" data-word=\"whenever\">Whenever</span> possible, we liked to try new things — for instance, we used <span class=\"word\" data-word=\"spaghetti\">spaghetti</span> instead of traditional noodles, and it worked wonderfully. A young <span class=\"word\" data-word=\"couple\">couple</span> in our class also made pancakes that looked fantastic. Our gracious <span class=\"word\" data-word=\"host\">host</span>, the professor's wife, was a wonderful <span class=\"word\" data-word=\"hostess\">hostess</span> who made everyone feel welcome. She shared her cooking <span class=\"word\" data-word=\"secret\">secret</span> with us: \"Cooking is about love.\" By the end of the day, we had so much food that we could have fed a small army. We packed the leftovers and said to each other, \"Next time, let's try making a <span class=\"word\" data-word=\"Christmas\">Christmas</span> dinner!\" What a truly memorable cooking experience it was!</p>"},{"title":"Unit 6 - 第6单元课文","html":"<p>What do you want to be when you grow up? This is a question that we all think about at some point in our lives. Some people dream of becoming engineers or designers in the glamorous <span class=\"word\" data-word=\"fashion\">fashion</span> industry, while others hope to become musicians, athletes, or photographers. There are simply so many exciting career paths to choose from!</p><p>My friend <span class=\"word\" data-word=\"Jason\">Jason</span> wants to be a firefighter when he grows up. \"I want to save lives and protect people,\" he says with quiet <span class=\"word\" data-word=\"confidence\">confidence</span>. His role model is his father, a brave <span class=\"word\" data-word=\"fireman\">fireman</span> who has spent decades serving the community. <span class=\"word\" data-word=\"Jason\">Jason</span> is working incredibly hard to <span class=\"word\" data-word=\"achieve\">achieve</span> his goal, doing push-ups every single day and taking up rigorous <span class=\"word\" data-word=\"physical\">physical</span> training to stay strong and healthy.</p><p><span class=\"word\" data-word=\"Tina\">Tina</span>, on the other hand, has always been passionate about <span class=\"word\" data-word=\"literature\">literature</span> and dreams of becoming a writer. She spends her evenings writing thoughtful essays and reading <span class=\"word\" data-word=\"classic\">classic</span> novels by famous authors. \"Keep doing what you love, and the rest will follow,\" her teacher once told her. <span class=\"word\" data-word=\"Tina\">Tina</span> tries her best to improve her writing skills every day, and she has already written several impressive short stories that have been published in the school magazine.</p><p>As for me, my dream is to become a scientist specializing in <span class=\"word\" data-word=\"AI\">AI</span> technology. I am fascinated by the idea that in the future, robots will not replace humans but will work alongside us to solve complex problems. \"Nothing is impossible if you work hard and stay curious,\" my professor always says. I want to develop new tools that can benefit everyone in society and make the world a better place.</p><p>However, making a decision about your future is never easy. It has to do with your personal interests, natural abilities, and the values you hold dear. Some people are naturally <span class=\"word\" data-word=\"organized\">organized</span> and <span class=\"word\" data-word=\"confident\">confident</span> about their path from an early age, while others need more time to explore and find their true calling. The important thing, I believe, is to set small achievable goals and <span class=\"word\" data-word=\"stick to\">stick to</span> them with determination and patience.</p><p>\"Try your best and never give up, no matter what happens,\" my parents always tell me with warm encouragement. They remind me to <span class=\"word\" data-word=\"make sure\">make sure</span> I plan <span class=\"word\" data-word=\"ahead\">ahead</span> for both my studies and my future career. <span class=\"word\" data-word=\"last but not least\">Last but not least</span>, <span class=\"word\" data-word=\"health\">health</span> is the most important foundation of all — without <span class=\"word\" data-word=\"physical\">physical</span> <span class=\"word\" data-word=\"health\">health</span>, you cannot <span class=\"word\" data-word=\"achieve\">achieve</span> anything meaningful in life. So eat <span class=\"word\" data-word=\"healthily\">healthily</span>, exercise regularly, and use your time <span class=\"word\" data-word=\"wisely\">wisely</span> to build a strong body and a sharp mind.</p><p>As the year draws to a close, I feel increasingly <span class=\"word\" data-word=\"confident\">confident</span> about my future. I know now that education is the key that unlocks every door. Whether you become a <span class=\"word\" data-word=\"lawyer\">lawyer</span>, a <span class=\"word\" data-word=\"painter\">painter</span>, a <span class=\"word\" data-word=\"businessman\">businessman</span>, or a <span class=\"word\" data-word=\"director\">director</span>, the most important thing is to be true to <span class=\"word\" data-word=\"yourself\">yourself</span> and put your whole heart into whatever you do. Every career is valuable if you approach it with passion and dedication, and every challenge you face along the way is simply an opportunity to grow stronger and wiser.</p>"},{"title":"Unit 7 - 第7单元课文","html":"<p>The future is full of exciting possibilities that once seemed like pure science fiction. Some people make bold predictions about what life will be like in fifty years. Will robots <span class=\"word\" data-word=\"take over\">take over</span> our jobs and daily tasks? Will ordinary people travel to <span class=\"word\" data-word=\"outer space\">outer space</span> for vacation? Science fiction movies have shown us countless thrilling ideas about what tomorrow might hold, and many of these visions are closer to reality than we think.</p><p>In the coming decades, transportation will undergo a dramatic transformation. Self-driving cars will become commonplace on our roads, and the entire <span class=\"word\" data-word=\"traffic\">traffic</span> <span class=\"word\" data-word=\"system\">system</span> will become far more <span class=\"word\" data-word=\"efficient\">efficient</span> and safe. People might even commute by flying vehicles. \"<span class=\"word\" data-word=\"shall\">Shall</span> we take a flying taxi?\" could become a perfectly normal question at breakfast. <span class=\"word\" data-word=\"technology\">Technology</span> will fundamentally change how we live, work, and communicate with one another in ways we can barely imagine today.</p><p>However, not all of these changes will be entirely <span class=\"word\" data-word=\"positive\">positive</span>. Some experts worry that advanced AI might <span class=\"word\" data-word=\"replace\">replace</span> human workers in many industries, leading to widespread unemployment. A famous <span class=\"word\" data-word=\"scientist\">scientist</span> named <span class=\"word\" data-word=\"Asimov\">Asimov</span> wrote extensively about these challenges in his groundbreaking books. He imagined a world where robots possess <span class=\"word\" data-word=\"emotional intelligence\">emotional intelligence</span> and can understand human feelings. But can machines truly be <span class=\"word\" data-word=\"creative\">creative</span>? Most people firmly believe that human <span class=\"word\" data-word=\"creativity\">creativity</span> and <span class=\"word\" data-word=\"intelligence\">intelligence</span> can never be fully replaced by any machine.</p><p><span class=\"word\" data-word=\"education\">Education</span> will also change in remarkable ways. Students might learn through interactive <span class=\"word\" data-word=\"video\">video</span> systems instead of sitting in traditional classrooms, and the <span class=\"word\" data-word=\"length\">length</span> of each class could be much shorter and more focused. New topics will appear in the curriculum, and students might even have AI assistants as study partners. But one thing will never change: the deep human need for genuine connection, friendship, and mentorship.</p><p>Health care will improve dramatically as well. Scientists are searching tirelessly for a <span class=\"word\" data-word=\"cure\">cure</span> for <span class=\"word\" data-word=\"cancer\">cancer</span> and many other devastating diseases. Advanced <span class=\"word\" data-word=\"medical\">medical</span> <span class=\"word\" data-word=\"technology\">technology</span> will make it possible to detect health problems earlier than ever before, saving countless lives. \"Every cloud has a silver lining,\" says Dr. Roberts optimistically. \"Even disasters can lead to new discoveries and medical breakthroughs.\"</p><p>In our everyday lives, things will be strikingly different too. We might no longer need <span class=\"word\" data-word=\"cash\">cash</span> or physical wallets — every transaction could be completely digital. Concerts might be held in immersive virtual reality, and books by <span class=\"word\" data-word=\"best-selling\">best-selling</span> <span class=\"word\" data-word=\"author\">authors</span> could be downloaded instantly to our devices. Guests at hotels might be welcomed and served entirely by robots.</p><p>But some things in life are truly priceless: friendship, trust, and sincere communication. No matter how advanced <span class=\"word\" data-word=\"technology\">technology</span> becomes, we should never let these human qualities <span class=\"word\" data-word=\"disappear\">disappear</span> from our lives. As one thoughtful <span class=\"word\" data-word=\"author\">author</span> once wrote, \"<span class=\"word\" data-word=\"technology\">Technology</span> is a tool, not a master.\" The relationship between humans and machines should benefit society as a whole, not control or diminish it.</p><p>We must be deeply careful about how we use <span class=\"word\" data-word=\"technology\">technology</span> in the years ahead. <span class=\"word\" data-word=\"public\">Public</span> opinion matters enormously in shaping these decisions. The <span class=\"word\" data-word=\"industry\">industry</span> should serve people's needs, not the other way around. Every <span class=\"word\" data-word=\"task\">task</span> should <span class=\"word\" data-word=\"depend\">depend</span> on human judgment and ethical considerations. The future of our civilization <span class=\"word\" data-word=\"depend\">depends</span> on the choices we make today, so let us build a world where <span class=\"word\" data-word=\"technology\">technology</span> serves humanity faithfully and never replaces the human heart. That, ultimately, is the greatest <span class=\"word\" data-word=\"challenge\">challenge</span> of tomorrow.</p>"},{"title":"Unit 8 - 第8单元课文","html":"<p><span class=\"word\" data-word=\"communication\">Communication</span> is essential in every aspect of our daily lives. There are many different ways to communicate with one another: <span class=\"word\" data-word=\"face-to-face\">face-to-face</span> conversations, <span class=\"word\" data-word=\"text message\">text messages</span>, phone calls, and <span class=\"word\" data-word=\"social media\">social media</span> platforms. Each method has its own unique advantages, but the most important thing is always to express yourself clearly and honestly so that others can truly understand you.</p><p>When you meet someone <span class=\"word\" data-word=\"in person\">in person</span>, your facial <span class=\"word\" data-word=\"expression\">expression</span> and body language say far more than words alone ever could. A <span class=\"word\" data-word=\"speaker\">speaker</span> who remains <span class=\"word\" data-word=\"calm\">calm</span> and confident can easily win people's <span class=\"word\" data-word=\"trust\">trust</span> and respect. Maintaining natural eye contact shows genuine interest in the conversation, and a simple nod or a warm smile can instantly make the other person feel comfortable and valued. Good <span class=\"word\" data-word=\"communication\">communication</span> is not just about talking — it is about making a real human connection.</p><p>However, not all <span class=\"word\" data-word=\"communication\">communication</span> is smooth and easy. Sometimes we <span class=\"word\" data-word=\"argue\">argue</span> with friends or family members over misunderstandings that could easily be avoided. \"Don't <span class=\"word\" data-word=\"worry about\">worry about</span> small disagreements,\" my <span class=\"word\" data-word=\"professor\">professor</span> always says with a reassuring smile. \"What truly matters is how you make up afterwards and what you learn from the experience.\" Being honest and <span class=\"word\" data-word=\"sincere\">sincere</span> is the key to solving problems and rebuilding trust after any conflict.</p><p>In today's fast-paced world, <span class=\"word\" data-word=\"social media\">social media</span> has completely changed how we communicate with each other. We can send instant messages to friends anywhere in the world at any time. But some experts <span class=\"word\" data-word=\"argue\">argue</span> that online <span class=\"word\" data-word=\"communication\">communication</span> lacks the emotional depth and nuance of real conversation. \"A <span class=\"word\" data-word=\"text message\">text message</span> can never truly replace a <span class=\"word\" data-word=\"face-to-face\">face-to-face</span> talk,\" they warn. It is hard to deny that <span class=\"word\" data-word=\"personal\">personal</span> connection — looking into someone's eyes, hearing the warmth in their voice — is something no screen can replicate.</p><p>Good <span class=\"word\" data-word=\"communication\">communication</span> skills are incredibly valuable in every situation life throws at you. At a formal business <span class=\"word\" data-word=\"meeting\">meeting</span>, you need to <span class=\"word\" data-word=\"pay\">pay</span> close <span class=\"word\" data-word=\"attention\">attention</span> to every detail and nuance. When giving a <span class=\"word\" data-word=\"speech\">speech</span> in public, you should speak clearly and project confidence even if you feel nervous inside. If you are feeling <span class=\"word\" data-word=\"nervous\">nervous</span>, take a deep breath and try to stay <span class=\"word\" data-word=\"calm\">calm</span>. And if you notice that someone else is anxious, do your best to help them feel at ease as well.</p><p>Listening is just as important as speaking, if not more so. A good <span class=\"word\" data-word=\"listener\">listener</span> shows genuine interest in what others have to say, without interrupting or rushing to judgment. Don't change the subject too quickly when someone is sharing something important, and don't <span class=\"word\" data-word=\"argue\">argue</span> about every little <span class=\"word\" data-word=\"point\">point</span> just to prove you are right. Instead, try sincerely to understand their <span class=\"word\" data-word=\"point\">point</span> of view, even if you disagree. As the old saying wisely goes, \"We have two ears and one mouth so that we can listen twice as much as we speak.\"</p><p>In difficult and sensitive situations, clear <span class=\"word\" data-word=\"communication\">communication</span> becomes even more critical than usual. When there is an emergency, precise and <span class=\"word\" data-word=\"sincere\">sincere</span> <span class=\"word\" data-word=\"communication\">communication</span> can literally save lives. When friends have a serious problem, an honest conversation can repair the relationship. When family members are far apart, a simple phone call or a heartfelt letter can bring them together across any distance.</p><p>At the <span class=\"word\" data-word=\"opening\">opening</span> of this essay, I mentioned that <span class=\"word\" data-word=\"communication\">communication</span> takes many different forms. As we come to the <span class=\"word\" data-word=\"closing\">closing</span>, remember this essential truth: whether you write a thoughtful <span class=\"word\" data-word=\"line\">line</span> to a friend, drop someone a kind note, or enjoy a joyful <span class=\"word\" data-word=\"reunion\">reunion</span> with old friends after years apart, what truly matters is the genuine connection you build. <span class=\"word\" data-word=\"communication\">Communication</span> is not just about words — it is about understanding, respect, and care. That is the most <span class=\"word\" data-word=\"reasonable\">reasonable</span> conclusion I can draw from a lifetime of learning. The <span class=\"word\" data-word=\"opportunity\">opportunity</span> to connect with others is one of life's greatest gifts, so never waste it!</p>"},{"title":"WELCOME","html":"<p>In order to <span class=\"word\" data-word=\"exchange\">exchange </span>ideas, our school has <span class=\"word\" data-word=\"organized\">organized </span>a <span class=\"word\" data-word=\"lecture\">lecture </span>to be held on <span class=\"word\" data-word=\"campus\">campus</span>. If you want to <span class=\"word\" data-word=\"attend\">attend</span> the <span class=\"word\" data-word=\"lecture\">lecture</span>, you need to <span class=\"word\" data-word=\"register\">register </span>your personal information by <span class=\"word\" data-word=\"filling\">filling </span>in the <span class=\"word\" data-word=\"formal registration form\">formal registration form </span>which is specially <span class=\"word\" data-word=\"designed\">designed </span>by our <span class=\"word\" data-word=\"designer\">designer</span>. You need to fill in your name, <span class=\"word\" data-word=\"sex\">sex</span>（<span class=\"word\" data-word=\"male\">male </span>or <span class=\"word\" data-word=\"female\">female</span>）, age and <span class=\"word\" data-word=\"nationality\">nationality</span>. <span class=\"word\" data-word=\"exchange\">Exchange </span>students are also welcome, but they must <span class=\"word\" data-word=\"state\">state </span>which <span class=\"word\" data-word=\"nation\">nation </span>they come from.</p><p> Bob <span class=\"word\" data-word=\"graduated\">graduated </span>from <span class=\"word\" data-word=\"junior\">junior </span>high school, and now he is a <span class=\"word\" data-word=\"senior\">senior </span>high school student. This <span class=\"word\" data-word=\"guy\">guy </span>has become my best <span class=\"word\" data-word=\"partner\">partner</span>. He is always <span class=\"word\" data-word=\"anxious\">anxious </span>to <span class=\"word\" data-word=\"explore\">explore </span>new things. He has an <span class=\"word\" data-word=\"outgoing personality\">outgoing personality </span>and is <span class=\"word\" data-word=\"curious\">curious </span>to <span class=\"word\" data-word=\"make a good impression\">make a good impression </span>on everyone. He is a very <span class=\"word\" data-word=\"confident\">confident </span>student and will never be <span class=\"word\" data-word=\"frightened\">frightened </span>by difficulties. I am really <span class=\"word\" data-word=\"impressed\">impressed </span>with his <span class=\"word\" data-word=\"confidence\">confidence</span>. In class, he <span class=\"word\" data-word=\"concentrates on\">concentrates on </span>listening to the teacher. Sometimes, he makes you feel <span class=\"word\" data-word=\"awkward\">awkward </span>and even <span class=\"word\" data-word=\"annoys\">annoys </span>you. <span class=\"word\" data-word=\"what if\">What if </span>he makes you <span class=\"word\" data-word=\"annoyed\">annoyed</span>? I’ll have to <span class=\"word\" data-word=\"leave\">leave </span>him <span class=\"word\" data-word=\"alone at last\">alone at last</span>.</p><p> My <span class=\"word\" data-word=\"partner\">partner </span>Carl likes to <span class=\"word\" data-word=\"take notes\">take notes </span>on <span class=\"word\" data-word=\"flash cards\">flash cards </span>and is <span class=\"word\" data-word=\"curious\">curious </span>to <span class=\"word\" data-word=\"improve\">improve </span>his spoken English. He has an <span class=\"word\" data-word=\"outgoing personality\">outgoing personality</span>, <span class=\"word\" data-word=\"looking forward to organizing\">looking forward to organizing </span>a spoken English <span class=\"word\" data-word=\"contest\">contest</span>. However, he believes that he should <span class=\"word\" data-word=\"revise\">revise </span>his learning <span class=\"word\" data-word=\"strategy\">strategy </span>and life <span class=\"word\" data-word=\"style\">style</span>. His <span class=\"word\" data-word=\"goal\">goal </span>is to get a good job in a <span class=\"word\" data-word=\"company\">company </span>or <span class=\"word\" data-word=\"organization\">organization</span>.</p>"},{"title":"TEENAGE LIFE","html":"<p><span class=\"word\" data-word=\"teenage\">Teenage </span>life is rich and colorful. Some <span class=\"word\" data-word=\"teenagers prefer\">teenagers prefer </span>to do <span class=\"word\" data-word=\"volunteer\">volunteer </span>work, while others <span class=\"word\" data-word=\"prefer\">prefer </span><span class=\"word\" data-word=\"extra-curricular\">extra-curricular</span>activities. Their <span class=\"word\" data-word=\"content\">content</span>is to organize <span class=\"word\" data-word=\"debate\">debate</span><span class=\"word\" data-word=\"s\">s</span>, study <span class=\"word\" data-word=\"ballet\">ballet</span><span class=\"word\" data-word=\"movements\"> movements</span>, <span class=\"word\" data-word=\"clean up\">clean up </span>the <span class=\"word\" data-word=\"greenhouse\">greenhouse</span><span class=\"word\" data-word=\"s\">s</span>, and so on. But more people <span class=\"word\" data-word=\"sign up for advanced\">sign up for advanced</span><span class=\"word\" data-word=\"course\">course</span><span class=\"word\" data-word=\"s\">s </span><span class=\"word\" data-word=\"suitable for\">suitable for</span>their <span class=\"word\" data-word=\"taste\">taste</span>. <span class=\"word\" data-word=\"actually\">Actually</span>, I <span class=\"word\" data-word=\"prefer\">prefer </span><span class=\"word\" data-word=\"literature\">literature</span><span class=\"word\" data-word=\"to\"> to </span>all these.</p><p><span class=\"word\" data-word=\"actually\">Actually</span>, <span class=\"word\" data-word=\"youth\">youth</span>life is also full of <span class=\"word\" data-word=\"opportunities\">opportunities</span>and <span class=\"word\" data-word=\"challenges\">challenges</span>. As <span class=\"word\" data-word=\"freshmen\">freshmen</span>, there are some problems that <span class=\"word\" data-word=\"confuse\">confuse</span>us, that is, we are <span class=\"word\" data-word=\"confused\">confused</span>by some <span class=\"word\" data-word=\"confusing\">confusing</span>problems. We go to college after <span class=\"word\" data-word=\"graduating\">graduating </span>from senior high school. We must <span class=\"word\" data-word=\"quit\">quit</span>some bad <span class=\"word\" data-word=\"habits\">habits </span>and <span class=\"word\" data-word=\"adapt\">adapt</span>to the new school life. There are more <span class=\"word\" data-word=\"extra-curricular\">extra-curricular </span>activities in university for us to <span class=\"word\" data-word=\"sign up for\">sign up for</span>. We have the <span class=\"word\" data-word=\"responsibility\">responsibility </span>to become useful <span class=\"word\" data-word=\"talents\">talents </span>for the country and should <span class=\"word\" data-word=\"be responsible for\">be responsible for </span>mankind. With the <span class=\"word\" data-word=\"advance\">advance</span>of society, we should learn <span class=\"word\" data-word=\"advanced\">advanced </span>scientific knowledge and speak <span class=\"word\" data-word=\"fluent\">fluent</span>foreign languages. According to the <span class=\"word\" data-word=\"schedule\">schedule</span>, we are going to study Chinese <span class=\"word\" data-word=\"literature\">literature </span>this <span class=\"word\" data-word=\"term\">term</span>. I’ve written to an <span class=\"word\" data-word=\"editor\">editor</span>for help. He <span class=\"word\" data-word=\"recommend\">recommend</span><span cl
