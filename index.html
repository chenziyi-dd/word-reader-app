\"splendid fountain ahead\">splendid fountain ahead</span> <span class=\"word\" data-word=\"appealed to\">appealed to </span>me. Behind it was the <span class=\"word\" data-word=\"superb\">superb</span> <span class=\"word\" data-word=\"aquarium\">aquarium</span>. I <span class=\"word\" data-word=\"pedaled\">pedaled </span>a bicycle along the <span class=\"word\" data-word=\"original\">original</span><span class=\"word\" data-word=\"route\">route </span>to visit the <span class=\"word\" data-word=\"aquarium\">aquarium</span>. I was very much <span class=\"word\" data-word=\"amused\">amused </span>to see some <span class=\"word\" data-word=\"adorable\">adorable </span>fish swimming and an <span class=\"word\" data-word=\"enormous whale\">enormous whale </span>on <span class=\"word\" data-word=\"display\">display</span>. There were <span class=\"word\" data-word=\"up\">up</span> <span class=\"word\" data-word=\"to\">to</span>20,000 fish there. Then I visited a <span class=\"word\" data-word=\"pirate\">pirate </span>ship, had a <span class=\"word\" data-word=\"swing\">swing </span>with some children and took a ride on the <span class=\"word\" data-word=\"roller coaster\">roller coaster</span>. In this park, there were many <span class=\"word\" data-word=\"entertainments\">entertainments </span>that aroused my strong <span class=\"word\" data-word=\"appetite\">appetite</span>. I could watch <span class=\"word\" data-word=\"fashion\">fashion </span>shows, <span class=\"word\" data-word=\"iron\">iron </span>workshops, and a <span class=\"word\" data-word=\"rare steam\">rare steam </span>engine. That was an <span class=\"word\" data-word=\"incredible\">incredible</span> <span class=\"word\" data-word=\"theme\">theme </span>park that <span class=\"word\" data-word=\"appealed to\">appealed to </span>everyone. After the visit, my teacher asked me to describe the park with <span class=\"word\" data-word=\"adjectives\">adjectives </span>and imperative sentences, then to <span class=\"word\" data-word=\"label\">label</span>these adjectives and put them in the left <span class=\"word\" data-word=\"column\">column</span>.</p>"},{"title":"Body Language","html":"<p>In our <span class=\"word\" data-word=\"interactions\">interactions</span>with other people, the way of <span class=\"word\" data-word=\"expression\">expression </span>needs to <span class=\"word\" data-word=\"vary\">vary </span>with the <span class=\"word\" data-word=\"situation\">situation</span>. Body language is important and <span class=\"word\" data-word=\"reliable\">reliable</span>. <span class=\"word\" data-word=\"by contrast\">By contrast</span>, it is sometimes more <span class=\"word\" data-word=\"appropriate\">appropriate </span>than spoken language. A smile is always <span class=\"word\" data-word=\"approved\">approved </span>of in all <span class=\"word\" data-word=\"cultures\">cultures </span>because it <span class=\"word\" data-word=\"demonstrates politeness\">demonstrates politeness</span>and can <span class=\"word\" data-word=\"break down barriers\">break down barriers</span>. A <span class=\"word\" data-word=\"fake\">fake </span>smile is also necessary if you want to <span class=\"word\" data-word=\"hide\">hide </span>feelings like <span class=\"word\" data-word=\"anger\">anger </span>or <span class=\"word\" data-word=\"anxiety\">anxiety</span>, or when you feel <span class=\"word\" data-word=\"ashamed\">ashamed </span>or <span class=\"word\" data-word=\"embarrassed\">embarrassed</span>. Of course, we can <span class=\"word\" data-word=\"make inferences\">make inferences</span> about the truth of the smile. Body language <span class=\"word\" data-word=\"differs\">differs</span> around the world. Different cultures may <span class=\"word\" data-word=\"employ\">employ</span> different <span class=\"word\" data-word=\"gestures\">gestures </span>to express the <span class=\"word\" data-word=\"identical\">identical </span>feelings. In some cultures, people <span class=\"word\" data-word=\"favor\">favor </span>shaking hands,<span class=\"word\" data-word=\"bowing\"> bowing </span>from the <span class=\"word\" data-word=\"waist\">waist </span>when they meet. <span class=\"word\" data-word=\"by\">By</span> <span class=\"word\" data-word=\"comparison\">comparison</span>, elsewhere, people may kiss their friends on the <span class=\"word\" data-word=\"cheek\">cheek</span>. You can also <span class=\"word\" data-word=\"witness\">witness </span>that some people <span class=\"word\" data-word=\"interpret\">interpret </span>the <span class=\"word\" data-word=\"gesture\">gesture </span>for OK as zero.</p><p>As an <span class=\"word\" data-word=\"educator\">educator</span>, I’ve learned to read my students’body language and know <span class=\"word\" data-word=\"what makes each student tick\">what makes each student tick</span>. <span class=\"word\" data-word=\"in other words\">In other words</span>, I understand whatmy students think through their body language. Aswe know, people have a <span class=\"word\" data-word=\"tendency\">tendency </span>to <span class=\"word\" data-word=\"lean\">lean </span>towards whatever they are interested in. So if a student hashis head <span class=\"word\" data-word=\"lowered\">lowered </span>to look at his watch, it <span class=\"word\" data-word=\"implies\">implies</span>he is <span class=\"word\" data-word=\"bored\">bored</span>. Their eyes <span class=\"word\" data-word=\"barely\">barely </span>move, and with their<span class=\"word\" data-word=\"chins\">chins </span>on their hands, they <span class=\"word\" data-word=\"occupy\">occupy </span>themselves by<span class=\"word\" data-word=\"staring\">staring </span>out of the window or up at the <span class=\"word\" data-word=\"ceiling\">ceiling</span>. Thatmeans these students are <span class=\"word\" data-word=\"distracted\">distracted </span>from class. Ican <span class=\"word\" data-word=\"perceive\">perceive </span>and <span class=\"word\" data-word=\"distinguish\">distinguish </span>why some studentsput their arms across their <span class=\"word\" data-word=\"chests\">chests</span>. I know I need to<span class=\"word\" data-word=\"inquire\">inquire </span>and <span class=\"word\" data-word=\"assess\">assess </span>what is going on. Once, I madea <span class=\"word\" data-word=\"trial\">trial </span>with the <span class=\"word\" data-word=\"twin\">twin </span>brothers about <span class=\"word\" data-word=\"nonverbal\">nonverbal</span>gestures. I gave an <span class=\"word\" data-word=\"accurate assessment\">accurate assessment </span>of their<span class=\"word\" data-word=\"internal\">internal </span>thoughts by how they <span class=\"word\" data-word=\"posed\">posed</span>,<span class=\"word\" data-word=\"slumped\"> slumped</span>and <span class=\"word\" data-word=\"bent\">bent </span>over. This was also a good <span class=\"word\" data-word=\"explanation\">explanation </span>ofbody language. <span class=\"word\" data-word=\"ultimately\">Ultimately</span>, I <span class=\"word\" data-word=\"call on\">call on </span>my studentsnot to be <span class=\"word\" data-word=\"bothered\">bothered </span>by the outside world and <span class=\"word\" data-word=\"adjust\">adjust</span>their learning <span class=\"word\" data-word=\"state\">state</span>. <span class=\"word\" data-word=\"at work\">At work</span>, if there is a <span class=\"word\" data-word=\"conflict\">conflict</span>between <span class=\"word\" data-word=\"behavior\">behavior </span>and learning, I will <span class=\"word\" data-word=\"intervene\">intervene</span>in time. This is <span class=\"word\" data-word=\"merely\">merely </span>one <span class=\"word\" data-word=\"component\">component </span>of the<span class=\"word\" data-word=\"solution\">solution</span>. </p>"},{"title":"Working The Land","html":"<p>Known as the “father of <span class=\"word\" data-word=\"hybrid\">hybrid </span>rice”, Yuan Longping has <span class=\"word\" data-word=\"devoted\">devoted </span>his life <span class=\"word\" data-word=\"to\">to</span> the Chinese farmers. Once, China had a <span class=\"word\" data-word=\"serious shortage\">serious shortage </span>of food. To <span class=\"word\" data-word=\"tackle\">tackle </span>this <span class=\"word\" data-word=\"crisis\">crisis</span>,<span class=\"word\" data-word=\"alleviate\"> alleviate </span>hunger and <span class=\"word\" data-word=\"get rid of\">get rid of</span> <span class=\"word\" data-word=\"poverty\">poverty</span>, Yuan was <span class=\"word\" data-word=\"convinced\">convinced </span>that farmers must <span class=\"word\" data-word=\"boost yields\">boost yields </span>in the fields they had. One <span class=\"word\" data-word=\"characteristic\">characteristic </span>of hybrids showed that they could <span class=\"word\" data-word=\"attain\">attain </span>a higher <span class=\"word\" data-word=\"yield\">yield </span>than <span class=\"word\" data-word=\"conventional\">conventional</span> crops. Through <span class=\"word\" data-word=\"intense\">intense </span>effort, Yuan <span class=\"word\" data-word=\"overcame\">overcame</span> <span class=\"word\" data-word=\"enormous\">enormous </span>difficulties to develop the first hybrid rice that enabled farmers to <span class=\"word\" data-word=\"expand\">expand </span>their <span class=\"word\" data-word=\"output\">output</span> greatly. Today, it is <span class=\"word\" data-word=\"estimated\">estimated </span>that about 60percent of <span class=\"word\" data-word=\"domestic\">domestic </span>rice <span class=\"word\" data-word=\"consumption\">consumption </span>in China is <span class=\"word\" data-word=\"comprised\">comprised </span>of crops <span class=\"word\" data-word=\"generated\">generated </span>from Yuan’s hybrid <span class=\"word\" data-word=\"strains\">strains</span>. <span class=\"word\" data-word=\"deep down\">Deep down</span>, Yuan is still very much a farmer at heart. As a man of the <span class=\"word\" data-word=\"soil\">soil</span>, he cares little for <span class=\"word\" data-word=\"celebrity\">celebrity </span>or money. <span class=\"word\" data-word=\"despite\">Despite </span>his <span class=\"word\" data-word=\"wealth\">wealth</span>, Yuan Longping doesn’t live a life of <span class=\"word\" data-word=\"leisure\">leisure</span>. His<span class=\"word\" data-word=\"assumption\"> assumption </span>is that he <span class=\"word\" data-word=\"envisioned\">envisioned </span>rice plants as tall as <span class=\"word\" data-word=\"sorghum\">sorghum</span>, with each ear of rice as big as a<span class=\"word\" data-word=\"broom\"> broom</span>, and each <span class=\"word\" data-word=\"grain\">grain </span>of rice as huge as a <span class=\"word\" data-word=\"peanut\">peanut</span>. His latest <span class=\"word\" data-word=\"vision\">vision </span>for rice growing in <span class=\"word\" data-word=\"salty\">salty </span>land has also become a <span class=\"word\" data-word=\"reality\">reality</span>.</p><p>Farmers prefer <span class=\"word\" data-word=\"chemical fertilizers\">chemical fertilizers </span>to <span class=\"word\" data-word=\"organic\">organic</span>ones for an <span class=\"word\" data-word=\"increase\">increase </span>of <span class=\"word\" data-word=\"output\">output</span>. But crops grownwith chemical fertilizers <span class=\"word\" data-word=\"lack nutrition\">lack nutrition</span>,<span class=\"word\" data-word=\"essential\"> essential</span><span class=\"word\" data-word=\"minerals\">minerals </span>and nice <span class=\"word\" data-word=\"flavour\">flavour</span>. Today <span class=\"word\" data-word=\"chemical\">chemical</span><span class=\"word\" data-word=\"pesticides\">pesticides</span> have been in <span class=\"word\" data-word=\"widespread\">widespread </span>use in farming.Pesticides can kill <span class=\"word\" data-word=\"harmful bacteria\">harmful bacteria </span>and <span class=\"word\" data-word=\"insects\">insects</span>, but <span class=\"word\" data-word=\"damage\">damage </span>the <span class=\"word\" data-word=\"nutritious\">nutritious </span>crops. This,<span class=\"word\" data-word=\"in turn\"> in turn</span>, <span class=\"word\" data-word=\"affects\">affects </span>the animals and humans who <span class=\"word\" data-word=\"digest\">digest </span>them. Now some pesticides have been <span class=\"word\" data-word=\"prohibited\">prohibited </span>inmost countries. As an <span class=\"word\" data-word=\"alternative\">alternative</span>, some farmershave <span class=\"word\" data-word=\"switched\">switched </span>to <span class=\"word\" data-word=\"organic\">organic </span>farming, because organicvegetables and grain are welcomed in <span class=\"word\" data-word=\"urban\">urban</span><span class=\"word\" data-word=\"groceries\">groceries</span>. These farmers also change crops. <span class=\"word\" data-word=\"for\">For</span><span class=\"word\" data-word=\"instance\">instance</span>, they grow corn or <span class=\"word\" data-word=\"wheat\">wheat </span>in a field oneyear, and then grow beans there the next. Thesecrops have <span class=\"word\" data-word=\"entirely\">entirely </span>different <span class=\"word\" data-word=\"roots\">roots </span>and use different <span class=\"word\" data-word=\"depths\">depths </span>of soil.</p>"},{"title":"Space Exploration","html":"<p>To become an <span class=\"word\" data-word=\"astronaut\">astronaut</span>, you must go through a strict selection <span class=\"word\" data-word=\"procedure\">procedure</span>. You need a lot of <span class=\"word\" data-word=\"mental\">mental</span>, <span class=\"word\" data-word=\"intelligent\">intelligent</span> and physical training. Besides, you should not only know about the <span class=\"word\" data-word=\"universe\">universe</span>, the <span class=\"word\" data-word=\"solar system\">solar system</span> and our <span class=\"word\" data-word=\"globe\">globe</span>, but also understand <span class=\"word\" data-word=\"rockets\">rockets</span> <span class=\"word\" data-word=\"satellites\">satellites</span> <span class=\"word\" data-word=\"spacecrafts\">spacecrafts</span>, <span class=\"word\" data-word=\"gravity\">gravity</span>,  and so on. <span class=\"word\" data-word=\"in closing\">In closing</span>, astronauts must have a<span class=\"word\" data-word=\"determined\">determined</span> will and a strong <span class=\"word\" data-word=\"desire\">desire</span> to succeed. After a spacecraft is <span class=\"word\" data-word=\"launched\">launched</span>, make sure it goes in the right <span class=\"word\" data-word=\"orbit\">orbit</span>. An astronaut <span class=\"word\" data-word=\"on\">on</span><span class=\"word\" data-word=\"board\">board</span> has a lot of <span class=\"word\" data-word=\"missions\">missions </span>to <span class=\"word\" data-word=\"carry on\">carry on</span>. He must be able to complete a <span class=\"word\" data-word=\"spacewalk independently\">spacewalk independently</span><span class=\"word\" data-word=\"so as to transmit data\">so as to transmit data </span>to the <span class=\"word\" data-word=\"relevant agencies\">relevant agencies</span> on the earth.</p><p>Tom keeps in mind the famous saying “That’s one small step for a man, one <span class=\"word\" data-word=\"giant leap\">giant leap</span> for <span class=\"word\" data-word=\"mankind\">mankind</span>.” So he is<span class=\"word\" data-word=\"keen\"> keen</span> to explore the <span class=\"word\" data-word=\"mysteries\">mysteries</span> of <span class=\"word\" data-word=\"the universe\">the universe</span>. Once there was <span class=\"word\" data-word=\"virtual\">virtual </span>training in space, Tom boarded a <span class=\"word\" data-word=\"vehicle\">vehicle</span> called <span class=\"word\" data-word=\"jade\">Jade</span> Rabbit<span class=\"word\" data-word=\"in the hope of\">in the hope of</span> exploring the final<span class=\"word\" data-word=\"frontier\">frontier</span>. On the spacecraft there was a <span class=\"word\" data-word=\"microwave\">microwave</span>, a <span class=\"word\" data-word=\"smartphone\">smartphone</span>, a<span class=\"word\" data-word=\"pillow\">pillow</span>, an <span class=\"word\" data-word=\"oxygen\">oxygen</span> bottle, some <span class=\"word\" data-word=\"soap\">soap</span>, <span class=\"word\" data-word=\"towels\">towels</span>, <span class=\"word\" data-word=\"tissues\">tissues</span> and other<span class=\"word\" data-word=\"facilities\">facilities </span>to <span class=\"word\" data-word=\"provide for\">provide for</span> him. After the spacecraft entered its <span class=\"word\" data-word=\"orbit\">orbit</span>, the <span class=\"word\" data-word=\"monitor\">monitor</span>signaled<span class=\"word\" data-word=\"regularly\">regularly</span>. When he was finishing the <span class=\"word\" data-word=\"ongoing\">ongoing</span> mission, he began to <span class=\"word\" data-word=\"float\">float</span> in the capsule for<span class=\"word\" data-word=\"lack\">lack</span> of<span class=\"word\" data-word=\"sufficient\">sufficient</span> training, and his <span class=\"word\" data-word=\"muscles\">muscles</span> ached too. Fortunately, he was<span class=\"word\" data-word=\"attached\">attached</span> tightly to the spacecraft. <span class=\"word\" data-word=\"otherwise\">Otherwise</span>, he would float <span class=\"word\" data-word=\"beyond\">beyond</span> the spaceship. But he felt <span class=\"word\" data-word=\"disappointed\">disappointed</span> when he found his <span class=\"word\" data-word=\"limited\">limited</span><span class=\"word\" data-word=\"re sources\">re sources</span> were <span class=\"word\" data-word=\"running out\">running out</span>. He wanted to <span class=\"word\" data-word=\"figure out\">figure out</span> if the resources could be <span class=\"word\" data-word=\"recycled\">recycled</span>. Through <span class=\"word\" data-word=\"analysis\">analysis</span>, Tom <span class=\"word\" data-word=\"argued\">argued</span> that the<span class=\"word\" data-word=\"current fatal\">current fatal </span>error was lack of <span class=\"word\" data-word=\"high-end\">high-end</span> facilities, which<span class=\"word\" data-word=\"resulted in\">resulted in</span> the failure of space training. <span class=\"word\" data-word=\"as a result\">As a result</span>, he had to signal for help.</p>"},{"title":"Science And Scientists","html":"<p><span class=\"word\" data-word=\"cholera\">Cholera</span>is an <span class=\"word\" data-word=\"infectious disease\">infectious disease </span>caused by <span class=\"word\" data-word=\"germs\">germs</span>. People who are <span class=\"word\" data-word=\"infected\">infected</span>with this disease will <span class=\"word\" data-word=\"suffer\">suffer </span>from <span class=\"word\" data-word=\"severe\">severe</span><span class=\"word\" data-word=\"diarrhea\">diarrhea</span>, <span class=\"word\" data-word=\"dehydration\">dehydration</span>and even death. As a young doctor, John Snow felt a little <span class=\"word\" data-word=\"frustrated\">frustrated</span>at first, but he was <span class=\"word\" data-word=\"determined\">determined </span>to <span class=\"word\" data-word=\"defeat\">defeat </span>“King Cholera” <span class=\"word\" data-word=\"once\">once</span><span class=\"word\" data-word=\"and\">and</span><span class=\"word\" data-word=\"for\">for</span><span class=\"word\" data-word=\"all\">all</span>. There were then two <span class=\"word\" data-word=\"contradictory\">contradictory</span><span class=\"word\" data-word=\"theories\">theories </span>to <span class=\"word\" data-word=\"explain\">explain </span>how cholera <span class=\"word\" data-word=\"spread\">spread</span>. Snow <span class=\"word\" data-word=\"subscribed\">subscribed</span><span class=\"word\" data-word=\"to\">to</span>the correct theory that cholera was caused by an <span class=\"word\" data-word=\"infection\">infection</span>from germs in food or water. But Snow needed <span class=\"word\" data-word=\"proof\">proof</span>and <span class=\"word\" data-word=\"findings\">findings</span>. It happened that cholera <span class=\"word\" data-word=\"broke\">broke</span><span class=\"word\" data-word=\"out\">out</span>in London in 1854, and Snow began to <span class=\"word\" data-word=\"investigate\">investigate</span>. He discovered that there were <span class=\"word\" data-word=\"multiple\">multiple</span>deaths in some <span class=\"word\" data-word=\"households\">households</span>near the <span class=\"word\" data-word=\"water\">water</span><span class=\"word\" data-word=\"pump\">pump</span>in Broad Street. This showed there was a <span class=\"word\" data-word=\"link\">link</span>between the cases of cholera and the water. Snow <span class=\"word\" data-word=\"suspected\">suspected</span>that the water pump was to <span class=\"word\" data-word=\"blame\">blame</span>, so he had the <span class=\"word\" data-word=\"handle\">handle</span>of the water pump <span class=\"word\" data-word=\"removed\">removed</span>. <span class=\"word\" data-word=\"thanks\">Thanks</span><span class=\"word\" data-word=\"to\">to</span>Snow’s <span class=\"word\" data-word=\"intervention\">intervention</span>, people began to drink <span class=\"word\" data-word=\"pure\">pure</span>water instead of <span class=\"word\" data-word=\"raw\">raw</span>water. <span class=\"word\" data-word=\"thus\">Thus</span>, there was a <span class=\"word\" data-word=\"substantial\">substantial</span><span class=\"word\" data-word=\"decrease\">decrease</span>in the <span class=\"word\" data-word=\"threat\">threat </span>of cholera.<span class=\"word\" data-word=\"furthermore\">Furthermore</span>, in his use of maps and <span class=\"word\" data-word=\"statistics\">statistics</span>, Snow <span class=\"word\" data-word=\"transformed\">transformed</span>the way scientists study diseases. His <span class=\"word\" data-word=\"thinking\">thinking</span>and <span class=\"word\" data-word=\"concept\">concept</span>on disease were quite <span class=\"word\" data-word=\"novel\">novel </span>at that time. Therefore, Snow is considered the father of modern <span class=\"word\" data-word=\"epidemiology\">epidemiology</span>.</p><p>Doctors use <span class=\"word\" data-word=\"microscopes\">microscopes</span>to <span class=\"word\" data-word=\"observe cells\">observe cells</span>, germs, <span class=\"word\" data-word=\"viruses\">viruses </span>or <span class=\"word\" data-word=\"proteins\">proteins</span>in cells, while <span class=\"word\" data-word=\"astronomers\">astronomers</span>look at stars and study <span class=\"word\" data-word=\"astronomy\">astronomy</span>through <span class=\"word\" data-word=\"telescopes\">telescopes</span>. A theory may be <span class=\"word\" data-word=\"abstract\">abstract</span>, but research work needs to have a <span class=\"word\" data-word=\"solid\">solid</span>, <span class=\"word\" data-word=\"concrete\">concrete</span>or <span class=\"word\" data-word=\"vivid\">vivid</span><span class=\"word\" data-word=\"theoretical\">theoretical</span><span class=\"word\" data-word=\"framework\">framework</span>. <span class=\"word\" data-word=\"besides\">Besides</span>John Snow, it is worth mentioning Qian Xuesen, the father of China’s <span class=\"word\" data-word=\"aerospace\">aerospace</span>industry. He was an <span class=\"word\" data-word=\"outstanding\">outstanding</span>, <span class=\"word\" data-word=\"gifted\">gifted</span>and <span class=\"word\" data-word=\"patriotic\">patriotic</span>scientist. At first, he studied railway <span class=\"word\" data-word=\"mechanical\">mechanical</span>engineering. In order to <span class=\"word\" data-word=\"defend\">defend</span>China’s airspace, he <span class=\"word\" data-word=\"shifted\">shifted</span>his <span class=\"word\" data-word=\"major\">major </span>to <span class=\"word\" data-word=\"aviation\">aviation</span>. While studying in the United States, Qian Xuesen was a graduate <span class=\"word\" data-word=\"assistant\">assistant</span>, studying <span class=\"word\" data-word=\"jet\">jet</span>and <span class=\"word\" data-word=\"rocket\">rocket </span>technology. After returning to China, he was put <span class=\"word\" data-word=\"in\">in</span><span class=\"word\" data-word=\"charge\">charge</span><span class=\"word\" data-word=\"of\">of</span>developing China’s rocket science and its space and <span class=\"word\" data-word=\"missile\">missile</span>programme. Under Qian’s <span class=\"word\" data-word=\"leadership\">leadership</span>, China’s aerospace industry made <span class=\"word\" data-word=\"steady\">steady</span><span class=\"word\" data-word=\"progress\">progress </span>and <span class=\"word\" data-word=\"achieved initial\">achieved initial</span>success. Now let’s change the subject. Here is a picture of a <span class=\"word\" data-word=\"brilliant\">brilliant</span><span class=\"word\" data-word=\"rainbow\">rainbow</span>after a heavy rain. There is a man standing over there. The rainbow <span class=\"word\" data-word=\"casts\">casts</span>different <span class=\"word\" data-word=\"shadows\">shadows</span>of the man. <span class=\"word\" data-word=\"above\">Above</span><span class=\"word\" data-word=\"all\">all</span>, the moon is hanging in the sky, but the sun has not yet set. Can you find <span class=\"word\" data-word=\"fault\">fault</span>with this picture?</p>"},{"title":"Journey Across Vast Land","html":"<p>Two Chinese girls arrived in <span class=\"word\" data-word=\"vancouver\">Vancouver</span> by <span class=\"word\" data-word=\"commercial airline\">commercial airline</span>. There they took a <span class=\"word\" data-word=\"pleasant\">pleasant</span>boat ride out into the <span class=\"word\" data-word=\"bay\">bay</span>and later visited an island with wonderful shops selling <span class=\"word\" data-word=\"crafts\">crafts</span>and <span class=\"word\" data-word=\"antiques\">antiques</span>. The next morning, the two girls <span class=\"word\" data-word=\"arose\">arose</span>early to take the train to<span class=\"word\" data-word=\"lake\">Lake</span><span class=\"word\" data-word=\"louise\">Louise</span>, passing through the <span class=\"word\" data-word=\"massive\">massive</span>mountains and forests. The blue water in Lake Louise <span class=\"word\" data-word=\"literally\">literally</span><span class=\"word\" data-word=\"took\">took</span><span class=\"word\" data-word=\"their\">their</span><span class=\"word\" data-word=\"breath\">breath</span><span class=\"word\" data-word=\"away\">away</span> with its <span class=\"word\" data-word=\"exceptional\">exceptional </span>beauty. Then they took a coach <span class=\"word\" data-word=\"bound\">bound</span> north through the Rockies to Jasper. The <span class=\"word\" data-word=\"awesome\">awesome</span><span class=\"word\" data-word=\"scenery\">scenery</span>, <span class=\"word\" data-word=\"spectacular\">spectacular</span>mountain <span class=\"word\" data-word=\"peaks\">peaks</span>and forests made them excited. One <span class=\"word\" data-word=\"highlight\">highlight</span>of their trip was seeing many different <span class=\"word\" data-word=\"creatures\">creatures</span>, including deer, mountain <span class=\"word\" data-word=\"goats\">goats</span>, and even a <span class=\"word\" data-word=\"grizzly\">grizzly</span><span class=\"word\" data-word=\"bear\">bear</span>. Their first stop was Edmonton, the centre of Canada’s oil and gas <span class=\"word\" data-word=\"drilling\">drilling</span>industry. The city is <span class=\"word\" data-word=\"freezing\">freezing</span><span class=\"word\" data-word=\"cold\">cold</span>in winter but it is home to many shopping <span class=\"word\" data-word=\"malls\">malls</span>. Crossing the great Canadian <span class=\"word\" data-word=\"prairie\">Prairie</span>and a <span class=\"word\" data-word=\"bunch\">bunch</span>of farms, they did not<span class=\"word\" data-word=\"anticipate\">anticipate</span>seeing such an open country. As the train <span class=\"word\" data-word=\"thundered\">thundered</span>on towards the southern <span class=\"word\" data-word=\"border\">border</span>, they opened the <span class=\"word\" data-word=\"curtains\">curtains</span>and saw <span class=\"word\" data-word=\"frost\">frost</span>on the ground. Their trip from Vancouver to <span class=\"word\" data-word=\"toronto\">Toronto</span>had taken a <span class=\"word\" data-word=\"duration\">duration</span>of four days.</p><p>My friend is a <span class=\"word\" data-word=\"photographer\">photographer</span>with a French <span class=\"word\" data-word=\"accent\">accent</span>. He is <span class=\"word\" data-word=\"enrolled\">enrolled</span>in an English <span class=\"word\" data-word=\"tutoring\">tutoring </span>class to learn English <span class=\"word\" data-word=\"idioms\">idioms</span>, but the result is often <span class=\"word\" data-word=\"contrary\">contrary</span><span class=\"word\" data-word=\"to\">to</span>his wishes. One day <span class=\"word\" data-word=\"at\">at</span><span class=\"word\" data-word=\"dusk\">dusk</span>he was staying in a hotel. He heard someone on the upper floor shout “Look out!” He put his head out of the window at once. As a result, a <span class=\"word\" data-word=\"basin\">basin </span>of water poured down on his head. He was <span class=\"word\" data-word=\"astonished\">astonished</span>. <span class=\"word\" data-word=\"anyhow\">Anyhow</span>, he felt he was <span class=\"word\" data-word=\"coherent\">coherent</span>. “English is so strange that ‘look out’ means not looking out, ” he said to himself. Once he saw an <span class=\"word\" data-word=\"advertisement\">advertisement</span>that said, “Our company <span class=\"word\" data-word=\"owes\">owes</span>a great deal <span class=\"word\" data-word=\"to\">to</span>our customers.” He thought the company was in deep <span class=\"word\" data-word=\"debt\">debt</span>. In fact, it’s a way for the company to express their thanks to the customers. He <span class=\"word\" data-word=\"proceeded\">proceeded</span><span class=\"word\" data-word=\"alongside\">alongside</span>the <span class=\"word\" data-word=\"cobblestone\">cobblestone</span><span class=\"word\" data-word=\"shore\">shore</span>, past a <span class=\"word\" data-word=\"quarry\">quarry</span>, and finally arrived at the <span class=\"word\" data-word=\"harbour\">harbour</span>. He took some pictures of a <span class=\"word\" data-word=\"steel\">steel</span>bridge in the <span class=\"word\" data-word=\"mist\">mist</span>. He came back late and had some <span class=\"word\" data-word=\"toast\">toast</span>for dinner.</p>"},{"title":"First Aid","html":"<p>My <span class=\"word\" data-word=\"fellow\">fellow</span>classmate gave me a <span class=\"word\" data-word=\"manual\">manual</span>and a <span class=\"word\" data-word=\"leaflet\">leaflet</span>about first aid. They introduced many <span class=\"word\" data-word=\"practical\">practical</span>first aid <span class=\"word\" data-word=\"techniques\">techniques</span>. The skin is the largest <span class=\"word\" data-word=\"organ\">organ</span>of your body. It <span class=\"word\" data-word=\"acts as\">acts as</span> a <span class=\"word\" data-word=\"barrier\">barrier</span> against disease, <span class=\"word\" data-word=\"toxins\">toxins</span>, and the sun’s <span class=\"word\" data-word=\"rays\">rays</span>. It gives you your <span class=\"word\" data-word=\"sense\">sense</span><span class=\"word\" data-word=\"of\">of</span><span class=\"word\" data-word=\"touch\">touch</span>. If your skin is burnt by <span class=\"word\" data-word=\"radiation\">radiation</span>or <span class=\"word\" data-word=\"acids\">acids</span>, you feel much pain, especially when you receive an <span class=\"word\" data-word=\"electric\">electric</span><span class=\"word\" data-word=\"shock\">shock</span>. Burns are no <span class=\"word\" data-word=\"minor\">minor</span>incidents. If the burn surface is red and <span class=\"word\" data-word=\"swollen\">swollen</span>with <span class=\"word\" data-word=\"blisters\">blisters</span>, you should work as a <span class=\"word\" data-word=\"paramedic\">paramedic</span>and provide <span class=\"word\" data-word=\"urgent\">urgent</span>treatment to <span class=\"word\" data-word=\"ease\">ease</span>the pain. You can <span class=\"word\" data-word=\"wrap\">wrap</span>the burnt area with a <span class=\"word\" data-word=\"loose\">loose</span>clean <span class=\"word\" data-word=\"fabric\">fabric</span>. If every <span class=\"word\" data-word=\"layer\">layer</span>of the skin is <span class=\"word\" data-word=\"affected\">affected </span>or <span class=\"word\" data-word=\"nerves\">nerves</span><span class=\"word\" data-word=\"underneath\">underneath</span> are damaged, the <span class=\"word\" data-word=\"victim\">victim</span>must be taken to the hospital immediately. Here are some other first aid cases. <span class=\"word\" data-word=\"what if\">What if</span> someone <span class=\"word\" data-word=\"swallows\">swallows</span>a chemical? What if someone <span class=\"word\" data-word=\"slips\">slips</span>in the <span class=\"word\" data-word=\"bathtub\">bathtub</span>? What do you do if an <span class=\"word\" data-word=\"elderly\">elderly</span>man falls on the <span class=\"word\" data-word=\"carpet\">carpet</span>? What do you do when you get bitten by a <span class=\"word\" data-word=\"mosquito\">mosquito</span>? What if your classmate <span class=\"word\" data-word=\"sprains\">sprains</span>his <span class=\"word\" data-word=\"ankle\">ankle</span>and <span class=\"word\" data-word=\"bleeds\">bleeds</span>? And what do you do when you hear a <span class=\"word\" data-word=\"drowning\">drowning</span>man <span class=\"word\" data-word=\"screaming\">screaming</span>? You might say, “I don’t <span class=\"word\" data-word=\"panic\">panic</span>. I’ll give first aid, like putting in an <span class=\"word\" data-word=\"iv\">IV</span><span class=\"word\" data-word=\"needle\">needle</span>, performing <span class=\"word\" data-word=\"mouth-to-mouth\">mouth-to-mouth</span><span class=\"word\" data-word=\"rescue\">rescue</span><span class=\"word\" data-word=\"breathing\">breathing</span>and checking his <span class=\"word\" data-word=\"vital\">vital</span><span class=\"word\" data-word=\"signs\">signs</span>. Also, I will call <span class=\"word\" data-word=\"emergency\">emergency </span>services without <span class=\"word\" data-word=\"delay\">delay</span>and try to explain to the <span class=\"word\" data-word=\"operator\">operator</span>until the <span class=\"word\" data-word=\"ambulance\">ambulance</span>arrives.”</p><p>Once, I was having dinner in a restaurant. I had my dinner <span class=\"word\" data-word=\"interrupted\">interrupted</span>when I heard someone <span class=\"word\" data-word=\"screaming\">screaming</span>from another table. A <span class=\"word\" data-word=\"fellow\">fellow</span>diner at the restaurant was <span class=\"word\" data-word=\"choking\">choking</span>on some <span class=\"word\" data-word=\"steak\">steak</span>. He was now holding his <span class=\"word\" data-word=\"throat\">throat</span>with his face turning red, while his <span class=\"word\" data-word=\"desperate\">desperate</span>friends were <span class=\"word\" data-word=\"slapping\">slapping</span>him on the <span class=\"word\" data-word=\"back\">back</span>. I went over to <span class=\"word\" data-word=\"help\">help</span>the diner <span class=\"word\" data-word=\"to\">to</span><span class=\"word\" data-word=\"his\">his</span><span class=\"word\" data-word=\"feet\">feet</span>. Then I used the <span class=\"word\" data-word=\"heimlich\">Heimlich</span><span class=\"word\" data-word=\"manoeuvre\">manoeuvre</span>. I stood behind him, made a <span class=\"word\" data-word=\"fist\">fist</span>with one hand, <span class=\"word\" data-word=\"grabbed\">grabbed</span>my <span class=\"word\" data-word=\"fist\">fist </span>with the other hand <span class=\"word\" data-word=\"tightly\">tightly</span>, and then pushed up and into his <span class=\"word\" data-word=\"stomach\">stomach </span>in one <span class=\"word\" data-word=\"motion\">motion</span>. I continued doing this until the <span class=\"word\" data-word=\"obstruction\">obstruction</span>was forced out. If he had been a small child, I would have laid him <span class=\"word\" data-word=\"face\">face</span><span class=\"word\" data-word=\"down\">down</span>on my <span class=\"word\" data-word=\"lap\">lap </span>so that he couldn’t <span class=\"word\" data-word=\"collapse\">collapse</span>. We have a duty to look after one another’s <span class=\"word\" data-word=\"welfare\">welfare</span>. How could I <span class=\"word\" data-word=\"justify\">justify</span>standing by and doing nothing? Recently I was <span class=\"word\" data-word=\"out\">out</span><span class=\"word\" data-word=\"of\">of</span><span class=\"word\" data-word=\"shape\">shape</span>. I always ate more and <span class=\"word\" data-word=\"slept\">slept</span><span class=\"word\" data-word=\"in\">in</span>. I stayed in a hospital <span class=\"word\" data-word=\"ward\">ward</span>for two weeks. The doctor suggested that I should get a gym <span class=\"word\" data-word=\"membership\">membership</span>and work out at the gym in the <span class=\"word\" data-word=\"suburbs\">suburbs</span>.</p>"},{"title":"Art","html":"<p>I <span class=\"word\" data-word=\"am\">am</span><span class=\"word\" data-word=\"fond\">fond</span><span class=\"word\" data-word=\"of\">of</span>the works of <span class=\"word\" data-word=\"primitives\">primitives</span>, and those of <span class=\"word\" data-word=\"realists\">realists</span><span class=\"word\" data-word=\"in\">in</span><span class=\"word\" data-word=\"particular\">particular</span>. Realists express <span class=\"word\" data-word=\"realism\">realism</span>by drawing <span class=\"word\" data-word=\"realistic\">realistic</span>paintings. Different from <span class=\"word\" data-word=\"christianity\">Christianity</span>, realistic painting pays more attention to <span class=\"word\" data-word=\"humanity\">humanity</span>and has <span class=\"word\" data-word=\"humanistic\">humanistic</span>thoughts. Nowadays, in order to show their<span class=\"word\" data-word=\"influential\">influential</span><span class=\"word\" data-word=\"ranks\">ranks</span>and <span class=\"word\" data-word=\"reputations\">reputations</span>, some <span class=\"word\" data-word=\"high-ranking\">high-ranking</span> officials and <span class=\"word\" data-word=\"nobles\">nobles</span>like to <span class=\"word\" data-word=\"collect\">collect </span>famous paintings. These <span class=\"word\" data-word=\"clients\">clients</span>go around <span class=\"word\" data-word=\"purchasing\">purchasing</span>paintings and <span class=\"word\" data-word=\"photography\">photography</span>works of famous artists. There is a painting called <span class=\"word\" data-word=\"impression\">Impression</span>, <span class=\"word\" data-word=\"sunrise\">Sunrise</span><span class=\"word\" data-word=\",\">,</span>a work filled with <span class=\"word\" data-word=\"mythology\">mythology</span>. The sun is slowly <span class=\"word\" data-word=\"emerging\">emerging</span>on the <span class=\"word\" data-word=\"horizon\">horizon </span>from different <span class=\"word\" data-word=\"dimensions\">dimensions</span>, showing the <span class=\"word\" data-word=\"outer\">outer</span>beauty of nature. The painting is <span class=\"word\" data-word=\"set\">set</span><span class=\"word\" data-word=\"apart\">apart</span><span class=\"word\" data-word=\"from\">from</span>others because of its <span class=\"word\" data-word=\"precise\">precise</span><span class=\"word\" data-word=\"description\">description </span>of nature. It <span class=\"word\" data-word=\"conveys\">conveys</span>the artist’s <span class=\"word\" data-word=\"subjective\">subjective</span>view of nature, and causes a <span class=\"word\" data-word=\"subsequent\">subsequent</span>influence. As the painting <span class=\"word\" data-word=\"precisely\">precisely</span>describes nature, it is called a <span class=\"word\" data-word=\"breakthrough\">breakthrough</span>in the history of painting.</p><p><span class=\"word\" data-word=\"sculptors\">Sculptors</span>create <span class=\"word\" data-word=\"sculptures\">sculptures</span>to give people <span class=\"word\" data-word=\"visual\">visual</span>beauty. Sculpture, like painting, is also called <span class=\"word\" data-word=\"fine\">fine</span><span class=\"word\" data-word=\"art\">art</span>. But some sculptors don’t seem to be <span class=\"word\" data-word=\"humble\">humble</span>enough when their works are <span class=\"word\" data-word=\"criticized\">criticized</span>. It means that they won’t accept <span class=\"word\" data-word=\"criticism\">criticism</span>. You can see sculptures everywhere in this park. Over the <span class=\"word\" data-word=\"pond\">pond</span>in the park, there is an <span class=\"word\" data-word=\"arched\">arched</span>bridge with several <span class=\"word\" data-word=\"arches\">arches</span>in it. There are some <span class=\"word\" data-word=\"water\">water</span><span class=\"word\" data-word=\"lilies\">lilies</span>in the pond. <span class=\"word\" data-word=\"brides\">Brides</span>and grooms often have pictures taken by the side of the bridge and the pond. In the center of the park stands a <span class=\"word\" data-word=\"permanent\">permanent</span><span class=\"word\" data-word=\"memorial\">memorial</span>. The local government has paid a large <span class=\"word\" data-word=\"investment\">investment</span>in the park.</p><p>There is a big museum in our city. It houses a <span class=\"word\" data-word=\"representative\">representative</span>collection of <span class=\"word\" data-word=\"antiques\">antiques </span>and <span class=\"word\" data-word=\"artistic\">artistic</span>works, including ancient <span class=\"word\" data-word=\"bronzes\">bronzes</span>, <span class=\"word\" data-word=\"ceramics\">ceramics</span>, <span class=\"word\" data-word=\"vases\">vases</span>, <span class=\"word\" data-word=\"ink\">ink</span>wash paintings and <span class=\"word\" data-word=\"buddhist\">Buddhist</span><span class=\"word\" data-word=\"objects\">objects</span>. It also has a collection of world-famous <span class=\"word\" data-word=\"symphonies\">symphonies</span>as well as <span class=\"word\" data-word=\"contemporary\">contemporary</span><span class=\"word\" data-word=\"animations\">animations</span>. In recent years, <span class=\"word\" data-word=\"entry\">entry</span> to the museum has been limited, so there is a <span class=\"word\" data-word=\"decline\">decline</span> in the number of visitors. For the <span class=\"word\" data-word=\"expansion\">expansion</span> of the museum’s influence, they often hold <span class=\"word\" data-word=\"exhibitions\">exhibitions</span>and collect <span class=\"word\" data-word=\"civil\">civil</span>products to attract tourists. <span class=\"word\" data-word=\"two-dimensional\">Two-dimensional</span>technology is made full use of in these exhibitions to provide film <span class=\"word\" data-word=\"frames\">frames</span>and<span class=\"word\" data-word=\"bring\">bring</span><span class=\"word\" data-word=\"ancient\">ancient </span>things <span class=\"word\" data-word=\"to\">to</span><span class=\"word\" data-word=\"life\">life</span>, so they <span class=\"word\" data-word=\"are\">are</span><span class=\"word\" data-word=\"worthy\">worthy</span><span class=\"word\" data-word=\"of\">of</span>being visited. As a result, the <span class=\"word\" data-word=\"reputation\">reputation</span>of the museum has been <span class=\"word\" data-word=\"guaranteed\">guaranteed</span>.</p>"},{"title":"Healthy Lifestyle","html":"<p><span class=\"word\" data-word=\"abuse\">Abuse</span>of <span class=\"word\" data-word=\"tobacco\">tobacco</span>or <span class=\"word\" data-word=\"alcohol\">alcohol</span>can cause <span class=\"word\" data-word=\"physical\">physical</span>harm. If you already <span class=\"word\" data-word=\"rely\">rely</span><span class=\"word\" data-word=\"on\">on</span>either of them, it’s hard to <span class=\"word\" data-word=\"quit\">quit</span>. However, you should not take a <span class=\"word\" data-word=\"negative\">negative</span>or <span class=\"word\" data-word=\"pessimistic\">pessimistic</span>attitude towards it. You must learn to <span class=\"word\" data-word=\"discipline\">discipline</span>yourself and <span class=\"word\" data-word=\"dominate\">dominate</span>your daily <span class=\"word\" data-word=\"behaviour\">behaviour</span>. According to <span class=\"word\" data-word=\"psychology\">psychology</span>, any <span class=\"word\" data-word=\"cue\">cue</span>can affect your decisions and actions. Therefore, you should <span class=\"word\" data-word=\"decide\">decide</span><span class=\"word\" data-word=\"on\">on</span>a plan to stop smoking or drinking and start <span class=\"word\" data-word=\"straight\">straight</span><span class=\"word\" data-word=\"away\">away</span>. <span class=\"word\" data-word=\"in\">In</span><span class=\"word\" data-word=\"response\">response</span><span class=\"word\" data-word=\"to\">to</span>your plan, don’t give up smoking or drinking <span class=\"word\" data-word=\"repeatedly\">repeatedly</span>, don’t take <span class=\"word\" data-word=\"pills\">pills</span>, but have your health <span class=\"word\" data-word=\"examined\">examined</span><span class=\"word\" data-word=\"regularly\">regularly</span>. You should also <span class=\"word\" data-word=\"enhance\">enhance</span><span class=\"word\" data-word=\"physical\">physical</span>exercise to <span class=\"word\" data-word=\"facilitate\">facilitate</span>your ability to fight disease. If you can do this, you are sure to get a good <span class=\"word\" data-word=\"reward\">reward</span>.</p><p>A team which <span class=\"word\" data-word=\"was\">was</span><span class=\"word\" data-word=\"composed\">composed</span><span class=\"word\" data-word=\"of\">of</span>medical <span class=\"word\" data-word=\"specialists,\">specialists,</span><span class=\"word\" data-word=\"consultants\">consultants</span>and <span class=\"word\" data-word=\"surgeons\">surgeons</span>went to the <span class=\"word\" data-word=\"drug\">drug</span><span class=\"word\" data-word=\"addiction\">addiction </span>treatment center. They had <span class=\"word\" data-word=\"made\">made</span><span class=\"word\" data-word=\"up\">up</span><span class=\"word\" data-word=\"their\">their</span><span class=\"word\" data-word=\"minds\">minds</span>to help the addicts <span class=\"word\" data-word=\"get rid of\">get rid of</span> their bad habits. In the center, they found some patients were smoking <span class=\"word\" data-word=\"cigarettes\">cigarettes</span>. Some patients tried to <span class=\"word\" data-word=\"skip\">skip</span>medical tests to avoid being <span class=\"word\" data-word=\"disturbed\">disturbed</span>. But all this was stopped. Other patients that grew <span class=\"word\" data-word=\"beards\">beards</span>were asked to <span class=\"word\" data-word=\"shave\">shave</span>them <span class=\"word\" data-word=\"off\">off</span>. In addition, the <span class=\"word\" data-word=\"surgeons\">surgeons</span>performed <span class=\"word\" data-word=\"surgery\">surgery</span>on serious patients to give them a <span class=\"word\" data-word=\"complete liberation\">complete liberation</span>from pain.</p><p>We know that <span class=\"word\" data-word=\"flu\">flu</span>is caused by a <span class=\"word\" data-word=\"virus\">virus</span>. People with flu can feel <span class=\"word\" data-word=\"dizzy\">dizzy</span>. They feel <span class=\"word\" data-word=\"stressed\">stressed</span><span class=\"word\" data-word=\"out\">out</span>or even feel<span class=\"word\" data-word=\"worn\">worn</span><span class=\"word\" data-word=\"out\">out</span>. In addition to taking medicine, sports will <span class=\"word\" data-word=\"refresh\">refresh</span>us and make us feel <span class=\"word\" data-word=\"dynamic\">dynamic</span>. For example, <span class=\"word\" data-word=\"skateboarding\">skateboarding</span>and <span class=\"word\" data-word=\"bowling\">bowling</span>are good choices. <span class=\"word\" data-word=\"physical\">Physical</span>exercise can <span class=\"word\" data-word=\"enhance\">enhance</span>our ability of disease <span class=\"word\" data-word=\"prevention\">prevention </span>and <span class=\"word\" data-word=\"stimulate\">stimulate</span>our <span class=\"word\" data-word=\"enthusiasm\">enthusiasm </span>for life. In addition, it can make us <span class=\"word\" data-word=\"absorbed\">absorbed</span>in our work. Let’s change the subject. Last week, I paid a visit to the <span class=\"word\" data-word=\"dentist\">dentist</span>and I did it<span class=\"word\" data-word=\"monthly\">monthly</span>. He advised me not to eat too much <span class=\"word\" data-word=\"sugary\">sugary</span>food or too many <span class=\"word\" data-word=\"nuts\">nuts</span>. </p>"},{"title":"Environmental Protection","html":"<p>One <span class=\"word\" data-word=\"graph\">graph</span>shows that <span class=\"word\" data-word=\"carbon\">carbon</span><span class=\"word\" data-word=\"dioxide\">dioxide</span>and <span class=\"word\" data-word=\"methane\">methane</span><span class=\"word\" data-word=\"emissions\">emissions</span>are increasing year by year. As a result, they have <span class=\"word\" data-word=\"destroyed\">destroyed </span>our <span class=\"word\" data-word=\"ecology\">ecology</span>and caused global warming. People burn <span class=\"word\" data-word=\"fossil\">fossil</span><span class=\"word\" data-word=\"fuels\">fuels</span>to produce waste gases, which are then <span class=\"word\" data-word=\"released\">released</span>into the <span class=\"word\" data-word=\"atmosphere\">atmosphere</span>. We should fully realize that global warming is a <span class=\"word\" data-word=\"worldwide\">worldwide</span>problem. We must <span class=\"word\" data-word=\"restrict\">restrict</span>the emission of carbon dioxide. We also <span class=\"word\" data-word=\"call for\">call for</span> a <span class=\"word\" data-word=\"restriction\">restriction</span>on other waste gas emissions. There is a <span class=\"word\" data-word=\"trend\">trend</span>that global warming may cause ice and snow to <span class=\"word\" data-word=\"melt\">melt</span>, making polar bears, <span class=\"word\" data-word=\"seals\">seals</span>or <span class=\"word\" data-word=\"penguins\">penguins</span><span class=\"word\" data-word=\"starve\">starve</span>to death, and our planet not <span class=\"word\" data-word=\"habitable\">habitable</span>. In order to <span class=\"word\" data-word=\"sustain\">sustain</span>our <span class=\"word\" data-word=\"survival\">survival </span>as well as for the <span class=\"word\" data-word=\"sustainable\">sustainable</span>development of human society, we must fight for the protection of our living environment and ecology. We should <span class=\"word\" data-word=\"seize\">seize</span>every <span class=\"word\" data-word=\"opportunity\">opportunity </span>to <span class=\"word\" data-word=\"advertise\">advertise </span>our protection <span class=\"word\" data-word=\"policy\">policy</span>through the <span class=\"word\" data-word=\"media\">media</span>, such as TV and radio <span class=\"word\" data-word=\"broadcasts\">broadcasts</span>. This is a hard and <span class=\"word\" data-word=\"comprehensive\">comprehensive</span>task, and we must <span class=\"word\" data-word=\"frequently\">frequently</span>warn people about it.</p><p>Our <span class=\"word\" data-word=\"reform\">reform</span>and opening-up <span class=\"word\" data-word=\"policy\">policy</span>aims not only to reform the economic system, but also to build a <span class=\"word\" data-word=\"harmonious\">harmonious</span><span class=\"word\" data-word=\"well-off\">well-off</span> society. In the <span class=\"word\" data-word=\"course\">course </span>of <span class=\"word\" data-word=\"implementing\">implementing</span>the reform, we have to <span class=\"word\" data-word=\"undergo\">undergo</span><span class=\"word\" data-word=\"challenges\">challenges</span>, tests, pains and even <span class=\"word\" data-word=\"chaos\">chaos</span>. The <span class=\"word\" data-word=\"annual\">annual</span>workshop on ecology and environment will be held soon, and I will <span class=\"word\" data-word=\"attend\">attend </span>the meeting <span class=\"word\" data-word=\"on\">on</span><span class=\"word\" data-word=\"behalf\">behalf</span><span class=\"word\" data-word=\"of\">of</span>our city. Some <span class=\"word\" data-word=\"sensitive\">sensitive</span>topics may be discussed at the meeting. It involves the use of <span class=\"word\" data-word=\"nuclear\">nuclear</span>energy and how to protect the <span class=\"word\" data-word=\"tropical\">tropical</span><span class=\"word\" data-word=\"jungles\">jungles</span>in the <span class=\"word\" data-word=\"basins\">basins</span>. At that time, <span class=\"word\" data-word=\"representatives\">representatives </span>will <span class=\"word\" data-word=\"submit\">submit</span>their <span class=\"word\" data-word=\"proposals\">proposals</span>.</p><p><span class=\"word\" data-word=\"smog\">Smog</span><span class=\"word\" data-word=\"originates\">originates</span>from the emission of waste gases. For the <span class=\"word\" data-word=\"conservation\">conservation</span>of our environment, a nationwide <span class=\"word\" data-word=\"campaign\">campaign</span>against smog has been <span class=\"word\" data-word=\"launched\">launched</span>.<span class=\"word\" data-word=\"dozens\">Dozens</span><span class=\"word\" data-word=\"of\">of</span><span class=\"word\" data-word=\"enterprises\">enterprises</span>in our city have set up <span class=\"word\" data-word=\"regulations\">regulations</span>and <span class=\"word\" data-word=\"agendas\">agendas</span>to <span class=\"word\" data-word=\"prohibit\">prohibit </span>the emission of <span class=\"word\" data-word=\"garbage\">garbage</span>and waste gases. The enterprises concerned must carry out a <span class=\"word\" data-word=\"thorough disposal\">thorough disposal</span>of their waste gas emissions as well as <span class=\"word\" data-word=\"waterways\">waterways</span>before the end of the year to <span class=\"word\" data-word=\"restore\">restore</span>them to their original condition. The government will never <span class=\"word\" data-word=\"tolerate\">tolerate</span>such a situation to continue. Enterprises with large <span class=\"word\" data-word=\"volumes\">volumes</span>of emissions will be<span class=\"word\" data-word=\"fined\"> fined</span>. If any enterprise fails to pass the <span class=\"word\" data-word=\"inspection\">inspection</span>, it will be fined, too.</p>"},{"title":"Poems","html":"<p>I am a <span class=\"word\" data-word=\"literary\">literary</span><span class=\"word\" data-word=\"youth\">youth </span>and an <span class=\"word\" data-word=\"amateur\">amateur</span>in English poetry. I am fond of <span class=\"word\" data-word=\"shakespeare\">Shakespeare</span>’s <span class=\"word\" data-word=\"poems\">poems </span>and <span class=\"word\" data-word=\"dramas\">dramas</span>full of <span class=\"word\" data-word=\"sorrow\">sorrow</span>. Now I can <span class=\"word\" data-word=\"recite\">recite</span>dozens of English poems and <span class=\"word\" data-word=\"folk\">folk</span>songs because they are full of <span class=\"word\" data-word=\"imagery\">imagery</span>, <span class=\"word\" data-word=\"rhyme\">rhyme</span>and <span class=\"word\" data-word=\"rhythm\">rhythm</span>. I still remember a <span class=\"word\" data-word=\"nursery\">nursery</span><span class=\"word\" data-word=\"rhyme\">rhyme</span>, which contains the words “<span class=\"word\" data-word=\"mockingbird\">mockingbird</span>” “<span class=\"word\" data-word=\"diamond\">diamond</span>ring”“<span class=\"word\" data-word=\"brass\">brass</span>”“<span class=\"word\" data-word=\"billy\">billy</span><span class=\"word\" data-word=\"goat\">goat</span>” and “<span class=\"word\" data-word=\"bull\">bull</span>”. There is a list poem called “Mother”, which describes hundreds of <span class=\"word\" data-word=\"bees\">bees</span>in the sunny weather, hundreds of <span class=\"word\" data-word=\"dewdrops\">dewdrops</span>to <span class=\"word\" data-word=\"greet\">greet </span>the <span class=\"word\" data-word=\"dawn\">dawn</span>, and hundreds of <span class=\"word\" data-word=\"delicate\">delicate</span><span class=\"word\" data-word=\"butterflies\">butterflies</span>in the <span class=\"word\" data-word=\"blossoms\">blossoms</span>on the <span class=\"word\" data-word=\"lawn\">lawn</span>. There is a <span class=\"word\" data-word=\"certain format\">certain format</span>for the number of lines in different forms of poetry. Another form of poem is called the <span class=\"word\" data-word=\"cinquain\">cinquain</span>, which <span class=\"word\" data-word=\"is\">is</span><span class=\"word\" data-word=\"made\">made</span><span class=\"word\" data-word=\"up\">up</span><span class=\"word\" data-word=\"of\">of</span>five lines. It <span class=\"word\" data-word=\"conveys\">conveys </span>a strong picture or a certain <span class=\"word\" data-word=\"mood\">mood</span>in a few words. Time <span class=\"word\" data-word=\"awaits\">awaits</span>no man and stop <span class=\"word\" data-word=\"teasing\">teasing</span>. Now let’s hold a discussion <span class=\"word\" data-word=\"revolving\">revolving</span>around English <span class=\"word\" data-word=\"poetry\">poetry</span>. If you already have some <span class=\"word\" data-word=\"comprehension\">comprehension</span>of English poetry,  please <span class=\"word\" data-word=\"utter\">utter</span>what you think. I’d like to hear your<span class=\"word\" data-word=\"respective\">respective</span>opinions.</p><p>In a <span class=\"word\" data-word=\"dominant\">dominant</span>place on the <span class=\"word\" data-word=\"shelf\">shelf</span>, there is a book of <span class=\"word\" data-word=\"prose\">prose</span>and a collection of <span class=\"word\" data-word=\"blank\">blank</span><span class=\"word\" data-word=\"verse\">verse</span>. There may be several other <span class=\"word\" data-word=\"versions\">versions</span>of them. The <span class=\"word\" data-word=\"core\">core</span><span class=\"word\" data-word=\"content\">content </span>of these works is to describe the daily life of <span class=\"word\" data-word=\"civilians\">civilians</span>. For example, in spring when the <span class=\"word\" data-word=\"cherry\">cherry</span><span class=\"word\" data-word=\"blossoms\">blossoms</span>were in full bloom, farmers began to <span class=\"word\" data-word=\"sow\">sow</span>the <span class=\"word\" data-word=\"seeds\">seeds</span>of their crops, hoping for the autumn <span class=\"word\" data-word=\"harvest\">harvest</span>. In the <span class=\"word\" data-word=\"era\">era</span>of <span class=\"word\" data-word=\"innocence\">innocence</span>, people were <span class=\"word\" data-word=\"innocent\">innocent</span>and <span class=\"word\" data-word=\"sympathetic\">sympathetic</span>. They showed <span class=\"word\" data-word=\"sympathy\">sympathy</span>and love for each other. At that time, <span class=\"word\" data-word=\"correspondence\">correspondence</span>was not so easy and convenient as it is today, but the relationship between people was close, not as <span class=\"word\" data-word=\"distant\">distant </span>as it is now.　</p><p>The <span class=\"word\" data-word=\"deadline\">deadline</span> for the <span class=\"word\" data-word=\"composition contest\">composition contest</span>is drawing near. My paper is about <span class=\"word\" data-word=\"racial\">racial</span><span class=\"word\" data-word=\"prejudice\">prejudice</span>and it needs to be <span class=\"word\" data-word=\"polished\">polished</span>by my teacher. To my <span class=\"word\" data-word=\"grief\">grief</span>, my teacher says that there are still a <span class=\"word\" data-word=\"string\">string</span>of questions to be <span class=\"word\" data-word=\"clarified\">clarified </span>in my paper. The <span class=\"word\" data-word=\"structure\">structure </span>of the composition is so <span class=\"word\" data-word=\"complicated\">complicated</span>that I have to make some <span class=\"word\" data-word=\"variations\">variations</span>wherever necessary.</p>"},{"title":"Iconic Attractions","html":"<p><span class=\"word\" data-word=\"located\">Located</span>to the south of the <span class=\"word\" data-word=\"equator\">equator</span>, Australia has many <span class=\"word\" data-word=\"iconic\">iconic</span> attractions, as well as lovely koalas and kangaroos. The leader of the country is the <span class=\"word\" data-word=\"prime\">prime</span><span class=\"word\" data-word=\"minister\">minister</span>. Do you know about the<span class=\"word\" data-word=\"foundation\">foundation</span> of the country and its <span class=\"word\" data-word=\"political\">political</span><span class=\"word\" data-word=\"divisions\">divisions</span>? If you visit <span class=\"word\" data-word=\"sydney\">Sydney</span>, you will be attracted by the <span class=\"word\" data-word=\"barbecue\">barbecue</span> there. Moreover, <span class=\"word\" data-word=\"bakeries\">bakeries</span>, fast-food <span class=\"word\" data-word=\"joints\">joints</span>, <span class=\"word\" data-word=\"butcher\">butcher</span> shops, and restaurants everywhere provide some of the <span class=\"word\" data-word=\"premier\">premier</span> food experiences in the world. You will enjoy Australian <span class=\"word\" data-word=\"dim\">dim</span><span class=\"word\" data-word=\"sim\">sim</span> with a Chinese <span class=\"word\" data-word=\"herb\">herb</span>taste. Australian <span class=\"word\" data-word=\"aborigines\">Aborigines</span> use a musical <span class=\"word\" data-word=\"instrument\">instrument </span>called the didgeridoo, which is made from a <span class=\"word\" data-word=\"hollow\">hollow</span> <span class=\"word\" data-word=\"branch\">branch</span>. Unlike a <span class=\"word\" data-word=\"horn\">horn</span>, there are no finger holes, and you just play it with <span class=\"word\" data-word=\"vibrating\">vibrating</span> lips. To change <span class=\"word\" data-word=\"pitch\">pitch</span>, you have to change the shape of your mouth. Australians have a <span class=\"word\" data-word=\"straightforward\">straightforward</span> and free-and-easy attitude towards life. Here is the tourism <span class=\"word\" data-word=\"slogan\">slogan</span>：“There’s nothing like Australia.”</p><p>The port city has many iconic attractions, one of which is the beach, not far from the <span class=\"word\" data-word=\"strait\">strait</span>.We can follow the marked <span class=\"word\" data-word=\"arrows\">arrows</span> to find it. This is a great <span class=\"word\" data-word=\"getaway\">getaway</span>, where tourists can enjoy many activities, such as <span class=\"word\" data-word=\"diving\">diving</span>, <span class=\"word\" data-word=\"kayaking\">kayaking</span>, and playing <span class=\"word\" data-word=\"golf\">golf</span>. Summer is the <span class=\"word\" data-word=\"peak\">peak</span><span class=\"word\" data-word=\"season\">season</span> of tourism here. Another iconic site is the wild theme park, in which visitors can see many wild <span class=\"word\" data-word=\"frogs\">frogs</span> living in their natural <span class=\"word\" data-word=\"domain\">domain</span>. There we can take <span class=\"word\" data-word=\"sample\">sample</span> photographs of wild animals, and <span class=\"word\" data-word=\"sponsor\">sponsor</span> wildlife to <span class=\"word\" data-word=\"preserve\">preserve </span>their <span class=\"word\" data-word=\"liberty\">liberty</span>. Still another attraction is the <span class=\"word\" data-word=\"monument\">monument</span><span class=\"word\" data-word=\"entitled\">entitled</span> “<span class=\"word\" data-word=\"freedom\">freedom</span> fighter”.</p><p>In New Zealand, there are many iconic things, likekiwi birds, <span class=\"word\" data-word=\"geysers\">geysers</span>, <span class=\"word\" data-word=\"geothermal\">geothermal</span><span class=\"word\" data-word=\"parks\">parks</span>, <span class=\"word\" data-word=\"bungee\">bungee</span><span class=\"word\" data-word=\"jumping\">jumping</span> and so on. There, you will also see <span class=\"word\" data-word=\"flocks\">flocks</span><span class=\"word\" data-word=\"of\">of</span> sheep <span class=\"word\" data-word=\"grazing\">grazing </span>on the grass. In Australia, the national animal is the kangaroo, which has a wide <span class=\"word\" data-word=\"distribution\">distribution</span>. The baby kangaroos get into their mother’s <span class=\"word\" data-word=\"pouch\">pouch</span> after they are born, where they stay only for a <span class=\"word\" data-word=\"temporary\">temporary</span><span class=\"word\" data-word=\"phase\">phase</span>. The <span class=\"word\" data-word=\"duck-billed\">duck-billed</span><span class=\"word\" data-word=\"platypus\">platypus</span> lays eggs in a <span class=\"word\" data-word=\"nest\">nest</span> like a bird, but it’s really a strange <span class=\"word\" data-word=\"mammal\">mammal</span>, with a unique <span class=\"word\" data-word=\"biology\">biology</span>. Its eggs <span class=\"word\" data-word=\"hatch\">hatch</span> after about ten days. It has a <span class=\"word\" data-word=\"capacity\">capacity</span> to find food in the water by using <span class=\"word\" data-word=\"electrical sensors\">electrical sensors </span>in its bill. Some countries make laws that if you want to keep <span class=\"word\" data-word=\"a\">a</span><span class=\"word\" data-word=\"small\">small</span><span class=\"word\" data-word=\"handful\">handful</span><span class=\"word\" data-word=\"of\">of</span> wild animals for a long or short <span class=\"word\" data-word=\"session\">session</span>, you must be <span class=\"word\" data-word=\"licensed\">licensed</span> or get a <span class=\"word\" data-word=\"license\">license</span>. You should build <span class=\"word\" data-word=\"grand\">grand</span><span class=\"word\" data-word=\"fences\">fences</span> around your feeding area. Recently, <span class=\"word\" data-word=\"violence\">violence</span> against wild animals occurs with increasing <span class=\"word\" data-word=\"frequency\">frequency</span>. Those who are <span class=\"word\" data-word=\"violent\">violent</span> towards wild animals will be put in <span class=\"word\" data-word=\"prison\">prison</span>.</p>"},{"title":"Sharing","html":"<p>As soon as I received the <span class=\"word\" data-word=\"mail\">mail</span> from my <span class=\"word\" data-word=\"colleague\">colleague</span>, I took a bus to the <span class=\"word\" data-word=\"secondary\">secondary</span> school in the village. <span class=\"word\" data-word=\"dragging\">Dragging</span> my <span class=\"word\" data-word=\"parcel\">parcel</span>, I came to the <span class=\"word\" data-word=\"hut\">hut</span> where I was going to live. A <span class=\"word\" data-word=\"ripe\">ripe</span> apple tree <span class=\"word\" data-word=\"shaded\">shaded</span> the hut. At the <span class=\"word\" data-word=\"doorway\">doorway</span>, my colleague welcomed me with a <span class=\"word\" data-word=\"handshake\">handshake</span>. Before I could <span class=\"word\" data-word=\"wipe\">wipe </span>the <span class=\"word\" data-word=\"sweat\">sweat </span>off my <span class=\"word\" data-word=\"forehead\">forehead</span>, we began to arrange the<span class=\"word\" data-word=\"household items\"> household items</span>, such as the <span class=\"word\" data-word=\"fireplace\">fireplace</span>, <span class=\"word\" data-word=\"kettles\">kettles</span>, <span class=\"word\" data-word=\"pans\">pans</span>, <span class=\"word\" data-word=\"jars\">jars</span>, <span class=\"word\" data-word=\"saucers\">saucers</span> and <span class=\"word\" data-word=\"grills\">grills</span>. Then we cleaned up all the <span class=\"word\" data-word=\"dust\">dust</span>, and washed the dirty <span class=\"word\" data-word=\"curtains\">curtains</span>. We made a <span class=\"word\" data-word=\"platform\">platform</span> of <span class=\"word\" data-word=\"weeds\">weeds</span> to sleep on. In a word, we tried our best to improve our <span class=\"word\" data-word=\"housing\">housing</span> conditions. At noon we ate the <span class=\"word\" data-word=\"leftover\">leftover</span><span class=\"word\" data-word=\"jam\">jam</span> for lunch. I had the <span class=\"word\" data-word=\"privilege\">privilege</span> to teach my class <span class=\"word\" data-word=\"chemistry\">chemistry</span>. When I reached the school <span class=\"word\" data-word=\"clay\">clay</span> playground, I was greeted by <span class=\"word\" data-word=\"a\">a</span><span class=\"word\" data-word=\"chorus\">chorus</span><span class=\"word\" data-word=\"of\">of</span> “good afternoon” from the boys who didn’t wear <span class=\"word\" data-word=\"cotton\">cotton</span><span class=\"word\" data-word=\"uniforms\">uniforms</span>. There was no electricity, running water or even a<span class=\"word\" data-word=\"washroom\">washroom</span>, <span class=\"word\" data-word=\"not\">not</span><span class=\"word\" data-word=\"to\">to</span><span class=\"word\" data-word=\"mention\">mention</span> <span class=\"word\" data-word=\"laptops\">laptops </span>or <span class=\"word\" data-word=\"tablets\">tablets</span>. All the students had were pencils, <span class=\"word\" data-word=\"rubbers\">rubbers</span>, and paper. In an experiment, the <span class=\"word\" data-word=\"mixture\">mixture </span>was <span class=\"word\" data-word=\"bubbling\">bubbling</span> out of the test <span class=\"word\" data-word=\"tube\">tube</span> <span class=\"word\" data-word=\"spilling\">spilling </span>everywhere. I tried to <span class=\"word\" data-word=\"plug\">plug</span> the tube, but I failed. The class at once became a<span class=\"word\" data-word=\"circus\">circus</span>. The whole classroom was in a <span class=\"word\" data-word=\"mess\">mess</span>.</p><p> The <span class=\"word\" data-word=\"chemist\">chemist</span> was getting old, with a long beard on his <span class=\"word\" data-word=\"jaw\">jaw</span> and many <span class=\"word\" data-word=\"wrinkles\">wrinkles</span> on his face. He used to do things in a <span class=\"word\" data-word=\"rigid\">rigid</span> and serious way. Being <span class=\"word\" data-word=\"disabled\">disabled</span>, he asked to retire and <span class=\"word\" data-word=\"resign\">resign</span> from his present post. He has devoted his life to science and technology, and we <span class=\"word\" data-word=\"take\">take</span>it<span class=\"word\" data-word=\"for\">for</span><span class=\"word\" data-word=\"granted\">granted</span>that he <span class=\"word\" data-word=\"deserves\">deserves</span> national <span class=\"word\" data-word=\"recognition\">recognition</span>. We <span class=\"word\" data-word=\"pray\">pray</span>that he will live a happy life.</p><p>My friend is a doctor. <span class=\"word\" data-word=\"lately\">Lately</span>, he has gone to Africa as a volunteer to help those who <span class=\"word\" data-word=\"contacted\">contacted</span><span class=\"word\" data-word=\"infectious\">infectious </span>diseases. I have no <span class=\"word\" data-word=\"objection\">objection </span>to his going, but I am unhappy about his leaving without asking for my<span class=\"word\" data-word=\"input\">input</span>. You may sing a different <span class=\"word\" data-word=\"tune\">tune</span>. My friend does a <span class=\"word\" data-word=\"circuit\">circuit</span> of the <span class=\"word\" data-word=\"rural\">rural </span>villages to provide medical treatment, help those with <span class=\"word\" data-word=\"disabilities\">disabilities</span>, and provide <span class=\"word\" data-word=\"consultation\">consultation</span> and training for local doctors. In addition, his team has given patients a new <span class=\"word\" data-word=\"malaria\">malaria </span>treatment invented in China, and this has saved many lives. Today, I want to <span class=\"word\" data-word=\"relay\">relay</span> to you that I’m proud of what the Chinese medical team has done. By any <span class=\"word\" data-word=\"criteria\">criteria</span> this work is worth doing, because it shows that we are global <span class=\"word\" data-word=\"citizens\">citizens </span>interested in world <span class=\"word\" data-word=\"stability\">stability</span>.</p>"},{"title":"Launching Your Career","html":"<p>Today’s topic is about how to get a <span class=\"word\" data-word=\"head\">head</span><span class=\"word\" data-word=\"start\">start</span> on your future <span class=\"word\" data-word=\"career\">career</span>. Don’t <span class=\"word\" data-word=\"bounce\">bounce</span><span class=\"word\" data-word=\"around\">around</span> in your head about your career choice. Here is a career <span class=\"word\" data-word=\"aptitude\">aptitude</span> test that involves different work <span class=\"word\" data-word=\"scenarios\">scenarios</span>.</p><p>1. Work as a <span class=\"word\" data-word=\"lawyer\">lawyer</span> to help in a <span class=\"word\" data-word=\"lawsuit\">lawsuit</span></p><p>2. <span class=\"word\" data-word=\"assemble\">Assemble</span> <span class=\"word\" data-word=\"a\">a</span> <span class=\"word\" data-word=\"chest\">chest</span><span class=\"word\" data-word=\"of\">of</span><span class=\"word\" data-word=\"drawers\">drawers</span></p><p>3. Help develop a cure for <span class=\"word\" data-word=\"breast\">breast</span> <span class=\"word\" data-word=\"cancer\">cancer</span></p><p>4. Work as a chemist to <span class=\"word\" data-word=\"analyse\">analyse </span>the <span class=\"word\" data-word=\"elements hydrogen\">elements hydrogen</span> and <span class=\"word\" data-word=\"radium\">radium</span></p><p>5. <span class=\"word\" data-word=\"design\">Design </span>a new <span class=\"word\" data-word=\"range\">range </span>of <span class=\"word\" data-word=\"wrist\">wrist</span> <span class=\"word\" data-word=\"accessories\">accessories</span></p><p>6. Design clothes for brides and<span class=\"word\" data-word=\"bridegrooms\">bridegrooms</span></p><p>7. Teach children <span class=\"word\" data-word=\"geometry\">geometry</span></p><p>8. Help and advise people in <span class=\"word\" data-word=\"debt\">debt</span></p><p>9. <span class=\"word\" data-word=\"categorise\">Categorise</span> <span class=\"word\" data-word=\"employee profiles\">employee profiles</span></p><p>In addition, there are many other <span class=\"word\" data-word=\"professions\">professions </span>that are not included, such as the <span class=\"word\" data-word=\"real\">real</span><span class=\"word\" data-word=\"estate\">estate</span><span class=\"word\" data-word=\"agents\">agents</span>, the <span class=\"word\" data-word=\"accountants\">accountants</span>, the <span class=\"word\" data-word=\"graphic\">graphic</span> designers, and even the <span class=\"word\" data-word=\"detectives\">detectives</span> or <span class=\"word\" data-word=\"spies\">spies</span>. In short, once you have made your choice, you must <span class=\"word\" data-word=\"orient\">orient</span> yourself to the profession. According to the <span class=\"word\" data-word=\"participant\">participant</span>’s work personality <span class=\"word\" data-word=\"code\">code</span>, what careers would you <span class=\"word\" data-word=\"recommend\">recommend</span>? </p><p>When asked about their future careers, Tom, John, Mary and Li Ming <span class=\"word\" data-word=\"came\">came</span><span class=\"word\" data-word=\"to\">to</span><span class=\"word\" data-word=\"a\">a</span><span class=\"word\" data-word=\"conclusion\">conclusion</span>quickly and <span class=\"word\" data-word=\"submitted\">submitted </span>their <span class=\"word\" data-word=\"cvs\">CVs</span>. <span class=\"word\" data-word=\"for the sake of\">For the sake of </span>social <span class=\"word\" data-word=\"fairness\">fairness </span>and <span class=\"word\" data-word=\"justice\">justice</span>, Tom wants to be a lawyer and send <span class=\"word\" data-word=\"greedy\">greedy</span> people to <span class=\"word\" data-word=\"prison\">prison</span>. John hopes to be an <span class=\"word\" data-word=\"entrepreneur\">entrepreneur</span> and contribute to the economic development of the world. Mary wishes to be a <span class=\"word\" data-word=\"receptionist\">receptionist</span> and serve her customers better. Li Ming would like to be a <span class=\"word\" data-word=\"socialist\">socialist</span> and <span class=\"word\" data-word=\"dedicate\">dedicate</span> himself to the <span class=\"word\" data-word=\"cause\">cause </span>of communism. </p><p>The Community Life <span class=\"word\" data-word=\"council\">Council</span> has been <span class=\"word\" data-word=\"established\">established </span>lately, and its work covers all aspects. For example, they <span class=\"word\" data-word=\"attend\">attend</span><span class=\"word\" data-word=\"to\">to</span> the disabled people, <span class=\"word\" data-word=\"supervise\">supervise</span> the behavior of various enterprises, such as raising <span class=\"word\" data-word=\"camels\">camels</span> and <span class=\"word\" data-word=\"foxes\">foxes</span>, <span class=\"word\" data-word=\"knitting\">knitting</span><span class=\"word\" data-word=\"wool\">wool</span>and <span class=\"word\" data-word=\"sewing\">sewing</span><span class=\"word\" data-word=\"purses\">purses</span>, and are also <span class=\"word\" data-word=\"responsible\">responsible </span>for the management of <span class=\"word\" data-word=\"parking\">parking</span> lots. The Council is also <span class=\"word\" data-word=\"in charge of\">in charge of </span>their <span class=\"word\" data-word=\"finances\">finances</span>, checks their <span class=\"word\" data-word=\"receipts\">receipts</span> and makes sure that <span class=\"word\" data-word=\"employers\">employers</span><span class=\"word\" data-word=\"acquire\">acquire</span> business <span class=\"word\" data-word=\"certificates\">certificates</span>. The Council gives <span class=\"word\" data-word=\"priority\">priority</span> to environmental protection and orders <span class=\"word\" data-word=\"cages\">cages</span> and <span class=\"word\" data-word=\"collars\">collars</span> for family <span class=\"word\" data-word=\"pets\">pets</span>. Besides, the Council holds<span class=\"word\" data-word=\"intermediate\">intermediate</span> level <span class=\"word\" data-word=\"handwriting\">handwriting</span><span class=\"word\" data-word=\"competitions\">competitions </span>on a <span class=\"word\" data-word=\"regular\">regular </span>basis. Some participants have no <span class=\"word\" data-word=\"proficiency\">proficiency</span> in writing or even made mistakes. For example, camel is written as <span class=\"word\" data-word=\"canal\">canal</span>, <span class=\"word\" data-word=\"desert\">desert</span> as dessert, <span class=\"word\" data-word=\"disk\">disk</span> as desk, and<span class=\"word\" data-word=\"fry\">fry</span> as fly.</p
