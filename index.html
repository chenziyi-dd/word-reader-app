>"},{"title":"The Role of Comprehensive Education in Shaping the Future of Our Nation","html":"<p>In today's <span class=\"word\" data-word=\"rapidly\">rapidly</span> evolving world, education holds a central role in shaping the future of individuals and <span class=\"word\" data-word=\"nation\">nations</span> . From the <span class=\"word\" data-word=\"standpoint\">standpoint</span> of social development, it is clear that a <span class=\"word\" data-word=\"comprehensive\">comprehensive</span> education <span class=\"word\" data-word=\"system\">system</span> is necessary to address the challenges that our society faces. This <span class=\"word\" data-word=\"system\">system</span> should not only provide knowledge but also prepare individuals to <span class=\"word\" data-word=\"steer\">steer</span> their lives with <span class=\"word\" data-word=\"steady\">steady</span> <span class=\"word\" data-word=\"purpose\">purpose</span>. <span class=\"word\" data-word=\"however\">However</span>, the <span class=\"word\" data-word=\"quality\">quality</span> of education varies widely across different <span class=\"word\" data-word=\"region\">regions</span>, leading to <span class=\"word\" data-word=\"gap\">gap</span> that can <span class=\"word\" data-word=\"disappear\">disappear</span> when we adopt a more <span class=\"word\" data-word=\"inclusive\">inclusive</span> <span class=\"word\" data-word=\"approach\">approach</span> to teaching.</p><p>A good education should enable students to <span class=\"word\" data-word=\"comprehend\">comprehend</span> both the <span class=\"word\" data-word=\"theoretical\">theoretical</span> and <span class=\"word\" data-word=\"practical\">practical</span> <span class=\"word\" data-word=\"aspect\">aspects</span> of their <span class=\"word\" data-word=\"field\">field</span> of study. As a <span class=\"word\" data-word=\"statesman\">statesman</span> once said, the true value of education is its ability to <span class=\"word\" data-word=\"anticipate\">anticipate</span> and address future challenges. The <span class=\"word\" data-word=\"standard\">standard</span> of education, therefore, must reflect the <span class=\"word\" data-word=\"nature\">nature</span> of these challenges. Education should not only <span class=\"word\" data-word=\"disclose\">disclose</span> facts but also <span class=\"word\" data-word=\"compose\">compose</span> knowledge that helps individuals <span class=\"word\" data-word=\"assert\">assert</span> their rights and duties in society.</p><p>To ensure the <span class=\"word\" data-word=\"effectiveness\">effectiveness</span> of education, it is vital to assemble various <span class=\"word\" data-word=\"perspective\">perspectives</span> into a <span class=\"word\" data-word=\"composition\">composition</span> that embodies <span class=\"word\" data-word=\"diverse\">diverse</span> viewpoints. A <span class=\"word\" data-word=\"stern\">stern</span> <span class=\"word\" data-word=\"approach\">approach</span> to education may <span class=\"word\" data-word=\"disappoint\">disappoint</span> students who are eager to <span class=\"word\" data-word=\"discover\">discover</span> new ideas. Therefore, education must offer <span class=\"word\" data-word=\"portion\">portions</span> of <span class=\"word\" data-word=\"wisdom\">wisdom</span> from various <span class=\"word\" data-word=\"discipline\">disciplines</span>, helping students <span class=\"word\" data-word=\"discover\">discover</span> their <span class=\"word\" data-word=\"potential\">potential</span> and <span class=\"word\" data-word=\"maximize\">maximize</span> it.</p><p><span class=\"word\" data-word=\"moreover\">Moreover</span>, the <span class=\"word\" data-word=\"current\">current</span> education <span class=\"word\" data-word=\"system\">system</span> must <span class=\"word\" data-word=\"adapt\">adapt</span> to the needs of a <span class=\"word\" data-word=\"rapidly\">rapidly</span> changing world. In the face of growing <span class=\"word\" data-word=\"anxiety\">anxiety</span> about global challenges, it is important that education <span class=\"word\" data-word=\"system\">systems</span> evolve to help students <span class=\"word\" data-word=\"comprehend\">comprehend</span> the complexities of these issues. The ability to <span class=\"word\" data-word=\"conduct\">conduct</span> research and <span class=\"word\" data-word=\"disclose\">disclose</span> findings is crucial in a world where <span class=\"word\" data-word=\"statistic\">statistics</span> often guide decisions that affect the well-being of the native population. As such, <span class=\"word\" data-word=\"discipline\">discipline</span> and an emphasis on <span class=\"word\" data-word=\"assembly\">assembly</span> are necessary to maintain a balance between personal and <span class=\"word\" data-word=\"collective\">collective</span> responsibilities.</p><p>In a society where challenges are <span class=\"word\" data-word=\"multifaceted\">multifaceted</span>, we must not <span class=\"word\" data-word=\"condemn\">condemn</span> the pursuit of progress but instead <span class=\"word\" data-word=\"condense\">condense</span> <span class=\"word\" data-word=\"complex\">complex</span> issues into actionable <span class=\"word\" data-word=\"solution\">solutions</span>. Every <span class=\"word\" data-word=\"step\">step</span> , no matter how small, can <span class=\"word\" data-word=\"contribute\">contribute</span> to a positive outcome. <span class=\"word\" data-word=\"however\">However</span>, the <span class=\"word\" data-word=\"condition\">condition</span> of education must evolve simultaneously with the needs of the people it serves. This requires <span class=\"word\" data-word=\"conductor\">conductors</span> of education, teachers and leaders alike, to help students <span class=\"word\" data-word=\"navigate\">navigate</span> the ever-changing landscape.</p><p><span class=\"word\" data-word=\"however\">However</span>, when we fail to recognize and respect the <span class=\"word\" data-word=\"diverse\">diverse</span> nationalities within our society, we risk creating a annoying <span class=\"word\" data-word=\"divide\">divide</span> that <span class=\"word\" data-word=\"undermine\">undermines</span> the very <span class=\"word\" data-word=\"foundation\">foundation</span> of social <span class=\"word\" data-word=\"cohesion\">cohesion</span>. The <span class=\"word\" data-word=\"overlap\">overlap</span> of cultures and values in educational spaces can be a source of both strength and challenge. It is <span class=\"word\" data-word=\"possible\">possible</span> to <span class=\"word\" data-word=\"harness\">harness</span> this diversity to enrich the educational experience for all.</p><p>A strong <span class=\"word\" data-word=\"stance\">stance</span> on respect for diversity is necessary to <span class=\"word\" data-word=\"foster\">foster</span> a <span class=\"word\" data-word=\"harmonious\">harmonious</span> society. Without such a <span class=\"word\" data-word=\"foundation\">foundation</span>, education can stem division, with individuals becoming more <span class=\"word\" data-word=\"anxious\">anxious</span> and feeling <span class=\"word\" data-word=\"apart\">apart</span> from one another. In the worst cases, this lack of understanding could lead to acts of <span class=\"word\" data-word=\"attack\">attack</span> or even <span class=\"word\" data-word=\"violence\">violence</span>, as seen in the <span class=\"word\" data-word=\"tragic\">tragic</span> example of <span class=\"word\" data-word=\"assassination\">assassination</span> due to <span class=\"word\" data-word=\"political\">political</span> disagreements. A narrow view that fails to recognize the diversity of student backgrounds can <span class=\"word\" data-word=\"startle\">startle</span> us when we see the difference it creates. When children are <span class=\"word\" data-word=\"deprive\">deprived</span> of <span class=\"word\" data-word=\"proper\">proper</span> resources, it’s as though they are being allowed to <span class=\"word\" data-word=\"starve\">starve</span> intellectually, and this harms not just the individuals, but the <span class=\"word\" data-word=\"nation\">nation</span> as a whole.</p><p>Furthermore, the <span class=\"word\" data-word=\"state\">state</span> of education directly impacts the <span class=\"word\" data-word=\"status\">status</span> of a <span class=\"word\" data-word=\"nation\">nation</span>. Education should not just be a <span class=\"word\" data-word=\"statute\">statute</span> written on paper but a living, breathing force that <span class=\"word\" data-word=\"empower\">empowers</span> students to understand one another and <span class=\"word\" data-word=\"thrive\">thrive</span> together. Every <span class=\"word\" data-word=\"state\">statement</span> about the importance of education must benefit every <span class=\"word\" data-word=\"household\">household</span>, regardless of socioeconomic <span class=\"word\" data-word=\"status\">status</span>. The <span class=\"word\" data-word=\"component\">component</span> of empathy and critical thinking must be nurtured in every curriculum to prevent divisions that may otherwise take root.</p><p><span class=\"word\" data-word=\"overall\">Overall</span>, every action we take, whether to <span class=\"word\" data-word=\"huddle\">huddle</span> together in times of challenge or to raise the <span class=\"word\" data-word=\"flag\">flag</span> of progress, <span class=\"word\" data-word=\"contribute\">contributes</span> to the shaping of a new narrative for generations to come. <span class=\"word\" data-word=\"possibility\">Possibility</span> for overcoming the <span class=\"word\" data-word=\"obstacle\">obstacles</span> lies in embracing change, nurturing the minds that will hold our future, and <span class=\"word\" data-word=\"pour\">pouring</span> our talents into making meaningful contributions.</p>"},{"title":"The Role of Innovation in Modern Society","html":"<p>In the modern society, <span class=\"word\" data-word=\"innovation\">innovation</span> has become a <span class=\"word\" data-word=\"primary\">primary</span> driving force for <span class=\"word\" data-word=\"progress\">progress</span>. It has the ability to <span class=\"word\" data-word=\"construct\">construct</span> a brighter future and <span class=\"word\" data-word=\"fulfill\">fulfill</span> the hopes of many. However, as we huge <span class=\"word\" data-word=\"innovation\">innovation</span>, we must also be <span class=\"word\" data-word=\"aware\">aware</span> of the potential <span class=\"word\" data-word=\"challenge\">challenges</span> it presents ------the <span class=\"word\" data-word=\"fundamental\">fundamental</span> importance of <span class=\"word\" data-word=\"innovation\">innovation</span> in shaping our society, its impact on the <span class=\"word\" data-word=\"environment\">environment</span>, and the potential <span class=\"word\" data-word=\"aftermath\">aftermaths</span>.</p><p>Firstly, <span class=\"word\" data-word=\"innovation\">innovation</span> is <span class=\"word\" data-word=\"essential\">essential</span> in shaping a <span class=\"word\" data-word=\"fruitful\">fruitful</span> future and improve our lives. The ability to <span class=\"word\" data-word=\"distinguish\">distinguish</span> between what is <span class=\"word\" data-word=\"primitive\">primitive</span> and what is <span class=\"word\" data-word=\"striking\">striking</span> can be the <span class=\"word\" data-word=\"key\">key</span> to <span class=\"word\" data-word=\"progress\">progress</span>. This is <span class=\"word\" data-word=\"evident\">evident</span> in <span class=\"word\" data-word=\"sector\">sectors</span> such as <span class=\"word\" data-word=\"transport\">transport</span>, where <span class=\"word\" data-word=\"advance\">advances</span> have <span class=\"word\" data-word=\"revolutionize\">revolutionized</span> how we move people and <span class=\"word\" data-word=\"good\">goods</span> across the <span class=\"word\" data-word=\"globe\">globe</span>. As the <span class=\"word\" data-word=\"principle\">principle</span> of <span class=\"word\" data-word=\"innovation\">innovation</span> <span class=\"word\" data-word=\"motivate\">motivates</span> us <span class=\"word\" data-word=\"forward\">forward</span>, we must <span class=\"word\" data-word=\"guarantee\">guarantee</span> that it is used to <span class=\"word\" data-word=\"benefit\">benefit</span> everyone, and not just those with the <span class=\"word\" data-word=\"resource\">resources</span> to <span class=\"word\" data-word=\"monopolize\">monopolize</span> <span class=\"word\" data-word=\"chance\">chances</span>.</p><p>Besides, <span class=\"word\" data-word=\"innovation\">innovation</span> has a significant impact on <span class=\"word\" data-word=\"mental\">mental</span> <span class=\"word\" data-word=\"fitness\">fitness</span>, making the role of <span class=\"word\" data-word=\"psychiatry\">psychiatry</span> <span class=\"word\" data-word=\"increasingly\">increasingly</span> <span class=\"word\" data-word=\"evident\">evident</span>. The <span class=\"word\" data-word=\"transmission\">transmission</span> of new technologies can strike <span class=\"word\" data-word=\"emotional\">emotional</span> <span class=\"word\" data-word=\"strain\">strain</span>. For <span class=\"word\" data-word=\"instance\">instance</span>, the <span class=\"word\" data-word=\"distinction\">distinction</span> between those who are tech-savvy and those who are not is <span class=\"word\" data-word=\"astonishing\">astonishing</span>, with some <span class=\"word\" data-word=\"adapt\">adapting</span> easily while others <span class=\"word\" data-word=\"struggle\">struggle</span>. As we continue to innovate, it’s <span class=\"word\" data-word=\"crucial\">crucial</span> that society <span class=\"word\" data-word=\"consist\">consist</span> of support systems that <span class=\"word\" data-word=\"console\">console</span> <span class=\"word\" data-word=\"individual\">individuals</span> and help them <span class=\"word\" data-word=\"cope\">cope</span> with these <span class=\"word\" data-word=\"challenge\">challenges</span>.</p><p>Moreover, <span class=\"word\" data-word=\"innovation\">innovation</span> demands <span class=\"word\" data-word=\"constant\">constant</span> <span class=\"word\" data-word=\"effort\">effort</span> and a <span class=\"word\" data-word=\"consistent\">consistent</span> <span class=\"word\" data-word=\"approach\">approach</span> to ensure <span class=\"word\" data-word=\"long-term\">long-term</span> success. However, it can also introduce <span class=\"word\" data-word=\"challenge\">challenges</span>, such as the <span class=\"word\" data-word=\"liability\">liability</span> associated with new technologies. For <span class=\"word\" data-word=\"instance\">instance</span>, the development of <span class=\"word\" data-word=\"medical\">medical</span> technologies like <span class=\"word\" data-word=\"organ\">organ</span> <span class=\"word\" data-word=\"transplant\">transplant</span> raises ethical questions about <span class=\"word\" data-word=\"safety\">safety</span> and <span class=\"word\" data-word=\"fairness\">fairness</span>. While <span class=\"word\" data-word=\"innovation\">innovations</span> often bring a <span class=\"word\" data-word=\"string\">string</span> of <span class=\"word\" data-word=\"benefit\">benefits</span>, their <span class=\"word\" data-word=\"annual\">annual</span> <span class=\"word\" data-word=\"review\">reviews</span> are necessary to <span class=\"word\" data-word=\"address\">address</span> potential risks. The <span class=\"word\" data-word=\"rapid-speed\">rapid-speed</span> <span class=\"word\" data-word=\"pace\">pace</span> of change can annoy <span class=\"word\" data-word=\"individual\">individuals</span> who feel <span class=\"word\" data-word=\"disconnected\">di es</span>, such as the need to <span class=\"word\" data-word=\"update\">update</span> <span class=\"word\" data-word=\"stock\">stock</span>. This <span class=\"word\" data-word=\"shift\">shift</span> can make work feel <span class=\"word\" data-word=\"monotonous\">monotonous</span> for some, and <span class=\"word\" data-word=\"lack\">lack</span> of <span class=\"word\" data-word=\"fund\">funding</span> may <span class=\"word\" data-word=\"hinder\">hinder</span> <span class=\"word\" data-word=\"progress\">progress</span>. While <span class=\"word\" data-word=\"innovation\">innovation</span> can <span class=\"word\" data-word=\"entertain\">entertain</span>, it can also <span class=\"word\" data-word=\"stun\">stun</span> people, <span class=\"word\" data-word=\"highlight\">highlighting</span> the need for <span class=\"word\" data-word=\"responsible\">responsible</span> <span class=\"word\" data-word=\"management\">management</span> to ensure <span class=\"word\" data-word=\"positive\">positive</span> <span class=\"word\" data-word=\"outcome\">outcomes</span>.</p><p>Moreover, The <span class=\"word\" data-word=\"structure\">structure</span> of our <span class=\"word\" data-word=\"constitution\">constitution</span> and the <span class=\"word\" data-word=\"function\">function</span> of <span class=\"word\" data-word=\"law\">laws</span> must ensure that <span class=\"word\" data-word=\"individual\">individuals</span> and <span class=\"word\" data-word=\"enterprise\">enterprises</span> <span class=\"word\" data-word=\"operate\">operate</span> within ethical boundaries. <span class=\"word\" data-word=\"psychology\">Psychology</span> teaches us that our <span class=\"word\" data-word=\"mood\">mood</span> and <span class=\"word\" data-word=\"behavior\">behavior</span> can be shaped by these external <span class=\"word\" data-word=\"factor\">factors</span>. If left unchecked, <span class=\"word\" data-word=\"innovation\">innovation</span> can lead to <span class=\"word\" data-word=\"anguish\">anguish</span> for those who are <span class=\"word\" data-word=\"liable\">liable</span> but unable to keep <span class=\"word\" data-word=\"pace\">pace</span> with the rapid changes. <span class=\"word\" data-word=\"innovation\">Innovation</span> has improved <span class=\"word\" data-word=\"storage\">storage</span> and how we <span class=\"word\" data-word=\"store\">store</span> <span class=\"word\" data-word=\"data\">data</span>. As <span class=\"word\" data-word=\"business\">businesses</span> take a <span class=\"word\" data-word=\"stride\">stride</span> <span class=\"word\" data-word=\"forward\">forward</span>, the <span class=\"word\" data-word=\"principal\">principal</span> <span class=\"word\" data-word=\"concern\">concern</span> must be protecting <span class=\"word\" data-word=\"privacy\">privacy</span>. Companies need a proper <span class=\"word\" data-word=\"license\">license</span> to use <span class=\"word\" data-word=\"data\">data</span> ethically, ensuring <span class=\"word\" data-word=\"consumer\">consumers</span> remain <span class=\"word\" data-word=\"innocent\">innocent</span> of <span class=\"word\" data-word=\"misuse\">misuse</span>.</p><p>In <span class=\"word\" data-word=\"conclusion\">conclusion</span>, <span class=\"word\" data-word=\"innovation\">innovation</span> is the <span class=\"word\" data-word=\"anchor\">anchor</span> of <span class=\"word\" data-word=\"progress\">progress</span>, yet it must be <span class=\"word\" data-word=\"pursue\">pursued</span> responsibly. As we continue to <span class=\"word\" data-word=\"transmit\">transmit</span> knowledge and ideas, we must stay true to the <span class=\"word\" data-word=\"principle\">principle</span> of <span class=\"word\" data-word=\"fairness\">fairness</span> and <span class=\"word\" data-word=\"equity\">equity</span>. Only then can we ensure that <span class=\"word\" data-word=\"innovation\">innovation</span> will continue to serve as a force for <span class=\"word\" data-word=\"good\">good</span>, <span class=\"word\" data-word=\"construct\">constructing</span> a better, more <span class=\"word\" data-word=\"inclusive\">inclusive</span> world for all.</p>"}];

// === 多学生管理 ===
var vocabStudents=[];
var currentStudent='';

function getReviewKey(){
  return currentStudent?('vocabReviewV2__'+currentStudent):'vocabReviewV2';
}

function loadStudents(){
  try{
    var s=localStorage.getItem('vocabStudents');
    if(s){vocabStudents=JSON.parse(s)}
  }catch(e){vocabStudents=[]}
  if(vocabStudents.length===0){
    // First time: check if old data exists, create default student
    var old=localStorage.getItem('vocabReviewV2');
    if(old){
      vocabStudents=['默认学生'];
      saveStudents();
      currentStudent='默认学生';
      localStorage.setItem('vocabCurrentStudent',currentStudent);
    }
  }
  var cs=localStorage.getItem('vocabCurrentStudent');
  if(cs && vocabStudents.indexOf(cs)>=0){currentStudent=cs}
}

function saveStudents(){
  try{localStorage.setItem('vocabStudents',JSON.stringify(vocabStudents))}catch(e){}
}

function renderStudentBar(){
  var sel=document.getElementById('student-select');
  if(!sel)return;
  var html='<option value="">请选择学生</option>';
  for(var i=0;i<vocabStudents.length;i++){
    var s=vocabStudents[i];
    html+='<option value="'+s+'"'+(s===currentStudent?' selected':'')+'>'+s+'</option>';
  }
  sel.innerHTML=html;
  var hint=document.getElementById('student-hint');
  if(!hint)return;
  if(currentStudent){
    hint.innerHTML='当前：<span class="student-name-display">'+currentStudent+'</span> 的复习数据';
    hint.style.color='#27ae60';
  }else{
    hint.innerHTML='未选择学生时无法添加复习单词';
    hint.style.color='#999';
  }
}

function switchStudent(){
  var sel=document.getElementById('student-select');
  currentStudent=sel.value;
  localStorage.setItem('vocabCurrentStudent',currentStudent);
  // Reload review data for this student
  reviewData=[];
  migrateReviewData();
  renderReview();
  renderReviewModule();
  renderStudentBar();
  // Re-render article to update highlight
  if(typeof renderArticles==='function')renderArticles();
}

function addStudent(){
  var input=document.getElementById('student-input');
  var name=input.value.trim();
  if(!name){alert('请输入学生名字');return}
  if(vocabStudents.indexOf(name)>=0){alert('该学生已存在');return}
  vocabStudents.push(name);
  saveStudents();
  currentStudent=name;
  localStorage.setItem('vocabCurrentStudent',name);
  input.value='';
  // Initialize empty review data for new student
  reviewData=[];
  saveReviewData();
  renderReview();
  renderReviewModule();
  renderStudentBar();
  if(typeof renderArticles==='function')renderArticles();
}

function deleteStudent(){
  if(!currentStudent){alert('请先选择要删除的学生');return}
  if(!confirm('确定删除「'+currentStudent+'」及其所有复习数据？'))return;
  // Remove student data
  localStorage.removeItem('vocabReviewV2__'+currentStudent);
  vocabStudents=vocabStudents.filter(function(s){return s!==currentStudent});
  saveStudents();
  currentStudent='';
  localStorage.removeItem('vocabCurrentStudent');
  reviewData=[];
  migrateReviewData();
  renderReview();
  renderReviewModule();
  renderStudentBar();
  if(typeof renderArticles==='function')renderArticles();
}

function migrateReviewData(){
  var existing=localStorage.getItem(getReviewKey());
  if(existing){
    try{reviewData=JSON.parse(existing)}catch(e){reviewData=[]}
    return;
  }
  var old=(!currentStudent)?localStorage.getItem('vocabReview'):null;
  if(old){
    try{
      var oldWords=JSON.parse(old);
      var now=Date.now();
      reviewData=oldWords.map(function(w){
        return{word:w,addedAt:now,stage:0,lastReview:null,nextReview:now+REVIEW_INTERVALS[0]*86400000,reviewCount:0,correctCount:0};
      });
      saveReviewData();
    }catch(e){reviewData=[]}
  }
}

function getReviewEntry(w){return reviewData.find(function(r){return r.word===w})}
function addWordToReview(w){
  if(!currentStudent){alert('请先在上方选择或添加学生！');return}
  if(isInReview(w))return;
  var now=Date.now();
  reviewData.push({word:w,addedAt:now,stage:0,lastReview:null,nextReview:now+REVIEW_INTERVALS[0]*86400000,reviewCount:0,correctCount:0});
  saveReviewData();hlWord(w,true);renderReview();
}
function removeWordFromReview(w){
  reviewData=reviewData.filter(function(r){return r.word!==w});
  saveReviewData();hlWord(w,false);renderReview();
  if(curWord===w){var ab=document.getElementById('add-btn');ab.textContent='➕ 加入重点复习';ab.classList.remove('added')}
}
function getDueWords(){
  var now=Date.now();
  return reviewData.filter(function(e){return e.stage<REVIEW_INTERVALS.length&&e.nextReview<=now});
}
function getReviewStats(){
  var now=Date.now();var due=0,mastered=0;
  reviewData.forEach(function(e){
    if(e.stage>=REVIEW_INTERVALS.length)mastered++;
    else if(e.nextReview<=now)due++;
  });
  return{due:due,mastered:mastered,total:reviewData.length};
}
function getNextReviewText(entry){
  if(entry.stage>=REVIEW_INTERVALS.length)return '已掌握';
  var diff=entry.nextReview-Date.now();
  var days=Math.floor(diff/86400000);
  var hours=Math.floor(diff/3600000);
  if(days<=0&&hours<=0)return '现在复习';
  if(days<=0)return hours+'小时后';
  if(days===1)return '明天';
  return days+'天后';
}

// === 渲染：标签栏 ===
function renderCategoryBar(){
  var bar=document.getElementById('category-bar');
  if(!bar)return;
  var html=CATEGORIES.map(function(c,i){
    return '<span class="cat-btn'+(i===currentCategory?' active':'')+'" data-cat="'+i+'">'+c.name+'</span>';
  }).join('');
  bar.innerHTML=html;
  bar.querySelectorAll('.cat-btn').forEach(function(b){
    b.addEventListener('click',function(){switchCategory(parseInt(b.dataset.cat))});
  });
}
function renderTabs(){
  var tabs=document.getElementById('tabs');
  var cat=CATEGORIES[currentCategory];
  var html='';
  for(var i=cat.start;i<cat.start+cat.count;i++){
    var label=TAB_LABELS[i]||('篇'+(i+1));
    var isActive=(i===curArticle)?' active':'';
    html+='<span class="tab'+isActive+'" data-idx="'+i+'">'+label+'</span>';
  }
  html+='<span class="tab tab-review" data-idx="review">🧠 抗遗忘复习</span>';
  tabs.innerHTML=html;
  tabs.querySelectorAll('.tab').forEach(function(t){
    t.addEventListener('click',function(){switchTab(t.dataset.idx)});
  });
}
function switchCategory(catIdx){
  currentCategory=catIdx;
  renderCategoryBar();
  renderTabs();
  var cat=CATEGORIES[catIdx];
  switchArticle(cat.start);
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
  var firstTab=document.querySelector('.tab[data-idx="'+cat.start+'"]');
  if(firstTab)firstTab.classList.add('active');
}
function switchTab(idx){
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
  var tab=document.querySelector('.tab[data-idx="'+idx+'"]');
  if(tab)tab.classList.add('active');
  if(idx==='review'){
    document.querySelectorAll('.article').forEach(function(a){a.classList.remove('active')});
    document.getElementById('review-module').classList.add('active');
    document.getElementById('note-section').style.display='none';
    document.getElementById('draw-section').style.display='none';
    document.getElementById('read-bar').style.display='none';
    renderReviewModule();
  }else{
    document.getElementById('review-module').classList.remove('active');
    document.getElementById('note-section').style.display='';
    document.getElementById('draw-section').style.display='';
    document.getElementById('read-bar').style.display='';
    var tabIdx=parseInt(idx);
    for(var ci=0;ci<CATEGORIES.length;ci++){
      var cat=CATEGORIES[ci];
      if(tabIdx>=cat.start&&tabIdx<cat.start+cat.count){
        if(currentCategory!==ci){
          currentCategory=ci;
          renderCategoryBar();
          renderTabs();
          var t=document.querySelector('.tab[data-idx="'+idx+'"]');
          if(t)t.classList.add('active');
        }
        break;
      }
    }
    switchArticle(tabIdx);
  }
}

function switchArticle(idx){
  curArticle=idx;
  document.querySelectorAll('.article').forEach(function(a){a.classList.remove('active')});
  var art=document.querySelector('.article[data-idx="'+idx+'"]');
  if(art)art.classList.add('active');
  document.getElementById('cur-article').textContent=idx+1;
  loadNote(idx);
}

function renderArticles(){
  var c=document.getElementById('articles-container');
  c.innerHTML=ARTICLES.map(function(a,i){
    var fb=generateFillBlankHTML(i);
    return '<div class="article'+(i===0?' active':'')+'" data-idx="'+i+'">'+
      '<h2>'+a.title+'</h2>'+a.html+
      '<div class="fillblank-section">'+
        '<h3>\ud83d\udcdd \u8bed\u6cd5\u586b\u7a7a\uff08\u6839\u636e\u63d0\u793a\u586b\u5165\u6b63\u786e\u5f62\u5f0f\uff09</h3>'+
        '<div class="fillblank-content">'+fb+'</div>'+
        '<div class="fillblank-actions">'+
          '<button class="fb-btn fb-check" data-fb-check="'+i+'">\u68c0\u67e5\u7b54\u6848</button>'+
          '<button class="fb-btn fb-reset" data-fb-reset="'+i+'">\u91cd\u7f6e</button>'+
          '<span class="fillblank-score" id="fb-score-'+i+'"></span>'+
        '</div>'+
      '</div>'+
    '</div>';
  }).join('');
  document.querySelectorAll('.article .word').forEach(function(el){
    var w=el.dataset.word;
    el.addEventListener('click',function(e){e.preventDefault();showPopup(w)});
    el.addEventListener('contextmenu',function(e){e.preventDefault();e.stopPropagation();showCtx(e,w)});
    var pt=null;
    el.addEventListener('touchstart',function(e){pt=setTimeout(function(){showCtx({clientX:e.touches[0].clientX,clientY:e.touches[0].clientY},w)},500)});
    el.addEventListener('touchend',function(){clearTimeout(pt)});
    el.addEventListener('touchmove',function(){clearTimeout(pt)});
    if(isInReview(w))el.classList.add('in-review');
  });
  document.querySelectorAll('[data-fb-check]').forEach(function(btn){
    btn.addEventListener('click',function(){checkFillBlank(parseInt(btn.dataset.fbCheck))});
  });
  document.querySelectorAll('[data-fb-reset]').forEach(function(btn){
    btn.addEventListener('click',function(){resetFillBlank(parseInt(btn.dataset.fbReset))});
  });
}

function generateFillBlankHTML(idx){
  var tmp=document.createElement('div');
  tmp.innerHTML=ARTICLES[idx].html;
  var blanks=tmp.querySelectorAll('.word');
  blanks.forEach(function(el){
    var correct=el.textContent.trim();
    var base=el.dataset.word;
    var wrap=document.createElement('span');
    wrap.className='blank-wrap';
    var safeCorrect=correct.replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    var safeBase=base.replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    var firstLetter=safeBase.charAt(0).toLowerCase();
    var hintUnderscores='';
    for(var k=1;k<safeBase.length;k++){if(safeBase.charAt(k).match(/[a-zA-Z]/)){hintUnderscores+='_'}else{hintUnderscores+=safeBase.charAt(k)}}
    wrap.innerHTML='<input type="text" class="blank-input" data-correct="'+safeCorrect+'" autocomplete="off" autocapitalize="none"> <span class="blank-hint">('+firstLetter+hintUnderscores+')</span><span class="blank-answer">['+safeCorrect+']</span>';
    el.parentNode.replaceChild(wrap,el);
  });
  return tmp.innerHTML;
}

function checkFillBlank(idx){
  var section=document.querySelector('.article[data-idx="'+idx+'"] .fillblank-content');
  if(!section)return;
  var inputs=section.querySelectorAll('.blank-input');
  var correct=0,total=inputs.length;
  inputs.forEach(function(input){
    var ans=input.value.trim().toLowerCase();
    var correctAns=input.dataset.correct.toLowerCase();
    var answerSpan=input.parentElement.querySelector('.blank-answer');
    if(ans===correctAns){
      input.classList.add('correct');input.classList.remove('wrong');
      if(answerSpan)answerSpan.classList.remove('show');
      correct++;
    }else{
      input.classList.add('wrong');input.classList.remove('correct');
      if(answerSpan)answerSpan.classList.add('show');
    }
  });
  var scoreEl=document.getElementById('fb-score-'+idx);
  if(scoreEl){
    var pct=Math.round(correct/total*100);
    var color= pct>=80?'#4caf50':pct>=60?'#ff9800':'#e53935';
    scoreEl.innerHTML='得分: <span style="color:'+color+';font-size:18px">'+correct+'</span>/'+total+' ('+pct+'%)';
  }
}

function resetFillBlank(idx){
  var section=document.querySelector('.article[data-idx="'+idx+'"] .fillblank-content');
  if(!section)return;
  section.querySelectorAll('.blank-input').forEach(function(input){
    input.value='';input.classList.remove('correct','wrong');
    var ans=input.parentElement.querySelector('.blank-answer');
    if(ans)ans.classList.remove('show');
  });
  var scoreEl=document.getElementById('fb-score-'+idx);
  if(scoreEl)scoreEl.textContent='';
}

function renderReview(){
  var c=document.getElementById('review-words');
  document.getElementById('review-count').textContent='重点复习: '+reviewData.length+' 个';
  document.getElementById('clear-btn').style.display=reviewData.length>0?'inline':'none';
  if(reviewData.length===0){c.innerHTML='<span class="review-empty">右键点击文章中的单词即可添加</span>';return}
  c.innerHTML=reviewData.map(function(entry){
    var w=entry.word;
    var d=wordMap[w.toLowerCase()]||{};
    var title=d.cn?(w+' — '+d.cn):w;
    var stageClass='s'+Math.min(entry.stage,6);
    var stageText=entry.stage>=REVIEW_INTERVALS.length?'M':'L'+Math.min(entry.stage+1,6);
    var nextText=getNextReviewText(entry);
    var dueClass='';
    if(entry.stage>=REVIEW_INTERVALS.length)dueClass='mastered';
    else if(entry.nextReview<=Date.now())dueClass='due';
    return '<span class="review-chip" data-word="'+w+'" title="'+title+'">'+w+'<span class="stage-badge '+stageClass+'">'+stageText+'</span><span class="next-due '+dueClass+'">'+nextText+'</span> <span class="rm" data-rm="'+w+'">×</span></span>';
  }).join('');
  c.querySelectorAll('.review-chip').forEach(function(el){
    el.addEventListener('click',function(e){
      if(e.target.classList.contains('rm')){e.stopPropagation();removeWordFromReview(e.target.dataset.rm)}
      else{showPopup(el.dataset.word)}
    });
  });
}

// === 单词弹窗 ===
function showPopup(w){
  var d=wordMap[w.toLowerCase()];
  if(!d)return;
  curWord=w;curIdx=wordList.indexOf(w);
  document.getElementById('popup-en').textContent=d.en;
  document.getElementById('popup-ph').textContent=d.ph+' '+d.pos;
  document.getElementById('popup-cn').textContent=d.cn;
  var colLabel=document.getElementById('popup-col-label');if(colLabel){var isHS=HS_WORDS.has(d.en.toLowerCase());if(isHS){colLabel.textContent='📌 高考必考固定搭配';}else{colLabel.textContent='📌 中考固定搭配';}}document.getElementById('popup-col').textContent=d.col;
  document.getElementById('word-idx').textContent=(curIdx+1)+' / '+wordList.length;
  var ab=document.getElementById('add-btn');
  if(isInReview(w)){ab.textContent='✅ 已加入（点击移除）';ab.classList.add('added')}
  else{ab.textContent='➕ 加入重点复习';ab.classList.remove('added')}
  document.getElementById('popup-overlay').classList.add('active');
  speak(w);
}
function closePopup(){document.getElementById('popup-overlay').classList.remove('active');curWord=null}

// === 右键菜单 ===
function showCtx(e,w){
  curWord=w;
  var m=document.getElementById('ctx-menu');
  var ai=document.getElementById('ctx-add'),ri=document.getElementById('ctx-remove');
  if(isInReview(w)){ai.style.display='none';ri.style.display='block'}
  else{ai.style.display='block';ri.style.display='none'}
  var x=e.clientX,y=e.clientY;
  if(x+160>window.innerWidth)x=window.innerWidth-170;
  if(y+90>window.innerHeight)y=window.innerHeight-100;
  m.style.left=x+'px';m.style.top=y+'px';m.classList.add('active');
}
function hideCtx(){document.getElementById('ctx-menu').classList.remove('active')}

// === 高亮 ===
function hlWord(w,on){document.querySelectorAll('.word[data-word="'+w+'"]').forEach(function(el){if(on)el.classList.add('in-review');else el.classList.remove('in-review')})}

// === 朗读 ===
function speak(w){if('speechSynthesis'in window){speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=0.8;speechSynthesis.speak(u)}}
var isReading=false;
function readAll(){
  if(isReading){speechSynthesis.cancel();isReading=false;var b=document.getElementById('read-btn');b.textContent='🔊 朗读本篇';b.classList.remove('reading');return}
  if(!('speechSynthesis'in window))return;
  isReading=true;
  var b=document.getElementById('read-btn');b.textContent='⏹ 停止';b.classList.add('reading');
  var t=document.querySelector('.article.active .article')?document.querySelector('.article.active').textContent:document.querySelector('.article.active').textContent;

  u.onend=function(){isReading=false;b.textContent='🔊 朗读本篇';b.classList.remove('reading')};
  speechSynthesis.speak(u);
}

// === 抗遗忘复习模块 ===
function renderReviewModule(){
  var studentLabel=currentStudent?('（'+currentStudent+'的复习计划）'):'（未选择学生）';
  var stats=getReviewStats();
  var html='<div class="review-stats">';
  html+='<div class="stat-card due"><div class="num">'+stats.due+'</div><div class="lbl">待复习</div></div>';
  html+='<div class="stat-card mastered"><div class="num">'+stats.mastered+'</div><div class="lbl">已掌握</div></div>';
  html+='<div class="stat-card"><div class="num">'+stats.total+'</div><div class="lbl">总计</div></div>';
  html+='</div>';
  html+='<div style="text-align:center;color:#888;font-size:13px;margin:8px 0">'+studentLabel+'</div>';
  if(stats.due>0){
    html+='<button class="review-start-btn" id="start-review">🧠 开始复习（'+stats.due+'个单词待复习）</button>';
  }else if(stats.total>0){
    html+='<div class="review-empty-msg">🎉 暂无需要复习的单词！<br>下次复习时间请看下方列表。</div>';
  }else{
    html+='<div class="review-empty-msg">'+studentLabel+'<br>还没有复习单词。<br>阅读文章时右键单词即可加入复习计划。</div>';
  }
  if(stats.total>0){
    html+='<div class="review-schedule"><h3>📋 复习计划</h3><div class="review-schedule-list">';
    reviewData.forEach(function(entry){
      var d=wordMap[entry.word.toLowerCase()]||{};
      var nextText=getNextReviewText(entry);
      var dueClass='';
      if(entry.stage>=REVIEW_INTERVALS.length)dueClass='mastered';
      else if(entry.nextReview<=Date.now())dueClass='due';
      html+='<span class="review-chip" data-review-word="'+entry.word+'" title="'+(d.cn||'')+'">'+entry.word+'<span class="stage-badge s'+Math.min(entry.stage,6)+'">'+(entry.stage>=REVIEW_INTERVALS.length?'M':'L'+Math.min(entry.stage+1,6))+'</span><span class="next-due '+dueClass+'">'+nextText+'</span></span>';
    });
    html+='</div></div>';
  }
  document.getElementById('review-module').innerHTML=html;
  var startBtn=document.getElementById('start-review');
  if(startBtn)startBtn.addEventListener('click',startReviewSession);
  document.querySelectorAll('[data-review-word]').forEach(function(el){
    el.addEventListener('click',function(){showPopup(el.dataset.reviewWord)});
  });
}
function startReviewSession(){
  var due=getDueWords();
  if(due.length===0)return;
  for(var i=due.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tmp=due[i];due[i]=due[j];due[j]=tmp}
  reviewSession.active=true;reviewSession.words=due;reviewSession.currentIdx=0;
  reviewSession.showAnswer=false;reviewSession.remembered=0;reviewSession.forgot=0;
  renderReviewCard();
}
function renderReviewCard(){
  if(reviewSession.currentIdx>=reviewSession.words.length){renderReviewSummary();return}
  var entry=reviewSession.words[reviewSession.currentIdx];
  var w=entry.word;
  var d=wordMap[w.toLowerCase()]||{};
  var progress=(reviewSession.currentIdx/reviewSession.words.length)*100;
  var html='<div class="review-card">';
  html+='<div class="review-progress">进度: '+(reviewSession.currentIdx+1)+' / '+reviewSession.words.length+'</div>';
  html+='<div class="review-progress-bar"><div class="fill" style="width:'+progress+'%"></div></div>';
  html+='<div class="review-word">'+w+'</div>';
  if(reviewSession.showAnswer){
    html+='<div class="review-ph">'+(d.ph||'')+' '+(d.pos||'')+'</div>';
    html+='<div class="review-cn">'+(d.cn||'')+'</div>';
    if(d.col)html+='<div class="review-col-box">📌 '+d.col+'</div>';
    html+='<div class="review-actions">';
    html+='<button class="rbtn rbtn-forgot" id="rbtn-forgot">❌ 忘了</button>';
    html+='<button class="rbtn rbtn-remember" id="rbtn-remember">✅ 记得</button>';
    html+='</div>';
  }else{
    html+='<div class="review-actions"><button class="rbtn rbtn-show" id="rbtn-show">👀 显示答案</button></div>';
  }
  html+='</div>';
  document.getElementById('review-module').innerHTML=html;
  if(reviewSession.showAnswer){
    document.getElementById('rbtn-remember').addEventListener('click',function(){reviewNext(true)});
    document.getElementById('rbtn-forgot').addEventListener('click',function(){reviewNext(false)});
  }else{
    document.getElementById('rbtn-show').addEventListener('click',function(){
      reviewSession.showAnswer=true;renderReviewCard();speak(reviewSession.words[reviewSession.currentIdx].word);
    });
  }
}
function reviewNext(remembered){
  var entry=reviewSession.words[reviewSession.currentIdx];
  if(remembered){
    reviewSession.remembered++;
    entry.stage=Math.min(entry.stage+1,REVIEW_INTERVALS.length);
    entry.correctCount++;
  }else{
    reviewSession.forgot++;entry.stage=0;
  }
  entry.reviewCount++;entry.lastReview=Date.now();
  if(entry.stage>=REVIEW_INTERVALS.length){
    entry.nextReview=Date.now()+MASTERED_REVIEW_DAYS*86400000;
  }else{
    entry.nextReview=Date.now()+REVIEW_INTERVALS[entry.stage]*86400000;
  }
  saveReviewData();
  reviewSession.currentIdx++;reviewSession.showAnswer=false;
  renderReviewCard();
}
function renderReviewSummary(){
  reviewSession.active=false;
  var html='<div class="review-card review-summary">';
  html+='<h3>✅ 本次复习完成！</h3>';
  html+='<div class="nums">';
  html+='<div class="remembered"><div class="n">'+reviewSession.remembered+'</div><div class="lbl">记得</div></div>';
  html+='<div class="forgot"><div class="n">'+reviewSession.forgot+'</div><div class="lbl">忘了</div></div>';
  html+='</div>';
  html+='<button class="review-start-btn" id="review-back">返回复习面板</button>';
  html+='</div>';
  document.getElementById('review-module').innerHTML=html;
  document.getElementById('review-back').addEventListener('click',function(){renderReviewModule();renderReview()});
}

document.addEventListener('click',function(){hideCtx()});

});

  if(reviewData.length===0)return;

    reviewData=[];saveReviewData();
    document.querySelectorAll('.word.in-review').forEach(function(el){el.classList.remove('in-review')});
    renderReview();
  }
});

var noteArea=document.getElementById('note-area');
var noteArtNum=document.getElementById('note-art-num');
function loadNote(idx){noteArtNum.textContent=idx+1;noteArea.value=localStorage.getItem('vocabNote_'+idx)||''}
noteArea.addEventListener('input',function(){localStorage.setItem('vocabNote_'+curArticle,noteArea.value)});

// === 画板功能 ===
var canvas=document.getElementById('draw-canvas');
var ctx=canvas.getContext('2d');
var drawColor='#333',drawSize=3,drawType='pen',isDrawing=false,lx=0,ly=0;
function resizeCanvas(){
  var saved=null;
  if(canvas.width>0&&canvas.height>0){try{saved=ctx.getImageData(0,0,canvas.width,canvas.height)}catch(e){}}
  var r=canvas.parentElement.getBoundingClientRect();
  canvas.width=Math.max(Math.floor(r.width-2),300);
  canvas.height=320;
  if(saved){try{ctx.putImageData(saved,0,0)}catch(e){}}
}
function getPos(e){var r=canvas.getBoundingClientRect();if(e.touches&&e.touches[0]){return{x:e.touches[0].clientX-r.left,y:e.touches[0].clientY-r.top}}return{x:e.clientX-r.left,y:e.clientY-r.top}}
function startDraw(e){isDrawing=true;var p=getPos(e);lx=p.x;ly=p.y}
function drawMove(e){if(!isDrawing)return;e.preventDefault();var p=getPos(e);ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(p.x,p.y);ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=drawType==='eraser'?20:drawSize;ctx.strokeStyle=drawColor;ctx.globalCompositeOperation=drawType==='eraser'?'destination-out':'source-over';ctx.stroke();lx=p.x;ly=p.y}
function endDraw(){isDrawing=false}
canvas.addEventListener('mousedown',startDraw);
canvas.addEventListener('mousemove',drawMove);
canvas.addEventListener('mouseup',endDraw);
canvas.addEventListener('mouseleave',endDraw);
canvas.addEventListener('touchstart',startDraw,{passive:false});
canvas.addEventListener('touchmove',drawMove,{passive:false});
canvas.addEventListener('touchend',endDraw);
document.querySelectorAll('.draw-tool[data-color]').forEach(function(b){b.addEventListener('click',function(){drawColor=b.dataset.color;drawType='pen';document.querySelectorAll('.draw-tool[data-color]').forEach(function(x){x.classList.remove('active')});b.classList.add('active');document.querySelectorAll('.draw-tool[data-type="eraser"]').forEach(function(x){x.classList.remove('active')})})});
document.querySelector('.draw-tool[data-type="eraser"]').addEventListener('click',function(){drawType='eraser';document.querySelectorAll('.draw-tool[data-color]').forEach(function(x){x.classList.remove('active')});this.classList.add('active')});
document.querySelectorAll('.draw-tool[data-size]').forEach(function(b){b.addEventListener('click',function(){drawSize=parseInt(b.dataset.size);document.querySelectorAll('.draw-tool[data-size]').forEach(function(x){x.classList.remove('active')});b.classList.add('active')})});
document.getElementById('draw-clear').addEventListener('click',function(){if(confirm('确定清空画板吗？')){ctx.clearRect(0,0,canvas.width,canvas.height)}});
document.getElementById('draw-save').addEventListener('click',function(){var link=document.createElement('a');link.download='vocab_canvas.png';link.href=canvas.toDataURL();link.click()});
window.addEventListener('resize',resizeCanvas);

// === PWA 安装提示 ===
var deferredPrompt=null;
window.addEventListener('beforeinstallprompt',function(e){
  e.preventDefault();deferredPrompt=e;
  document.getElementById('install-btn').style.display='inline-block';
});
document.getElementById('install-btn').addEventListener('click',function(){
  if(deferredPrompt){
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function(){deferredPrompt=null;document.getElementById('install-btn').style.display='none'});
  }
});

// === Service Worker 注册 ===
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').catch(function(e){console.log('SW registration failed:',e)});
  });
}

// === 初始化 ===
try{loadStudents()}catch(e){console.log('loadStudents error:',e)}
try{renderStudentBar()}catch(e){console.log('renderStudentBar error:',e)}
try{migrateReviewData()}catch(e){console.log('migrateReviewData error:',e)}
try{document.getElementById('total-count').textContent='共 '+wordList.length+' 个单词'}catch(e){console.log('total-count error:',e)}
try{renderCategoryBar()}catch(e){console.log('renderCategoryBar error:',e)}
try{renderTabs()}catch(e){console.log('renderTabs error:',e)}
try{renderArticles()}catch(e){console.log('renderArticles error:',e)}
try{renderReview()}catch(e){console.log('renderReview error:',e)}
try{resizeCanvas()}catch(e){console.log('resizeCanvas error:',e)}
try{loadNote(0)}catch(e){console.log('loadNote error:',e)}
</script>
