ass=\"word\" data-word=\"s\">s </span>that we should choose a good <span class=\"word\" data-word=\"research topic\">research topic </span>and a <span class=\"word\" data-word=\"paper\">paper</span><span class=\"word\" data-word=\"title\"> title</span>. <span class=\"word\" data-word=\"obviously\">Obviously</span>, he will provide us with a good <span class=\"word\" data-word=\"solution\">solution</span>.</p><p><span class=\"word\" data-word=\"youth\">Youth </span>life is filled with <span class=\"word\" data-word=\"adventure\">adventure</span>. Young people feel that there is a <span class=\"word\" data-word=\"generation\">generation</span><span class=\"word\" data-word=\"gap\">gap</span>between themselves and <span class=\"word\" data-word=\"adults\">adults</span>. They <span class=\"word\" data-word=\"are attracted to\">are attracted to </span>new things, and <span class=\"word\" data-word=\"addicted to\">addicted to</span>the Internet. Their <span class=\"word\" data-word=\"behaviors\">behaviors </span>are quite different from those of <span class=\"word\" data-word=\"adults\">adults</span>. They <span class=\"word\" data-word=\"focus on\">focus on </span>the modern lifestyle. <span class=\"word\" data-word=\"experts recommend\">Experts recommend </span>that young people not only take <span class=\"word\" data-word=\"risks\">risks </span>but also learn <span class=\"word\" data-word=\"survival\">survival </span>ways.</p>"},{"title":"TRAVELLING AROUND","html":"<p>Tian Hua is making <span class=\"word\" data-word=\"arrangements\">arrangements </span>for a trip <span class=\"word\" data-word=\"abroad\">abroad</span>. She is going to visit the Old <span class=\"word\" data-word=\"castle\">Castle </span>in <span class=\"word\" data-word=\"spain\">Spain</span>. She has <span class=\"word\" data-word=\"applied for\">applied for </span>a <span class=\"word\" data-word=\"visa\">visa</span>. She has also <span class=\"word\" data-word=\"rented\">rented </span>some outdoor clothes and <span class=\"word\" data-word=\"packed\">packed </span>them. She thinks it is an <span class=\"word\" data-word=\"extremely amazing\">extremely amazing </span>trip. She will feel <span class=\"word\" data-word=\"amazed\">amazed </span>whenever she thinks of those <span class=\"word\" data-word=\"amazing tourist spots\">amazing tourist spots</span>. <span class=\"word\" data-word=\"other than\">Other than </span>the Old <span class=\"word\" data-word=\"castle\">Castle </span>in <span class=\"word\" data-word=\"spain\">Spain</span>, she will visit <span class=\"word\" data-word=\"the eiffel tower\">the Eiffel Tower </span>in France, <span class=\"word\" data-word=\"disneyland\">Disneyland </span>in the United States, <span class=\"word\" data-word=\"the amazon rainforest\">the Amazon rainforest </span>in Brazil and <span class=\"word\" data-word=\"lake titicaca\">Lake Titicaca </span>in South America. But her <span class=\"word\" data-word=\"destination\">destination </span>is the <span class=\"word\" data-word=\"site\">site </span>of the <span class=\"word\" data-word=\"ruins\">ruins </span>of <span class=\"word\" data-word=\"the inca empire\">the Inca Empire </span>in <span class=\"word\" data-word=\"peru\">Peru</span>. There she can feel the ancient <span class=\"word\" data-word=\"civilization\">civilization </span>of mankind. Tian Hua plans first to <span class=\"word\" data-word=\"hike\">hike </span>along the country <span class=\"word\" data-word=\"path\">path</span>, and then travel by any <span class=\"word\" data-word=\"type\">type </span>of <span class=\"word\" data-word=\"transport\">transport</span>, and at last take an international <span class=\"word\" data-word=\"flight\">flight</span>. She will carry her <span class=\"word\" data-word=\"package\">package</span>, <span class=\"word\" data-word=\"credit cards\">credit cards </span>and a travel <span class=\"word\" data-word=\"brochure\">brochure </span>with her.</p><p>Once a tourist who went on a <span class=\"word\" data-word=\"package tour\">package tour </span>lost <span class=\"word\" data-word=\"contact\">contact </span>with his group, which <span class=\"word\" data-word=\"was made up of\">was made up of </span>twelve people. He followed the <span class=\"word\" data-word=\"narrow flat path\">narrow flat path </span>to the <span class=\"word\" data-word=\"source\">source </span>of a river. He <span class=\"word\" data-word=\"admired\">admired </span>the beautiful <span class=\"word\" data-word=\"view\">view </span>so much that he could not <span class=\"word\" data-word=\"take control of\">take control of </span>himself. He saw some <span class=\"word\" data-word=\"soldiers\">soldiers </span>over there <span class=\"word\" data-word=\"unearthing\">unearthing </span>a <span class=\"word\" data-word=\"tomb\">tomb</span>. <span class=\"word\" data-word=\"buried\">Buried </span>in it was an ancient <span class=\"word\" data-word=\"emperor\">emperor</span>, who once <span class=\"word\" data-word=\"ruled\">ruled</span> a <span class=\"word\" data-word=\"powerful empire\">powerful empire</span>. The traveler was <span class=\"word\" data-word=\"amazed\">amazed </span>at the <span class=\"word\" data-word=\"unique architecture\">unique architecture </span>designed by ancient <span class=\"word\" data-word=\"architects\">architects</span>. Not <span class=\"word\" data-word=\"recognizing\">recognizing </span>his way back, he <span class=\"word\" data-word=\"requested\">requested </span>a local <span class=\"word\" data-word=\"official\">official </span>to help find <span class=\"word\" data-word=\"accommodation\">accommodation</span>.</p><p>Once I went on a <span class=\"word\" data-word=\"package tour\">package tour</span>. The guide <span class=\"word\" data-word=\"explained\">explained</span> to us the <span class=\"word\" data-word=\"details\">details </span>of the tour. At his <span class=\"word\" data-word=\"request\">request</span>, we <span class=\"word\" data-word=\"checked in\">checked in </span>at a hotel and <span class=\"word\" data-word=\"checked out\">checked out </span>a week later. I paid by <span class=\"word\" data-word=\"credit card\">credit card</span>. We were <span class=\"word\" data-word=\"attracted\">attracted</span> to the <span class=\"word\" data-word=\"amazing view\">amazing view </span>in the mountains. There we saw some <span class=\"word\" data-word=\"soldiers unearthing\">soldiers unearthing </span>a <span class=\"word\" data-word=\"tomb\">tomb </span>next to a <span class=\"word\" data-word=\"statue\">statue</span>. We were all <span class=\"word\" data-word=\"amazed\">amazed </span>at the <span class=\"word\" data-word=\"sight\">sight</span>. The tour <span class=\"word\" data-word=\"guide\">guide</span> introduced to us the <span class=\"word\" data-word=\"local economic\">local economic </span>development, and at last he <span class=\"word\" data-word=\"commented\">commented </span>that <span class=\"word\" data-word=\"tourism\">tourism</span> had brought great <span class=\"word\" data-word=\"benefits\">benefits</span> to the <span class=\"word\" data-word=\"economy\">economy</span>.</p>"},{"title":"SPORTS AND FITNESS","html":"<p>As an <span class=\"word\" data-word=\"athlete\">athlete</span>, Richard <span class=\"word\" data-word=\"prefer\">prefer</span>s all kinds of sports, such as <span class=\"word\" data-word=\"soccer\">soccer</span>,  <span class=\"word\" data-word=\"boxing\">boxing</span>, <span class=\"word\" data-word=\"badminton\">badminton</span>, <span class=\"word\" data-word=\"skiing\">skiing</span>, and <span class=\"word\" data-word=\"track and field\">track and field </span>sports like <span class=\"word\" data-word=\"marathon\">marathon </span>and <span class=\"word\" data-word=\"jogging\">jogging</span>. However, he is particularly good at <span class=\"word\" data-word=\"gymnastics\">gymnastics</span>. He has won <span class=\"word\" data-word=\"championships\">championships </span>in sports <span class=\"word\" data-word=\"events hosted\">events hosted </span>by many countries and cities. He usually <span class=\"word\" data-word=\"comes along\">comes along </span>with his coach and <span class=\"word\" data-word=\"works out\">works out </span>for his <span class=\"word\" data-word=\"fitness\">fitness </span>in the <span class=\"word\" data-word=\"gym\">gym </span>or <span class=\"word\" data-word=\"stadium\">stadium</span>, <span class=\"word\" data-word=\"sweating\">sweating </span>a lot. He has <span class=\"word\" data-word=\"made it\">made it</span>.</p><p>The <span class=\"word\" data-word=\"athlete\">athlete </span>is a <span class=\"word\" data-word=\"legend\">legend </span>in the sports world. He has won not only <span class=\"word\" data-word=\"medals\">medals </span>for himself, but also <span class=\"word\" data-word=\"honour\">honour </span>and <span class=\"word\" data-word=\"glory\">glory </span>for his country. He never <span class=\"word\" data-word=\"gives up\">gives up </span>training <span class=\"word\" data-word=\"even if\">even if </span>he is <span class=\"word\" data-word=\"injured\">injured</span>. Meeting with <span class=\"word\" data-word=\"failure\">failure</span>,  he will face it <span class=\"word\" data-word=\"bravely\">bravely</span> <span class=\"word\" data-word=\"rather than lose heart\">rather than lose heart</span>. <span class=\"word\" data-word=\"now and then\">Now and then</span>, he feels as if he is about to <span class=\"word\" data-word=\"fall apart\">fall apart</span>, but he <span class=\"word\" data-word=\"holds on\">holds on</span> to the end. <span class=\"word\" data-word=\"once\">Once</span>, he took part in the <span class=\"word\" data-word=\"gymnastics championship\">gymnastics championship </span>to <span class=\"word\" data-word=\"compete\">compete </span>with the world’s <span class=\"word\" data-word=\"gymnastics masters\">gymnastics masters</span>. <span class=\"word\" data-word=\"in spite of\">In spite of </span>his leg <span class=\"word\" data-word=\"injuries\">injuries</span>, he had the <span class=\"word\" data-word=\"determination\">determination </span>to become the <span class=\"word\" data-word=\"champion\">champion</span>. Encouraged by his <span class=\"word\" data-word=\"captain\">captain</span>, he <span class=\"word\" data-word=\"gathered\">gathered</span> all his <span class=\"word\" data-word=\"strength\">strength </span>and finally <span class=\"word\" data-word=\"made it\">made it</span>. No <span class=\"word\" data-word=\"sweet\">sweet </span>without <span class=\"word\" data-word=\"sweat\">sweat</span>. He <span class=\"word\" data-word=\"sets a positive example\">sets a positive example </span>for all the <span class=\"word\" data-word=\"athletes\">athletes</span>.</p><p>As an <span class=\"word\" data-word=\"athlete\">athlete</span>, I’ve faced an <span class=\"word\" data-word=\"audience\">audience </span>of <span class=\"word\" data-word=\"millions\">millions </span>over the years. When <span class=\"word\" data-word=\"competing\">competing </span>with other players, <span class=\"word\" data-word=\"even if\">even if </span>I <span class=\"word\" data-word=\"fail\">fail</span>, I have a <span class=\"word\" data-word=\"positive attitude\">positive attitude </span>to face it <span class=\"word\" data-word=\"rather than lose heart\">rather than lose heart</span>. I have recently <span class=\"word\" data-word=\"gained\">gained </span>some <span class=\"word\" data-word=\"weight\">weight </span>and I feel under <span class=\"word\" data-word=\"stress\">stress</span>. So I go on a <span class=\"word\" data-word=\"diet\">diet </span>with <span class=\"word\" data-word=\"determination\">determination </span>and try to keep <span class=\"word\" data-word=\"slim\">slim </span>and <span class=\"word\" data-word=\"graceful\">graceful</span>. I know that doing exercise and <span class=\"word\" data-word=\"dieting\">dieting </span>will <span class=\"word\" data-word=\"make a difference\">make a difference </span>to one’s <span class=\"word\" data-word=\"fitness\">fitness</span>. I do <span class=\"word\" data-word=\"push-ups\">push-ups </span>every day, and never <span class=\"word\" data-word=\"cut\">cut </span>it <span class=\"word\" data-word=\"out\">out</span>. <span class=\"word\" data-word=\"now and then\">Now and then </span>I go <span class=\"word\" data-word=\"jogging\">jogging</span>. I think it <span class=\"word\" data-word=\"makes sense\">makes sense </span>to do so. My health has improved a lot <span class=\"word\" data-word=\"compared with\">compared with </span>the past. In <span class=\"word\" data-word=\"addition\">addition</span>, I have always been <span class=\"word\" data-word=\"against cheating\">against cheating </span>in sports, against <span class=\"word\" data-word=\"pretending to\">pretending to </span>fall, and I have tried to avoid <span class=\"word\" data-word=\"errors\">errors </span>in <span class=\"word\" data-word=\"matches\">matches</span>.</p>"},{"title":"NATURAL DISASTERS","html":"<p>Today, natural <span class=\"word\" data-word=\"disasters\">disasters</span>, such as <span class=\"word\" data-word=\"floods\">floods</span>, <span class=\"word\" data-word=\"droughts\">droughts</span>, <span class=\"word\" data-word=\"landslides\">landslides</span>,  <span class=\"word\" data-word=\"typhoons\">typhoons</span>, <span class=\"word\" data-word=\"hurricanes\">hurricanes</span>, <span class=\"word\" data-word=\"tornados\">tornados </span>and <span class=\"word\" data-word=\"tsunamis\">tsunamis</span>, often <span class=\"word\" data-word=\"strike\">strike </span>towns and villages, <span class=\"word\" data-word=\"causing\">causing </span>human <span class=\"word\" data-word=\"injuries\">injuries </span>and <span class=\"word\" data-word=\"deaths\">deaths </span>or great <span class=\"word\" data-word=\"damage\">damage </span>to people’s <span class=\"word\" data-word=\"property\">property</span>. The <span class=\"word\" data-word=\"relatively\">relatively </span>more dangerous of them is the <span class=\"word\" data-word=\"volcanic eruption\">volcanic eruption</span>. Its great <span class=\"word\" data-word=\"power\">power </span>can <span class=\"word\" data-word=\"damage\">damage </span>farms, <span class=\"word\" data-word=\"destroy\">destroy </span>houses, <span class=\"word\" data-word=\"affecting\">affecting </span>people’s life greatly. Once, an <span class=\"word\" data-word=\"earthquake\">earthquake </span>of great <span class=\"word\" data-word=\"magnitude occurred\">magnitude occurred</span>. The government <span class=\"word\" data-word=\"immediately\">immediately </span>organised <span class=\"word\" data-word=\"rescue\">rescue </span>teams to <span class=\"word\" data-word=\"evacuate\">evacuate </span>people, taking them to <span class=\"word\" data-word=\"shelters\">shelters</span>. The <span class=\"word\" data-word=\"helicopters delivered\">helicopters delivered </span>all kinds of <span class=\"word\" data-word=\"supplies\">supplies </span>to them.</p><p>A big earthquake <span class=\"word\" data-word=\"struck\">struck </span>the city and everyone was <span class=\"word\" data-word=\"shocked\">shocked</span>. Ninety <span class=\"word\" data-word=\"percent\">percent </span>of the buildings <span class=\"word\" data-word=\"lay in ruins\">lay in ruins</span>, <span class=\"word\" data-word=\"metal pipes\">metal pipes </span>and water <span class=\"word\" data-word=\"taps cracked\">taps cracked</span>, and <span class=\"word\" data-word=\"bricks\">bricks </span>covered the ground. Many people were <span class=\"word\" data-word=\"trapped\">trapped </span>or <span class=\"word\" data-word=\"buried\">buried </span>in <span class=\"word\" data-word=\"ruins\">ruins </span>and <span class=\"word\" data-word=\"suffered\">suffered </span>a great deal. They were <span class=\"word\" data-word=\"in shock\">in shock</span>. There was neither <span class=\"word\" data-word=\"electricity\">electricity </span>nor water. It seemed <span class=\"word\" data-word=\"as if\">as if </span>the world were at an end. The government immediately organised <span class=\"word\" data-word=\"rescue\">rescue </span>teams to help the <span class=\"word\" data-word=\"trapped\">trapped </span>and <span class=\"word\" data-word=\"bury\">bury </span>the dead. The PLA also came to their <span class=\"word\" data-word=\"rescue\">rescue</span>. Thanks to their <span class=\"word\" data-word=\"unified efforts\">unified efforts </span>and <span class=\"word\" data-word=\"wisdom\">wisdom</span>, the city began to <span class=\"word\" data-word=\"breathe\">breathe </span>and <span class=\"word\" data-word=\"revive\">revive</span>.</p><p>Active <span class=\"word\" data-word=\"volcanoes\">volcanoes </span>can <span class=\"word\" data-word=\"erupt\">erupt </span>at any time. <span class=\"word\" data-word=\"typhoons\">Typhoons </span>and <span class=\"word\" data-word=\"hurricanes strike coastal\">hurricanes strike coastal </span>areas now and then, <span class=\"word\" data-word=\"destroying\">destroying </span>farmlands and <span class=\"word\" data-word=\"cutting off power supplies\">cutting off power supplies</span>. The great <span class=\"word\" data-word=\"waves\">waves </span>of a <span class=\"word\" data-word=\"tsunami crash\">tsunami crash </span>against the beach and <span class=\"word\" data-word=\"sweep away\">sweep away </span>crops. <span class=\"word\" data-word=\"metal pipes\">Metal pipes </span>and water <span class=\"word\" data-word=\"taps\">taps </span>are <span class=\"word\" data-word=\"cracked.\">cracked. </span>At this time, people should not stay <span class=\"word\" data-word=\"in the open air\">in the open air</span>. It is better to have a <span class=\"word\" data-word=\"first aid kit on hand\">first aid kit on hand</span>. <span class=\"word\" data-word=\"relief supplies\">Relief supplies </span>will be <span class=\"word\" data-word=\"delivered\">delivered </span>to those who <span class=\"word\" data-word=\"survive\">survive</span>. In <span class=\"word\" data-word=\"summary\">summary</span>, people should remain <span class=\"word\" data-word=\"calm\">calm </span>in an <span class=\"word\" data-word=\"emergency\">emergency</span>. Experts say the <span class=\"word\" data-word=\"damage effect\">damage effect </span>of a <span class=\"word\" data-word=\"disaster\">disaster </span>depends on its <span class=\"word\" data-word=\"length\">length</span>.</p>"},{"title":"LANGUAGES AROUND THE WORLD","html":"<p>How many <span class=\"word\" data-word=\"billion\">billion </span>people speak the UN’s official languages as their <span class=\"word\" data-word=\"native\">native </span>or second language? What’s your <span class=\"word\" data-word=\"attitude\">attitude </span>towards this? What I <span class=\"word\" data-word=\"refer to\">refer to </span>is that you should <span class=\"word\" data-word=\"provide\">provide </span>more information for <span class=\"word\" data-word=\"reference\">reference</span>.</p><p>This <span class=\"word\" data-word=\"semester\">semester</span>, my <span class=\"word\" data-word=\"major course\">major course </span>is to study the development of language and the change of its <span class=\"word\" data-word=\"vocabulary\">vocabulary</span>. As we know, language is a <span class=\"word\" data-word=\"means\">means </span>of communication and <span class=\"word\" data-word=\"plays an important role in\">plays an important role in</span> <span class=\"word\" data-word=\"global affairs\">global affairs</span>. <span class=\"word\" data-word=\"no matter what\">No matter what </span>their social <span class=\"word\" data-word=\"system\">system </span>is, language is <span class=\"word\" data-word=\"regarded\">regarded </span>as a <span class=\"word\" data-word=\"symbol\">symbol </span>of the <span class=\"word\" data-word=\"ups and downs\">ups and downs </span>of a nation. Some languages like Chinese <span class=\"word\" data-word=\"date back to\">date back to </span>the earliest <span class=\"word\" data-word=\"dynasties\">dynasties</span>, with <span class=\"word\" data-word=\"symbols\">symbols </span>and <span class=\"word\" data-word=\"characters carved\">characters carved </span>on <span class=\"word\" data-word=\"bones\">bones </span>and <span class=\"word\" data-word=\"shells\">shells</span>. The change of language is <span class=\"word\" data-word=\"based\">based </span>on a <span class=\"word\" data-word=\"variety\">variety </span>of <span class=\"word\" data-word=\"factors\">factors</span>. <span class=\"word\" data-word=\"despite\">Despite </span>all this, the social <span class=\"word\" data-word=\"system\">system </span>and civilization are the <span class=\"word\" data-word=\"major factors\">major factors</span>. In addition, I <span class=\"word\" data-word=\"appreciate\">appreciate </span>Chinese <span class=\"word\" data-word=\"calligraphy\">calligraphy </span>and Chinese <span class=\"word\" data-word=\"classics\">classics </span>very much, which are also my <span class=\"word\" data-word=\"specific\">specific </span>research <span class=\"word\" data-word=\"programs\">programs</span>.</p><p>Tom is a <span class=\"word\" data-word=\"native\">native </span>of England and English is his <span class=\"word\" data-word=\"native\">native </span>language. But he often speaks the <span class=\"word\" data-word=\"local dialect\">local dialect</span>. He knows there are some differences in <span class=\"word\" data-word=\"vocabulary\">vocabulary </span>between BrE and AmE. For example, the American English words “<span class=\"word\" data-word=\"subway\">subway</span>” “<span class=\"word\" data-word=\"gas\">gas</span>” “<span class=\"word\" data-word=\"pants\">pants</span>” and “<span class=\"word\" data-word=\"apartment\">apartment</span>” are “<span class=\"word\" data-word=\"underground\">underground</span>” “<span class=\"word\" data-word=\"petrol\">petrol</span>” “trousers” and “flat” in British English. Each nation has its own <span class=\"word\" data-word=\"tongue\">tongue</span>. But in my <span class=\"word\" data-word=\"point of view\">point of view</span>, the change of language <span class=\"word\" data-word=\"relates to\">relates to </span>the different social <span class=\"word\" data-word=\"systems\">systems</span>. Nowadays, people <span class=\"word\" data-word=\"demand\">demand </span>peace, <span class=\"word\" data-word=\"struggle\">struggle </span>for <span class=\"word\" data-word=\"equal rights\">equal rights </span>and try to <span class=\"word\" data-word=\"bridge\">bridge </span>the <span class=\"word\" data-word=\"gap\">gap </span>between languages. I have a lot more to say about language, but some <span class=\"word\" data-word=\"affairs\">affairs </span>are <span class=\"word\" data-word=\"beyond description\">beyond description</span>.</p>"},{"title":"B2 Unit 1 Cultural Heritage","html":"<p>In order to <span class=\"word\" data-word=\"promote\">promote</span> tourism in this area and <span class=\"word\" data-word=\"keep balance\">keep balance</span> between development and protection, the Cultural <span class=\"word\" data-word=\"heritage\">Heritage</span> Protection <span class=\"word\" data-word=\"committee\">Committee</span> has <span class=\"word\" data-word=\"established\">established</span>a special <span class=\"word\" data-word=\"department\">department</span>. The department aims to <span class=\"word\" data-word=\"investigate\">investigate</span>the condition of local cultural <span class=\"word\" data-word=\"relics\">relics</span>, <span class=\"word\" data-word=\"make proposals\">make proposals</span>to the committee and <span class=\"word\" data-word=\"conduct\">conduct</span>protection activities, <span class=\"word\" data-word=\"making sure\">making sure</span> that all the cultural relics are well <span class=\"word\" data-word=\"preserved\">preserved</span>. They <span class=\"word\" data-word=\"attempt\">attempt</span>to raise <span class=\"word\" data-word=\"funds\">funds</span>, call for <span class=\"word\" data-word=\"contributions\">contributions</span> to the protection of cultural heritage. With major <span class=\"word\" data-word=\"issues\">issues</span>, they are <span class=\"word\" data-word=\"likely\">likely</span>to <span class=\"word\" data-word=\"turn to\">turn to</span>local governments for help. To <span class=\"word\" data-word=\"prevent\">prevent</span>the <span class=\"word\" data-word=\"loss\">loss</span>of cultural relics, everyone of us should <span class=\"word\" data-word=\"take part in\">take part in</span>the preservation activity. For example, there is a <span class=\"word\" data-word=\"temple\">temple</span> on the <span class=\"word\" data-word=\"mount\">mount</span>, which shows the <span class=\"word\" data-word=\"creative\">creative</span>design of ancient people. We must <span class=\"word\" data-word=\"prevent\">prevent</span>it <span class=\"word\" data-word=\"from disappearing\">from disappearing</span>. If possible, we can <span class=\"word\" data-word=\"donate\">donate</span>money <span class=\"word\" data-word=\"to\">to</span> the committee. Where there are cultural relics, construction must be <span class=\"word\" data-word=\"limited\">limited</span>and <span class=\"word\" data-word=\"give way to\">give way to</span>them. We make a <span class=\"word\" data-word=\"protest\">protest</span>against any <span class=\"word\" data-word=\"conduct\">conduct</span>of destroying cultural relics and can’t <span class=\"word\" data-word=\"forgive\">forgive</span>it. It is <span class=\"word\" data-word=\"worthwhile\">worthwhile</span>for us to do so. It is believed that great changes will take place <span class=\"word\" data-word=\"within\">within</span>a few years.</p><p>My friend is a <span class=\"word\" data-word=\"professional archaeologist\">professional archaeologist</span>. He often <span class=\"word\" data-word=\"downloads\">downloads</span> some <span class=\"word\" data-word=\"applications\">applications</span>and <span class=\"word\" data-word=\"documents\">documents</span>about cultural relics from websites. He was sent <span class=\"word\" data-word=\"overseas\">overseas</span>to work a few years ago. He studied the <span class=\"word\" data-word=\"pyramids\">pyramids</span>in the Arab <span class=\"word\" data-word=\"republic\">Republic</span>of <span class=\"word\" data-word=\"egypt\">Egypt</span> using <span class=\"word\" data-word=\"digital\">digital</span>technology, he looked closely at the <span class=\"word\" data-word=\"entrance\">entrance</span>, <span class=\"word\" data-word=\"exit\">exit</span>and<span class=\"word\" data-word=\"roof\">roof</span>of the Great Pyramid and finally formed an <span class=\"word\" data-word=\"image\">image</span> of the construction <span class=\"word\" data-word=\"process\">process</span>. Later, he visited some famous <span class=\"word\" data-word=\"historic\">historic</span>sites <span class=\"word\" data-word=\"all over the world\">all over the world</span> and <span class=\"word\" data-word=\"further\">further</span> studied the local traditions and customs there. Then he went to a famous mountain to research ancient <span class=\"word\" data-word=\"caves\">caves</span>. There are many <span class=\"word\" data-word=\"dragons\">dragons</span>carved on the cave walls. These sculptures are of good <span class=\"word\" data-word=\"quality\">quality</span> and remain there <span class=\"word\" data-word=\"forever\">forever</span><span class=\"word\" data-word=\"throughout\">throughout</span>the human history. According to various <span class=\"word\" data-word=\"clues\">clues</span> and after making <span class=\"word\" data-word=\"comparisons\">comparisons</span> and <span class=\"word\" data-word=\"contrasts\">contrasts</span>, he <span class=\"word\" data-word=\"identified\">identified</span>that these caves could date back to the Tang Dynasty. In his <span class=\"word\" data-word=\"opinion\">opinion</span>, cultural relics must be well <span class=\"word\" data-word=\"preserved\">preserved</span>. He often <span class=\"word\" data-word=\"quotes\">quotes</span> this famous saying that history is like a <span class=\"word\" data-word=\"mirror\">mirror</span>.</p>"},{"title":"B2 Unit 2 Wildlife Protection","html":"<p>In recent years, <span class=\"word\" data-word=\"creatures\">creatures</span>such as <span class=\"word\" data-word=\"whales\">whales</span>, <span class=\"word\" data-word=\"sharks\">sharks</span>, <span class=\"word\" data-word=\"dolphins\">dolphins</span>, <span class=\"word\" data-word=\"deer\">deer</span>, <span class=\"word\" data-word=\"kangaroos\">kangaroos</span>and <span class=\"word\" data-word=\"tibetan antelopes\">Tibetan antelopes</span>have faced a <span class=\"word\" data-word=\"threat\">threat</span>and it’s difficult for them to <span class=\"word\" data-word=\"exist\">exist</span>. Now their numbers are <span class=\"word\" data-word=\"reducing due to\">reducing due to</span>too much <span class=\"word\" data-word=\"hunting\">hunting</span>. As a result, they have to <span class=\"word\" data-word=\"search\">search</span><span class=\"word\" data-word=\"for\">for</span> new <span class=\"word\" data-word=\"habitats\">habitats</span> and try to <span class=\"word\" data-word=\"adapt\">adapt</span><span class=\"word\" data-word=\"to\">to</span> new environments. This problem has <span class=\"word\" data-word=\"concerned\">concerned</span>people very much, and <span class=\"word\" data-word=\"stirred\">stirred</span><span class=\"word\" data-word=\"up\">up</span><span class=\"word\" data-word=\"emotions\">emotions</span> of <span class=\"word\" data-word=\"alarm\">alarm</span>. At present, many volunteers join in the protection of wild animals. In the <span class=\"word\" data-word=\"habitats\">habitats</span> they <span class=\"word\" data-word=\"observe\">observe</span>the daily activities of wild animals and <span class=\"word\" data-word=\"watch\">watch</span> them <span class=\"word\" data-word=\"over\">over</span><span class=\"word\" data-word=\"day\">day</span><span class=\"word\" data-word=\"and\">and</span><span class=\"word\" data-word=\"night\">night</span>. They <span class=\"word\" data-word=\"remove\">remove</span>traps and <span class=\"word\" data-word=\"nets\">nets</span>placed by <span class=\"word\" data-word=\"hunters\">hunters</span>to protect animals and <span class=\"word\" data-word=\"insects\">insects</span> like butter flies from <span class=\"word\" data-word=\"attack\">attack</span>. In addition, these volunteers help to <span class=\"word\" data-word=\"recover\">recover</span>the lost animals. They <span class=\"word\" data-word=\"remind\">remind</span>people in the <span class=\"word\" data-word=\"neighbourhood\">neighbourhood</span>of the importance of <span class=\"word\" data-word=\"harmony\">harmony</span> between man and nature.</p><p>There is a <span class=\"word\" data-word=\"poster\">poster</span>in the nature <span class=\"word\" data-word=\"reserve\">reserve</span>that says: “The <span class=\"word\" data-word=\"authorities\">authorities</span> demand that all <span class=\"word\" data-word=\"illegal hunting\">illegal hunting</span>should be stopped <span class=\"word\" data-word=\"immediately\">immediately</span> to protect the <span class=\"word\" data-word=\"species\">species</span>that are <span class=\"word\" data-word=\"endangered\">endangered</span>.” Recently, some <span class=\"word\" data-word=\"hunters\">hunters</span>have been <span class=\"word\" data-word=\"illegally hunting\">illegally hunting</span>wild animals, leadingto a <span class=\"word\" data-word=\"mass\">mass</span><span class=\"word\" data-word=\"extinction\">extinction</span>of them, and their <span class=\"word\" data-word=\"habitats\">habitats</span> have been <span class=\"word\" data-word=\"threatened\">threatened</span>, too. According to WWF, an <span class=\"word\" data-word=\"average\">average</span>of 75 <span class=\"word\" data-word=\"species\">species</span>become <span class=\"word\" data-word=\"extinct\">extinct</span>every day in the world. Some wild animals are dying out at a very fast <span class=\"word\" data-word=\"rate\">rate</span>. This is an <span class=\"word\" data-word=\"alarming\">alarming</span>number. Many people are aware of the problem and are <span class=\"word\" data-word=\"concerned\">concerned</span> about the endangered wildlife. Some countries have taken <span class=\"word\" data-word=\"effective measures\">effective measures</span> to protect these <span class=\"word\" data-word=\"creatures\">creatures</span>. Why <span class=\"word\" data-word=\"on earth\">on earth</span> do the <span class=\"word\" data-word=\"hunters\">hunters</span>shoot these animals? Some <span class=\"word\" data-word=\"intend\">intend</span> to sell them as goods to make a <span class=\"word\" data-word=\"profit\">profit</span>, others to make a <span class=\"word\" data-word=\"living\">living</span>. For example, <span class=\"word\" data-word=\"antelopes\">antelopes</span> are <span class=\"word\" data-word=\"hunted\">hunted</span> for their <span class=\"word\" data-word=\"skin\">skin</span> and <span class=\"word\" data-word=\"fur\">fur</span>. But, to our delight, we have <span class=\"word\" data-word=\"made\">made</span> great <span class=\"word\" data-word=\"progress\">progress</span> in wildlife protection.</p>"},{"title":"B2 Unit 3 The Internet","html":"<p>Tom is a well-known <span class=\"word\" data-word=\"blogger\">blogger</span>who often writes <span class=\"word\" data-word=\"blog posts\">blog posts</span>on his <span class=\"word\" data-word=\"blog\">blog</span>. He likes to use <span class=\"word\" data-word=\"search engines\">search engines</span>to find information he needs. He also likes to watch movies <span class=\"word\" data-word=\"streaming\">streaming</span>online. When <span class=\"word\" data-word=\"chatting\">chatting</span>with others, he uses different <span class=\"word\" data-word=\"identities\">identities</span>and avatars. He has <span class=\"word\" data-word=\"access\">access</span>to free <span class=\"word\" data-word=\"wi\">Wi</span><span class=\"word\" data-word=\"f\">F</span><span class=\"word\" data-word=\"i\">i</span>, which is very <span class=\"word\" data-word=\"convenient\">convenient</span>for him to download<span class=\"word\" data-word=\"software\"> software </span>fromthe <span class=\"word\" data-word=\"network\">network</span>. His <span class=\"word\" data-word=\"database\">database</span>and <span class=\"word\" data-word=\"file\">file</span>are <span class=\"word\" data-word=\"updated\">updated</span>once a week. <span class=\"word\" data-word=\"surfing\">Surfing</span>the Internet has indeed brought him great <span class=\"word\" data-word=\"benefits\">benefits</span>. It seems that the computer <span class=\"word\" data-word=\"keeps\">keeps</span>him <span class=\"word\" data-word=\"company\">company</span>all day. Once he went to a <span class=\"word\" data-word=\"conference\">conference</span> held in his <span class=\"word\" data-word=\"province\">province</span> and he didn’t bring any <span class=\"word\" data-word=\"cash\">cash</span>with him <span class=\"word\" data-word=\"plus\">plus</span>he lost his <span class=\"word\" data-word=\"identity card\">identity card</span>, so he paid online.</p><p>This is a new type of tracker with many <span class=\"word\" data-word=\"functions\">functions</span>. Put in the <span class=\"word\" data-word=\"battery\">battery</span>, <span class=\"word\" data-word=\"press\">press</span>the <span class=\"word\" data-word=\"button\">button</span> and you can <span class=\"word\" data-word=\"keep track of\">keep track of</span>the person in the <span class=\"word\" data-word=\"distance\">distance</span>. By using it, you can <span class=\"word\" data-word=\"confirm\">confirm</span>where someone is. This is our <span class=\"word\" data-word=\"account\">account</span>. We can give you a <span class=\"word\" data-word=\"discount\">discount</span>if you <span class=\"word\" data-word=\"click\">click</span>on our website and buy online. <span class=\"word\" data-word=\"inspired\">Inspired</span>by real life, an <span class=\"word\" data-word=\"author\">author</span>wrote a book “<span class=\"word\" data-word=\"guidelines\">Guidelines</span>and <span class=\"word\" data-word=\"tips\">Tips</span>for Residents’ Lives”. He had once met with an <span class=\"word\" data-word=\"embarrassing case\">embarrassing case</span>which made him very <span class=\"word\" data-word=\"upset\">upset</span> and <span class=\"word\" data-word=\"go\">go</span> <span class=\"word\" data-word=\"through\">through</span>a <span class=\"word\" data-word=\"tough\">tough</span>time. Because he was not <span class=\"word\" data-word=\"familiar\">familiar</span>with online shopping, he bought a fake. The tracker was useless and even <span class=\"word\" data-word=\"made fun of\">made fun of</span>him. Another time someone put a <span class=\"word\" data-word=\"particular\">particular</span>tracker under his car, and he became the <span class=\"word\" data-word=\"target\">target</span>of <span class=\"word\" data-word=\"theft\">theft</span>. Now, the author <span class=\"word\" data-word=\"keeps\">keeps</span> it <span class=\"word\" data-word=\"in\">in</span> <span class=\"word\" data-word=\"mind\">mind</span><span class=\"word\" data-word=\"now that\">now that</span> he has gone through so many things.</p>"},{"title":"B2 Unit 4 History And Traditions","html":"<p>Qufu in Shandong Province is the hometown of <span class=\"word\" data-word=\"confucius\">Confucius</span>, founder of the Confucian school of <span class=\"word\" data-word=\"philosophy\">philosophy</span>. There are many cultural sites, among which the most famous are the Kong family <span class=\"word\" data-word=\"mansion\">Mansion</span>, the Temple of Confucius and the <span class=\"word\" data-word=\"cemetery\">Cemetery</span> of Confucius.</p><p>Confucius<span class=\"word\" data-word=\"belonged to\"> belonged to</span> the State of Lu in the Spring and Autumn period. By the time of the Warring States period, there were seven chief<span class=\"word\" data-word=\"kingdoms\"> kingdoms</span> left. Sometimes, they <span class=\"word\" data-word=\"were joined to\">were joined to</span> each other because the power of an individual kingdom was too small, and sometimes they <span class=\"word\" data-word=\"broke away from\">broke away from</span> each other. During this period, the kingdoms went through a number of <span class=\"word\" data-word=\"battles\">battles</span>, including <span class=\"word\" data-word=\"military\">military</span> of attack <span class=\"word\" data-word=\"as well as military defence\">as well as military defence</span>. Finally the State of Qin <span class=\"word\" data-word=\"conquered\">conquered</span> the other six kingdoms and united China. After that, the Qin Dynasty established a new<span class=\"word\" data-word=\"legal\"> legal</span> system and a unified <span class=\"word\" data-word=\"currency\">currency</span>. <span class=\"word\" data-word=\"evidence\">Evidence</span> shows that the Qin Dynasty made great <span class=\"word\" data-word=\"achievements\">achievements </span>in many aspects. Why the Qin Dynasty was strong is no longer a<span class=\"word\" data-word=\"puzzle\"> puzzle</span>.</p><p>An exhibition of paintings will be held in a<span class=\"word\" data-word=\"county\"> county</span> in <span class=\"word\" data-word=\"wales\">Wales</span>. The man in <span class=\"word\" data-word=\"charge\">charge</span> of the <span class=\"word\" data-word=\"gallery\">gallery</span> <span class=\"word\" data-word=\"announces\">announces</span> there will be<span class=\"word\" data-word=\"generous landscape\"> generous landscape</span> paintings on show, and that only a small <span class=\"word\" data-word=\"amount\">amount</span> of money will be <span class=\"word\" data-word=\"charged\">charged</span> for the exhibition to <span class=\"word\" data-word=\"ensure\">ensure</span> its success. A painting about the <span class=\"word\" data-word=\"customs\">customs</span> of the countryside will be displayed. In the painting, there is a <span class=\"word\" data-word=\"pub\">pub</span> in the <span class=\"word\" data-word=\"courtyard\">courtyard</span> of a farmhouse. It offers a variety of drinks and <span class=\"word\" data-word=\"snacks\">snacks</span>, such as <span class=\"word\" data-word=\"wine\">wine</span>, <span class=\"word\" data-word=\"beer\">beer</span> and hamburgers with <span class=\"word\" data-word=\"butter\">butter</span> and <span class=\"word\" data-word=\"honey\">honey</span>. A waiter is <span class=\"word\" data-word=\"greeting\">greeting</span> guests with a smile. A<span class=\"word\" data-word=\"poet\"> poet</span> is <span class=\"word\" data-word=\"surrounded\">surrounded</span> by a <span class=\"word\" data-word=\"crowd\">crowd</span>,<span class=\"word\" data-word=\"eager\"> eager</span> to listen to his speech. A herd of <span class=\"word\" data-word=\"cattle\">cattle</span> are grazing <span class=\"word\" data-word=\"nearby\">nearby</span>. It’s a <span class=\"word\" data-word=\"fascinating\">fascinating</span> scene, isn’t it? The best <span class=\"word\" data-word=\"approach\">approach</span> to visiting is to <span class=\"word\" data-word=\"keep your eyes open\">keep your eyes open </span>and see the painting from different <span class=\"word\" data-word=\"positions\">positions </span>without missing any details.</p>"},{"title":"B2 Unit 5 Music","html":"<p>My friend, a famous <span class=\"word\" data-word=\"piano\">piano</span> player has shown her musical <span class=\"word\" data-word=\"talent\">talent</span> since childhood. She is <span class=\"word\" data-word=\"capable\">capable</span>of playing <span class=\"word\" data-word=\"various\">various</span>songs on the <span class=\"word\" data-word=\"piano\">piano</span>. Her <span class=\"word\" data-word=\"aim\">aim</span>is to release her own <span class=\"word\" data-word=\"album\">album</span>. <span class=\"word\" data-word=\"moreover\">Moreover</span>, she even wants to <span class=\"word\" data-word=\"perform\">perform</span>on the international music <span class=\"word\" data-word=\"stage\">stage</span>. She <span class=\"word\" data-word=\"set\">set</span><span class=\"word\" data-word=\"up\">up</span> some music <span class=\"word\" data-word=\"equipment\">equipment</span>for herself, and <span class=\"word\" data-word=\"tried out\">tried out </span>forthe music competition of the whole province. She experienced a <span class=\"word\" data-word=\"romantic\">romantic</span> life. <span class=\"word\" data-word=\"in addition\">In addition</span>, she was once <span class=\"word\" data-word=\"unemployed\">unemployed</span>, which had a great <span class=\"word\" data-word=\"impact\">impact</span>on her <span class=\"word\" data-word=\"previous\">previous</span> life. She was so<span class=\"word\" data-word=\"absorbed in\"> absorbed in</span> music that <span class=\"word\" data-word=\"somehow\">somehow</span>she had a serious <span class=\"word\" data-word=\"disease\">disease</span> last year, and <span class=\"word\" data-word=\"from then on\">from then on</span>her head often <span class=\"word\" data-word=\"ached\">ached</span>. <span class=\"word\" data-word=\"thus\">Thus</span>she had to get <span class=\"word\" data-word=\"treatment\">treatment</span>in the hospital. The treatment provided <span class=\"word\" data-word=\"relief\">relief</span> from the <span class=\"word\" data-word=\"ache\">ache</span>, but couldn’t <span class=\"word\" data-word=\"cure\">cure</span>the <span class=\"word\" data-word=\"disease\">disease</span>for the time being. I sincerely hope she will <span class=\"word\" data-word=\"get\">get</span><span class=\"word\" data-word=\"through\">through</span>this difficult time.</p><p>I <span class=\"word\" data-word=\"fall in love with classical\">fall in love with classical </span>musicbecause it is good for the <span class=\"word\" data-word=\"soul\">soul</span> and <span class=\"word\" data-word=\"enables\">enables</span> me to be full of <span class=\"word\" data-word=\"energy\">energy</span>. I’ve always wanted to set upa <span class=\"word\" data-word=\"studio\">studio</span>or a music <span class=\"word\" data-word=\"band\">band</span>, or a <span class=\"word\" data-word=\"virtual\">virtual</span><span class=\"word\" data-word=\"choir\">choir</span> to prove my musical <span class=\"word\" data-word=\"talent\">talent</span>. Once, the <span class=\"word\" data-word=\"opportunity\">opportunity</span>finally came. My <span class=\"word\" data-word=\"band\">band</span> played my <span class=\"word\" data-word=\"original\">original</span><span class=\"word\" data-word=\"composition\">composition</span> on the <span class=\"word\" data-word=\"stage\">stage</span>. The <span class=\"word\" data-word=\"performers\">performers</span><span class=\"word\" data-word=\"performed\">performed</span> very well and their <span class=\"word\" data-word=\"performance\">performance</span>was a great success. <span class=\"word\" data-word=\"thus\">Thus</span>, we were <span class=\"word\" data-word=\"awarded\">awarded</span>. As a <span class=\"word\" data-word=\"composer\">composer</span>and <span class=\"word\" data-word=\"conductor\">conductor</span>, I felt very proud when I jumped <span class=\"word\" data-word=\"onto\">onto</span> the <span class=\"word\" data-word=\"stage\">stage</span> to receive the <span class=\"word\" data-word=\"award\">award</span>. <span class=\"word\" data-word=\"nowadays\">Nowadays</span>, my <span class=\"word\" data-word=\"ordinary\">ordinary</span>life has changed <span class=\"word\" data-word=\"altogether\">altogether</span>. But I don’t think this is a good <span class=\"word\" data-word=\"phenomenon\">phenomenon</span>.</p>"},{"title":"Festivals and Celebrations","html":"<p>On the<span class=\"word\" data-word=\"lantern festival\">Lantern Festival</span>, <span class=\"word\" data-word=\"joyful\">joyful</span> people wear <span class=\"word\" data-word=\"make-up\">make-up</span> and <span class=\"word\" data-word=\"dress up\">dress up</span> in colorful <span class=\"word\" data-word=\"carnival\">carnival</span> <span class=\"word\" data-word=\"costumes\">costumes</span>, arching along the streets. Some <span class=\"word\" data-word=\"attend\">attend </span>the <span class=\"word\" data-word=\"ceremony\">ceremony</span>, and others visit a <span class=\"word\" data-word=\"lantern fair\">lantern fair </span>or guess<span class=\"word\" data-word=\"lantern\"> lantern</span> <span class=\"word\" data-word=\"riddles\">riddles</span>. People greet and <span class=\"word\" data-word=\"congratulate\">congratulate</span> each other. <span class=\"word\" data-word=\"congratulations\">Congratulations</span> can be heard everywhere. <span class=\"word\" data-word=\"after all\">After all</span>, festivals have a wide <span class=\"word\" data-word=\"range\">range </span>of <span class=\"word\" data-word=\"origins\">origins</span>. Some come from <span class=\"word\" data-word=\"religions\">religions</span>. <span class=\"word\" data-word=\"in other words\">In other words</span>, their <span class=\"word\" data-word=\"origins\">origins</span> are <span class=\"word\" data-word=\"religious\">religious</span>. Some festivals are for famous <span class=\"word\" data-word=\"figures\">figures</span> and <span class=\"word\" data-word=\"significant\">significant</span> events. The <span class=\"word\" data-word=\"harvest\">harvest </span>festival is an important <span class=\"word\" data-word=\"agricultural\">agricultural</span> festival which full of <span class=\"word\" data-word=\"joy\">joy</span> and <span class=\"word\" data-word=\"charm\">charm</span>. People are <span class=\"word\" data-word=\"grateful\">grateful</span> or <span class=\"word\" data-word=\"express\">express </span>their <span class=\"word\" data-word=\"gratitude\">gratitude</span> because all the <span class=\"word\" data-word=\"crops\">crops </span>have been <span class=\"word\" data-word=\"gathered\">gathered</span>. In European countries, people <span class=\"word\" data-word=\"decorate churches\">decorate churches</span> and town <span class=\"word\" data-word=\"halls\">halls </span>with flowers and fruit. Today, festivals are becoming <span class=\"word\" data-word=\"commercial\">commercial</span>, with businesses <span class=\"word\" data-word=\"taking advantage of\">taking advantage of</span> the <span class=\"word\" data-word=\"celebrations\">celebrations</span>. With the <span class=\"word\" data-word=\"commercialization\">commercialization</span>, some <span class=\"word\" data-word=\"traditions\">traditions </span>may <span class=\"word\" data-word=\"fade away\">fade away</span>. <span class=\"word\" data-word=\"in spite of\">In spite of</span> the fact that festivals are <span class=\"word\" data-word=\"commercialized\">commercialized</span>, some <span class=\"word\" data-word=\"typical\">typical</span> festivals still keep their traditions. Christmas is the biggest <span class=\"word\" data-word=\"occasion\">occasion</span> in the West. People greet each other with “<span class=\"word\" data-word=\"merry christmas\">Merry Christmas</span>”. On Christmas <span class=\"word\" data-word=\"eve\">Eve</span>, people are<span class=\"word\" data-word=\"pleased\">pleased </span>to enjoy the <span class=\"word\" data-word=\"roast turkeys\">roast turkeys</span>, <span class=\"word\" data-word=\"puddings\">puddings</span>, <span class=\"word\" data-word=\"mashed potatoes\">mashed potatoes</span> and <span class=\"word\" data-word=\"pumpkins\">pumpkins</span>.</p><p>Last week I attended a <span class=\"word\" data-word=\"wedding ceremony\">wedding ceremony</span>. The new <span class=\"word\" data-word=\"couple\">couple </span>are from <span class=\"word\" data-word=\"inner mongolia autonomous region\">Inner Mongolia Autonomous Region</span>. The <span class=\"word\" data-word=\"bridegroom\">bridegroom </span>is a <span class=\"word\" data-word=\"wrestler\">wrestler</span> who has taken part in the national <span class=\"word\" data-word=\"wrestling\">wrestling </span>competition, and the <span class=\"word\" data-word=\"bride\">bride </span>is the <span class=\"word\" data-word=\"archery\">archery</span> <span class=\"word\" data-word=\"champion\">champion</span>. Both of them have <span class=\"word\" data-word=\"represented\">represented</span> the <span class=\"word\" data-word=\"autonomous region\">autonomous region</span> in national competitions. They love each other, <span class=\"word\" data-word=\"respect\">respect</span> each other and have <span class=\"word\" data-word=\"faith\">faith </span>or <span class=\"word\" data-word=\"belief\">belief </span>in each other. They <span class=\"word\" data-word=\"have\">have </span>a lot <span class=\"word\" data-word=\"in common\">in common</span>. <span class=\"word\" data-word=\"to be frank\">To be frank</span>, they are <span class=\"word\" data-word=\"absolutely\">absolutely</span> well matched. The <span class=\"word\" data-word=\"wedding\">wedding </span>was held in a <span class=\"word\" data-word=\"tent\">tent </span>on the grassland, <span class=\"word\" data-word=\"reflecting\">reflecting</span> a warm <span class=\"word\" data-word=\"atmosphere\">atmosphere</span>. The bride showed <span class=\"word\" data-word=\"unique grace\">unique grace</span> in her <span class=\"word\" data-word=\"fancy robe\">fancy robe</span>. After the host <span class=\"word\" data-word=\"delivered\">delivered </span>a <span class=\"word\" data-word=\"brief\">brief</span>speech, all the guests <span class=\"word\" data-word=\"clapped\">clapped </span>their hands. Just at that <span class=\"word\" data-word=\"moment\">moment</span>, an <span class=\"word\" data-word=\"eagle\">eagle</span> flew through the air, giving people a <span class=\"word\" data-word=\"horrible\">horrible </span>feeling. <span class=\"word\" data-word=\"except for\">Except for</span> this, everything went well. After the <span class=\"word\" data-word=\"wedding\">wedding</span>, the guests began to<span class=\"word\" data-word=\"go off\">go off</span> and the new couple<span class=\"word\" data-word=\"set off\"> set off </span>for home, too. After that, <span class=\"word\" data-word=\"the media\">the media </span>reported on the <span class=\"word\" data-word=\"wedding\">wedding</span>.</p>"},{"title":"Morals and Virtues","html":"<p>People often talk about <span class=\"word\" data-word=\"morals\">morals</span> and what <span class=\"word\" data-word=\"virtue\">virtue</span> is. But sometimes they may face <span class=\"word\" data-word=\"moral dilemmas\">moral dilemmas</span>. For example, if an old man <span class=\"word\" data-word=\"tripped over\">tripped over</span> a stone or suddenly <span class=\"word\" data-word=\"fainted\">fainted</span> in the street or was <span class=\"word\" data-word=\"injured\">injured </span>in an <span class=\"word\" data-word=\"accident\">accident</span>, what would be your first <span class=\"word\" data-word=\"response\">response</span>? Should you <span class=\"word\" data-word=\"assist\">assist</span> him to rise or give<span class=\"word\" data-word=\"first aid\">first aid</span>? Or just <span class=\"word\" data-word=\"stand by\">stand by</span>? This will <span class=\"word\" data-word=\"illustrate\">illustrate</span> what your <span class=\"word\" data-word=\"moral\">moral</span> and life <span class=\"word\" data-word=\"principles\">principles</span> are. In Lin Qiaozhi’s eyes, life is <span class=\"word\" data-word=\"precious\">precious</span>. When others <span class=\"word\" data-word=\"entrusted\">entrusted</span> her with their lives, it was <span class=\"word\" data-word=\"virtue\">virtue</span> that <span class=\"word\" data-word=\"carried\">carried</span> her<span class=\"word\" data-word=\"through\"> through </span>a life of hard choices. She did not choose <span class=\"word\" data-word=\"marriage\">marriage</span> as the <span class=\"word\" data-word=\"majority\">majority</span> of girls did, but chose to study medicine. <span class=\"word\" data-word=\"therefore\">Therefore</span>, her brother <span class=\"word\" data-word=\"responded\">responded</span> against her choice and <span class=\"word\" data-word=\"complained\">complained</span>about it, thinking of the high <span class=\"word\" data-word=\"tuition fees\">tuition fees</span>. After <span class=\"word\" data-word=\"graduation\">graduation</span>, Lin Qiaozhi won a <span class=\"word\" data-word=\"scholarship\">scholarship</span> from a <span class=\"word\" data-word=\"union\">union</span> and was <span class=\"word\" data-word=\"hired\">hired</span> as a <span class=\"word\" data-word=\"resident physician\">resident physician</span> in a famous hospital. Once she was <span class=\"word\" data-word=\"appointed\">appointed</span> as a visiting <span class=\"word\" data-word=\"scholar\">scholar </span>to a <span class=\"word\" data-word=\"clinic\">clinic</span> in a <span class=\"word\" data-word=\"faraway\">faraway </span>country. She <span class=\"word\" data-word=\"impressed\">impressed </span>her <span class=\"word\" data-word=\"colleagues\">colleagues</span> by <span class=\"word\" data-word=\"rejecting\">rejecting</span> a <span class=\"word\" data-word=\"well-paid\">well-paid</span> <span class=\"word\" data-word=\"offer\">offer</span>. In the <span class=\"word\" data-word=\"decades\">decades</span> after <span class=\"word\" data-word=\"liberation\">liberation</span>, Lin Qiaozhi was <span class=\"word\" data-word=\"elected\">elected</span> as leaders in many important <span class=\"word\" data-word=\"positions\">positions </span>and led all the<span class=\"word\" data-word=\"staff\">staff</span> to the medical <span class=\"word\" data-word=\"cause\">cause </span>of China. She <span class=\"word\" data-word=\"published a great\">published a great</span><span class=\"word\" data-word=\"deal of\">deal of</span> medical research. She did not <span class=\"word\" data-word=\"retire\">retire</span> until the day she<span class=\"word\" data-word=\"passed away\">passed away</span>, 22 April 1983.</p><p>There was an <span class=\"word\" data-word=\"earthquake\">earthquake </span>here. The <span class=\"word\" data-word=\"might\">might</span> of the earthquake brought more or less <span class=\"word\" data-word=\"harm\">harm</span>to <span class=\"word\" data-word=\"per\">per</span> family. Some people lived <span class=\"word\" data-word=\"in tears\">in tears</span>, <span class=\"word\" data-word=\"in tension\">in tension</span> or <span class=\"word\" data-word=\"in despair\">in despair</span>. Some people had bought <span class=\"word\" data-word=\"disaster\">disaster</span><span class=\"word\" data-word=\"insurance\">insurance</span> with their <span class=\"word\" data-word=\"income savings\">income savings</span>, while some people <span class=\"word\" data-word=\"tended to accept\">tended to accept</span> it. At <span class=\"word\" data-word=\"midnight\">midnight</span>, the <span class=\"word\" data-word=\"scared\">scared</span> and <span class=\"word\" data-word=\"passive\">passive</span> people couldn’t go <span class=\"word\" data-word=\"elsewhere\">elsewhere</span> but sit in the <span class=\"word\" data-word=\"square\">square </span>of the <span class=\"word\" data-word=\"kindergarten\">kindergarten</span>, listening to the <span class=\"word\" data-word=\"chairman\">chairman</span> tell <span class=\"word\" data-word=\"fables\">fables</span>. Mothers <span class=\"word\" data-word=\"whispered\">whispered</span> with their <span class=\"word\" data-word=\"lips\">lips</span> open and their children sleeping on their <span class=\"word\" data-word=\"laps\">laps</span> <span class=\"word\" data-word=\"regardless of\">regardless of </span>the mosquito <span class=\"word\" data-word=\"bites\">bites</span>. The chairman told a <span class=\"word\" data-word=\"chain\">chain</span> of <span class=\"word\" data-word=\"fables\">fables</span> as if <span class=\"word\" data-word=\"in memory\">in memory</span><span class=\"word\" data-word=\"of a moral\">of a moral </span>person. One of the <span class=\"word\" data-word=\"fables\">fables</span> began with a <span class=\"word\" data-word=\"disguised\">disguised</span> king. He left his <span class=\"word\" data-word=\"court\">court</span> and got into a <span class=\"word\" data-word=\"cart\">cart</span> for a visit. He hid behind a <span class=\"word\" data-word=\"maple\">maple</span> tree. He saw a customer <span class=\"word\" data-word=\"limp\">limp</span> into a <span class=\"word\" data-word=\"café\">café</span>. An <span class=\"word\" data-word=\"energetic\">energetic</span><span class=\"word\" data-word=\"waitress\">waitress</span> came up to greet him. However, he on purpose <span class=\"word\" data-word=\"spilt\">spilt</span> some dirty water on her and said some <span class=\"word\" data-word=\"sharp\">sharp</span> and unkind words. The <span class=\"word\" data-word=\"waitress\">waitress</span>smiled and apologized, but no one knew she was <span class=\"word\" data-word=\"pregnant\">pregnant</span>. The owner of the <span class=\"word\" data-word=\"café\">café</span> was a <span class=\"word\" data-word=\"flexible\">flexible</span> person, so the <span class=\"word\" data-word=\"operation\">operation</span> of the coffee shop was fairly good. The<span class=\"word\" data-word=\"café\">café </span>also<span class=\"word\" data-word=\"imported\">imported</span> and <span class=\"word\" data-word=\"exported\">exported</span> coffee.</p>"},{"title":"Diverse Cultures","html":"<p>While <span class=\"word\" data-word=\"admitting\">admitting</span> cultural <span class=\"word\" data-word=\"diversity\">diversity</span> or <span class=\"word\" data-word=\"diverse\">diverse</span> cultures, we should <span class=\"word\" data-word=\"explore\">explore </span>the <span class=\"word\" data-word=\"historical\">historical</span> <span class=\"word\" data-word=\"causes\">causes </span>of this phenomenon. <span class=\"word\" data-word=\"apart from\">Apart from</span> this, we should also understand Chinese <span class=\"word\" data-word=\"ethnic minority\">ethnic minority</span> cultures. In 1848, the discovery of gold near San Francisco <span class=\"word\" data-word=\"brought about\">brought about </span>a gold rush. Over 300, 000 people from all over the world crossed the <span class=\"word\" data-word=\"atlantic\">Atlantic</span> and <span class=\"word\" data-word=\"headed to\">headed to</span> San Francisco to <span class=\"word\" data-word=\"seek their fortune\">seek their fortune</span>. Some<span class=\"word\" data-word=\"immigrants\"> immigrants</span> <span class=\"word\" data-word=\"settled\">settled</span> down near <span class=\"word\" data-word=\"downtown\">downtown</span>, in the <span class=\"word\" data-word=\"mission\">Mission</span> <span class=\"word\" data-word=\"district\">District</span>. To <span class=\"word\" data-word=\"earn a living\">earn a living</span>, they opened up shops, <span class=\"word\" data-word=\"bars\">bars</span> and restaurants. The <span class=\"word\" data-word=\"climate\">climate</span> in San Francisco is <span class=\"word\" data-word=\"mild\">mild</span> all year round. Today a large <span class=\"word\" data-word=\"percentage\">percentage</span> of Chinese-Americans live in Chinatown. There visitors can buy fashionable <span class=\"word\" data-word=\"clothing\">clothing</span>, <span class=\"word\" data-word=\"souvenirs\">souvenirs</span>, <span class=\"word\" data-word=\"boots\">boots</span>, <span class=\"word\" data-word=\"jeans\">jeans</span>, <span class=\"word\" data-word=\"china\">china</span> <span class=\"word\" data-word=\"plates\">plates</span>and even Chinese <span class=\"word\" data-word=\"herbal\">herbal</span> medicine.</p><p>A <span class=\"word\" data-word=\"typhoon\">typhoon </span>hit the small town, <span class=\"word\" data-word=\"claiming\">claiming</span> hundreds of lives. Only a <span class=\"word\" data-word=\"minority\">minority</span> of the <span class=\"word\" data-word=\"residents\">residents</span><span class=\"word\" data-word=\"escaped\">escaped</span>, but the <span class=\"word\" data-word=\"disaster destroyed\">disaster destroyed </span>their homes and <span class=\"word\" data-word=\"caused\">caused </span>them <span class=\"word\" data-word=\"financial\">financial</span> difficulties. <span class=\"word\" data-word=\"afterwards a series of\">Afterwards a series of</span> things <span class=\"word\" data-word=\"occurred\">occurred</span> again. Some families took food from home with them, such as<span class=\"word\" data-word=\"spicy chips\">spicy chips</span>, <span class=\"word\" data-word=\"cheese\">cheese</span>, and <span class=\"word\" data-word=\"poisonous mushrooms\">poisonous mushrooms</span>. These mushrooms <span class=\"word\" data-word=\"contained\">contained</span> deadly<span class=\"word\" data-word=\"poison\">poison</span>. Some residents <span class=\"word\" data-word=\"folded\">folded</span> their<span class=\"word\" data-word=\"neat\">neat</span> clothing and other daily<span class=\"word\" data-word=\"items\">items</span>. They put them on their trucks together with<span class=\"word\" data-word=\"construction\">construction</span><span class=\"word\" data-word=\"materials\">materials</span> and <span class=\"word\" data-word=\"accessories\">accessories</span>. They were <span class=\"word\" data-word=\"definitely\">definitely</span> going to settle down in a new place. The children didn’t forget to bring their <span class=\"word\" data-word=\"journals\">journals</span>, <span class=\"word\" data-word=\"diagrams\">diagrams</span>, <span class=\"word\" data-word=\"jazz\">jazz</span> music boxes, <span class=\"word\" data-word=\"comics\">comics </span>and <span class=\"word\" data-word=\"graffiti\">graffiti </span>with them. Apart from these, they <span class=\"word\" data-word=\"selected\">selected</span> some<span class=\"word\" data-word=\"super collections\">super collections</span> which would <span class=\"word\" data-word=\"suit\">suit</span> their tastes.</p>"},{"title":"People of Achievement","html":"<p>Tu Youyou is <span class=\"word\" data-word=\"awarded\">awarded</span> the <span class=\"word\" data-word=\"nobel\">Nobel</span><span class=\"word\" data-word=\"prize\">Prize </span>for <span class=\"word\" data-word=\"physiology\">Physiology </span>or Medicine because she has discovered <span class=\"word\" data-word=\"artemisinin\">artemisinin</span>, a <span class=\"word\" data-word=\"crucial drug\">crucial drug </span>for <span class=\"word\" data-word=\"malaria\">malaria</span>. In fact,<span class=\"word\" data-word=\"artemisinin\"> artemisinin </span>has become a <span class=\"word\" data-word=\"vital\">vital</span> part of the <span class=\"word\" data-word=\"treatment\">treatment </span>for malaria. After graduating from university Youyou worked at the China <span class=\"word\" data-word=\"academy\">Academy </span>of Traditional Chinese Medicine. She <span class=\"word\" data-word=\"committed\">committed </span>herself to the <span class=\"word\" data-word=\"objective\">objective </span>of discovering a new treatment for malaria. She and her <span class=\"word\" data-word=\"scientific\">scientific</span> research team tried to find traditional <span class=\"word\" data-word=\"botanical\">botanical</span> treatments for the disease. They <span class=\"word\" data-word=\"evaluated\">evaluated</span>280,000 plants and tested 380 <span class=\"word\" data-word=\"distinct\">distinct </span>ancient Chinese medical treatments. Tu’s team tried <span class=\"word\" data-word=\"boiling\">boiling </span>fresh <span class=\"word\" data-word=\"wormwood\">wormwood</span>, and using the <span class=\"word\" data-word=\"liquid obtained\">liquid obtained</span> from this to treat malaria, but this did not work. Tu Youyou wouldn’t <span class=\"word\" data-word=\"acknowledge defeat\">acknowledge defeat</span>. She <span class=\"word\" data-word=\"insisted on analyzing\">insisted on analyzing </span>the medical texts again and drew a <span class=\"word\" data-word=\"conclusion\">conclusion </span>that <span class=\"word\" data-word=\"boiling\">boiling </span>the sweet <span class=\"word\" data-word=\"wormwood apparently\">wormwood apparently </span>destroyed its medical <span class=\"word\" data-word=\"properties\">properties</span>. By using a lower temperature to draw out the <span class=\"word\" data-word=\"extract\">extract</span>, she discovered the effective <span class=\"word\" data-word=\"substance\">substance</span>. <span class=\"word\" data-word=\"artemisinin\">Artemisinin</span>, like <span class=\"word\" data-word=\"penicillin\">penicillin</span>, has stood up to <span class=\"word\" data-word=\"clinical\">clinical </span>tests, just as other products or <span class=\"word\" data-word=\"devices\">devices</span> can stand <span class=\"word\" data-word=\"wear and tear\">wear and tear</span>.</p><p>The difference between a <span class=\"word\" data-word=\"novelist\">novelist </span>and a <span class=\"word\" data-word=\"professor\">professor </span>is that the former <span class=\"word\" data-word=\"mostly\">mostly </span>uses his <span class=\"word\" data-word=\"extraordinary\">extraordinary </span>creative <span class=\"word\" data-word=\"genius\">genius </span>to inspire people’s <span class=\"word\" data-word=\"passion\">passion </span>bywriting <span class=\"word\" data-word=\"novels\">novels</span>, <span class=\"word\" data-word=\"while\">while</span> the latter pays more attentionto <span class=\"word\" data-word=\"academic\">academic </span>research. A <span class=\"word\" data-word=\"politician\">politician </span>wants to <span class=\"word\" data-word=\"found\">found </span>his own <span class=\"word\" data-word=\"theories\">theories </span>and tries to<span class=\"word\" data-word=\"come to power\"> come to power</span>. Ascientist hopes to make <span class=\"word\" data-word=\"remarkable\">remarkable </span>achievementsand have more inventions and <span class=\"word\" data-word=\"patents\">patents</span>. Take<span class=\"word\" data-word=\"albert einstein\">Albert Einstein </span>for example. He made <span class=\"word\" data-word=\"numerous\">numerous </span>contributions to the world, the most well-knownbeing the general <span class=\"word\" data-word=\"theory of relativity\">theory of relativity </span>and thefamous <span class=\"word\" data-word=\"formula\">formula </span>E=mc 2. He earned a <span class=\"word\" data-word=\"doctorate\">doctorate </span>inphysics in 1905 and <span class=\"word\" data-word=\"gradually\">gradually </span>became famous asthe new Isaac Newton. <span class=\"word\" data-word=\"circumstances\">Circumstances </span>changed in 1933, when <span class=\"word\" data-word=\"hitler came to power\">Hitler came to power </span>in Germany. <span class=\"word\" data-word=\"einstein\">Einstein</span>, who was <span class=\"word\" data-word=\"jewish\">Jewish</span>, found the doors of <span class=\"word\" data-word=\"academic institutions\">academic institutions </span>closed to him. As a <span class=\"word\" data-word=\"consequence\">consequence</span>, he had to <span class=\"word\" data-word=\"flee\">flee </span>Germany. He finally <span class=\"word\" data-word=\"took up a position\">took up a position </span>as a researcher at the <span class=\"word\" data-word=\"institute\">Institute</span>for Advanced Study in <span class=\"word\" data-word=\"princeton\">Princeton</span>, USA. <span class=\"word\" data-word=\"einstein\">Einstein </span>wasnot only a <span class=\"word\" data-word=\"genius\">genius</span>, but also a very <span class=\"word\" data-word=\"gentle\">gentle </span>man. Hehad a thick <span class=\"word\" data-word=\"moustache\">moustache </span>and long white hair. Despitehis <span class=\"word\" data-word=\"peculiarities\">peculiarities</span>, he was loved by his friends and neighbors whom he <span class=\"word\" data-word=\"encountered\">encountered</span>. Nowlet’s complete this <span class=\"word\" data-word=\"flow chart\">flow chart </span>to <span class=\"word\" data-word=\"infer\">infer </span>his further achievements. You can also write a <span class=\"word\" data-word=\"draft\">draft </span>to <span class=\"word\" data-word=\"sum up\">sum up</span> <span class=\"word\" data-word=\"einstein\">Einstein</span>’s life.</p>"},{"title":"Looking Into The Future","html":"<p>I have to <span class=\"word\" data-word=\"persuade\">persuade</span> myself to use these words and <span class=\"word\" data-word=\"phrases\">phrases </span>to <span class=\"word\" data-word=\"describe\">describe </span>my <span class=\"word\" data-word=\"daily routine\">daily routine </span>in the future. If I forget to <span class=\"word\" data-word=\"switch off\">switch off </span>my <span class=\"word\" data-word=\"electrical appliances\">electrical appliances</span> like my <span class=\"word\" data-word=\"air conditioners\">air conditioners </span>and I’m in a <span class=\"word\" data-word=\"distant\">distant</span> place, my <span class=\"word\" data-word=\"integrated sensors\">integrated sensors </span>in my smart home system will do it for me instead of <span class=\"word\" data-word=\"remote controls\">remote controls</span> and <span class=\"word\" data-word=\"automatic knobs\">automatic knobs</span>. These <span class=\"word\" data-word=\"sensors\">sensors</span> are very <span class=\"word\" data-word=\"efficient\">efficient </span>and give <span class=\"word\" data-word=\"instant commands\">instant commands</span>. The home system will <span class=\"word\" data-word=\"obey\">obey </span>and give <span class=\"word\" data-word=\"constant warnings\">constant warnings </span>until the <span class=\"word\" data-word=\"appliances\">appliances </span>enter the safety <span class=\"word\" data-word=\"mode\">mode</span>. This will keep my home <span class=\"word\" data-word=\"secure\">secure</span>. In addition, my smart home can warn me <span class=\"word\" data-word=\"early on\">early on </span>if there is something <span class=\"word\" data-word=\"abnormal\">abnormal</span> or if I have a <span class=\"word\" data-word=\"critical\">critical </span>illness, such as <span class=\"word\" data-word=\"cancer\">cancer</span>, and <span class=\"word\" data-word=\"potentially\">potentially </span>save my life. If the <span class=\"word\" data-word=\"electrical wire\">electrical wire </span>starts <span class=\"word\" data-word=\"leaking\">leaking </span>electricity, my smart home will <span class=\"word\" data-word=\"detect\">detect </span>it and provide me with the <span class=\"word\" data-word=\"relevant\">relevant </span>information. <span class=\"word\" data-word=\"in\">In</span> <span class=\"word\" data-word=\"this sense\">this sense</span>, I will <span class=\"word\" data-word=\"fix\">fix </span>the problem before my home <span class=\"word\" data-word=\"catches fire\">catches fire</span>. <span class=\"word\" data-word=\"nevertheless\">Nevertheless</span>, this smart technology is not a <span class=\"word\" data-word=\"fantasy\">fantasy</span>. Many of these <span class=\"word\" data-word=\"innovations\">innovations </span>are already <span class=\"word\" data-word=\"available\">available</span> and being used in some homes.</p><p><span class=\"word\" data-word=\"artificial intelligence\">Artificial intelligence </span>can be used to <span class=\"word\" data-word=\"guard\">guard </span>against<span class=\"word\" data-word=\"potential crimes\">potential crimes </span>and gain a sense of <span class=\"word\" data-word=\"security\">security</span>. For example, the <span class=\"word\" data-word=\"librarian advocates combining\">librarian advocates combining</span><span class=\"word\" data-word=\"monitors\">monitors </span>into the <span class=\"word\" data-word=\"structure\">structure</span> of the library building. <span class=\"word\" data-word=\"hence\">Hence</span>, no one is <span class=\"word\" data-word=\"opposed\">opposed </span>to this suggestion. Theyare a <span class=\"word\" data-word=\"necessity\">necessity</span>, but not a <span class=\"word\" data-word=\"luxury\">luxury</span>. Now let’s changethe <span class=\"word\" data-word=\"subject\">subject</span>, and talk about our future <span class=\"word\" data-word=\"occupations\">occupations</span>and <span class=\"word\" data-word=\"careers\">careers</span>. We should learn to <span class=\"word\" data-word=\"predict\">predict </span>or makea <span class=\"word\" data-word=\"prediction\">prediction </span>about the future, because we can’t<span class=\"word\" data-word=\"resist\">resist </span>the development of society. So we must <span class=\"word\" data-word=\"keep in touch with\">keep in touch with </span>the <span class=\"word\" data-word=\"latest\">latest </span>technology, and place <span class=\"word\" data-word=\"emphasis\">emphasis </span>on these new technologies, such as <span class=\"word\" data-word=\"cloning\">cloning</span>,<span class=\"word\" data-word=\"nanobots\"> nanobots </span>and <span class=\"word\" data-word=\"satellite\">satellite </span>weather <span class=\"word\" data-word=\"forecast\">forecast</span>. Each of us is <span class=\"word\" data-word=\"required\">required </span>to write an <span class=\"word\" data-word=\"essay\">essay </span>with several <span class=\"word\" data-word=\"paragraphs\">paragraphs </span>to give an <span class=\"word\" data-word=\"accurate\">accurate </span>description of our future <span class=\"word\" data-word=\"careers\">careers</span>. I think the <span class=\"word\" data-word=\"prospect\">prospect </span>of <span class=\"word\" data-word=\"rural\">rural </span>development is very <span class=\"word\" data-word=\"attractive\">attractive</span>. There can’t be an <span class=\"word\" data-word=\"absence\">absence </span>of <span class=\"word\" data-word=\"rural talents\">rural talents</span>. My <span class=\"word\" data-word=\"preference\">preference </span>is farming. <span class=\"word\" data-word=\"even if\">Even if </span>I <span class=\"word\" data-word=\"encounter resistance\">encounter resistance</span>, I will never <span class=\"word\" data-word=\"cease\">cease</span> to go and work there.</p>"},{"title":"Fascinating Parks","html":"<p>A group of <span class=\"word\" data-word=\"journalists set out\">journalists set out </span>for the <span class=\"word\" data-word=\"polar\">polar </span>area. They came to a <span class=\"word\" data-word=\"fascinating valley\">fascinating valley </span>near the <span class=\"word\" data-word=\"boundary\">boundary</span>, where they would <span class=\"word\" data-word=\"camp\">camp</span>. The north wind was <span class=\"word\" data-word=\"buffeting\">buffeting </span>the <span class=\"word\" data-word=\"cloth\">cloth </span>of their <span class=\"word\" data-word=\"tent\">tent</span>. At the <span class=\"word\" data-word=\"edge\">edge </span>of the <span class=\"word\" data-word=\"valley\">valley</span>, they found a small <span class=\"word\" data-word=\"cottage\">cottage</span>. A <span class=\"word\" data-word=\"visible glacier\">visible glacier </span>from the top of the mountain <span class=\"word\" data-word=\"flowed\">flowed </span>through the <span class=\"word\" data-word=\"valley\">valley</span>. The <span class=\"word\" data-word=\"vast territory stretched\">vast territory stretched </span>as far as the eye could see. A lot of <span class=\"word\" data-word=\"reindeer\">reindeer </span>were <span class=\"word\" data-word=\"on\">on</span> <span class=\"word\" data-word=\"the move\">the move</span>,<span class=\"word\" data-word=\"accompanied\"> accompanied </span>by some local people to prevent <span class=\"word\" data-word=\"leopards\">leopards </span>from hurting them. Hunting was <span class=\"word\" data-word=\"banned\">banned </span>here. All the <span class=\"word\" data-word=\"journalists\">journalists </span>felt really <span class=\"word\" data-word=\"blessed\">blessed</span> to be in such a beautiful place. <span class=\"word\" data-word=\"nevertheless\">Nevertheless</span>, there was only one <span class=\"word\" data-word=\"unpleasant\">unpleasant </span>thing. A woman <span class=\"word\" data-word=\"journalist\">journalist</span> had a cold and <span class=\"word\" data-word=\"sneezed\">sneezed </span>all the time. The <span class=\"word\" data-word=\"cream\">cream </span>she had put in the <span class=\"word\" data-word=\"teapot\">teapot </span>turned <span class=\"word\" data-word=\"sour\">sour</span>, too. She turned the <span class=\"word\" data-word=\"teapot upside down\">teapot upside down </span>and poured out the <span class=\"word\" data-word=\"sour\">sour</span> <span class=\"word\" data-word=\"cream\">cream</span>.</p><p>I was <span class=\"word\" data-word=\"wandering\">wandering </span>along the <span class=\"word\" data-word=\"corridor\">corridor</span>of the <span class=\"word\" data-word=\"amusement\">amusement </span>park. A <span class=\"word\" data-word=
